<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>西游杀 — 卡牌闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0a06;--gold:#c9a84c;--gold-br:#e8c96a;--gold-dim:#7a6438;--red:#c84040;--red-d:#8a2828;--green:#3aa050;--blue:#4a8ac8;--purple:#8850c0;--orange:#c88838;--teal:#2a9890;--gray:#989088;--text:#e8e0d0;--text-dim:#998878;--card-w:56px;--card-h:80px;--glow-gold:0 0 20px rgba(201,168,76,.3);--shadow-card:0 4px 12px rgba(0,0,0,.5);--shadow-panel:0 2px 8px rgba(0,0,0,.4)}
body{background:
repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(201,168,76,.015) 20px,rgba(201,168,76,.015) 21px),
radial-gradient(ellipse at 50% 0%,#2a1808 0%,transparent 50%),
radial-gradient(ellipse at 50% 100%,#1a1208 0%,transparent 50%),
#0d0a06;
color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.screen{min-height:100vh;display:flex;flex-direction:column}

/* Title */
#title-screen{align-items:center;justify-content:center;text-align:center;background:
radial-gradient(ellipse at 50% 20%,rgba(201,168,76,.18) 0%,transparent 55%),
radial-gradient(ellipse at 30% 80%,rgba(138,40,40,.1) 0%,transparent 50%),
radial-gradient(ellipse at 75% 70%,rgba(74,26,107,.06) 0%,transparent 45%),
linear-gradient(180deg,#1a1008 0%,#0d0a06 40%,#15100a 70%,#1a0e06 100%);
position:relative;overflow:hidden}
#title-screen::before{content:'';position:absolute;inset:0;background-image:
radial-gradient(2px 2px at 15% 25%,rgba(201,168,76,.35),transparent),
radial-gradient(1px 1px at 55% 65%,rgba(201,168,76,.25),transparent),
radial-gradient(2px 2px at 75% 15%,rgba(232,201,106,.3),transparent),
radial-gradient(1px 1px at 25% 75%,rgba(201,168,76,.2),transparent),
radial-gradient(1.5px 1.5px at 65% 35%,rgba(232,201,106,.2),transparent),
radial-gradient(1px 1px at 85% 55%,rgba(201,168,76,.2),transparent),
radial-gradient(2px 2px at 8% 45%,rgba(232,201,106,.25),transparent),
radial-gradient(1px 1px at 45% 85%,rgba(201,168,76,.15),transparent),
radial-gradient(1.5px 1.5px at 92% 80%,rgba(201,168,76,.2),transparent),
radial-gradient(1px 1px at 35% 10%,rgba(232,201,106,.2),transparent);
animation:titleParticle 8s ease-in-out infinite;pointer-events:none;z-index:0}
#title-screen::after{content:'';position:absolute;inset:0;background:
repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(201,168,76,.012) 20px,rgba(201,168,76,.012) 21px);
pointer-events:none;z-index:0}
@keyframes titleParticle{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title-avatar{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:2.6em;margin-bottom:14px;background:radial-gradient(circle,#2a2218,#181208);box-shadow:0 0 30px rgba(201,168,76,.45),inset 0 0 14px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.5);animation:avatarFloat 4s ease-in-out infinite;position:relative;z-index:1;overflow:hidden}
.title-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
@keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.game-title{font-size:3.2em;color:var(--gold-br);margin-bottom:4px;letter-spacing:.18em;font-weight:bold;background:linear-gradient(180deg,#f0d878,#c9a84c 60%,#a08030);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(201,168,76,.4));position:relative;z-index:1;animation:titleGlow 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 18px rgba(201,168,76,.4))}50%{filter:drop-shadow(0 0 32px rgba(201,168,76,.7))}}
.title-glow-line{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:2px auto 8px;position:relative;z-index:1;opacity:.6;animation:lineGlow 3s ease-in-out infinite}
@keyframes lineGlow{0%,100%{opacity:.4;width:180px}50%{opacity:.8;width:240px}}
.game-sub{font-size:.9em;color:var(--text-dim);margin-bottom:22px;text-shadow:0 1px 2px rgba(0,0,0,.6);position:relative;z-index:1;letter-spacing:.1em}
.card-fan{display:flex;justify-content:center;margin-bottom:20px;position:relative;z-index:1;height:50px}
.card-fan .fan-card{width:34px;height:48px;border-radius:4px;border:1px solid var(--gold-dim);flex-shrink:0;box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:.6em;color:rgba(255,255,255,.5);font-weight:bold;letter-spacing:.1em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card-fan .fan-card:nth-child(1){transform:rotate(-18deg) translateY(8px);margin-right:-12px}
.card-fan .fan-card:nth-child(2){transform:rotate(-6deg) translateY(3px);margin-right:-12px}
.card-fan .fan-card:nth-child(3){transform:rotate(6deg) translateY(3px);margin-right:-12px}
.card-fan .fan-card:nth-child(4){transform:rotate(18deg) translateY(8px)}
.title-buttons{position:relative;z-index:1}
#title-screen .btn{position:relative;z-index:1;min-width:200px;animation:btnFadeIn .6s ease-out backwards}
.title-btn-2{animation-delay:.15s}
@keyframes btnFadeIn{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
.title-footer{margin-top:24px;font-size:.76em;color:var(--text-dim);position:relative;z-index:1;line-height:1.8;opacity:.7}
.footer-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:6px auto}
.btn{padding:11px 34px;font-size:1em;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.25),rgba(201,168,76,.1));color:var(--gold-br);border-radius:8px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);margin:5px;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.5);text-shadow:0 1px 3px rgba(0,0,0,.7);position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
.btn:hover{background:linear-gradient(180deg,rgba(201,168,76,.42),rgba(201,168,76,.22));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.2),0 0 24px rgba(201,168,76,.5),0 4px 14px rgba(0,0,0,.5);transform:translateY(-2px)}
.btn:hover::before{left:120%}
.btn:active{transform:translateY(0);box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.3)}
.btn-sm{padding:7px 16px;font-size:.85em;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(201,168,76,.15),rgba(201,168,76,.06));color:var(--text);border-radius:6px;cursor:pointer;margin:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 5px rgba(0,0,0,.35);transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.btn-sm::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transition:left .4s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold-br);background:linear-gradient(180deg,rgba(201,168,76,.28),rgba(201,168,76,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 14px rgba(201,168,76,.3),0 2px 6px rgba(0,0,0,.4);transform:translateY(-1px)}
.btn-sm:hover::before{left:110%}
.btn-sm:active{transform:translateY(0)}
.btn-sm:disabled{opacity:.3;cursor:not-allowed;transform:none!important}

/* Story */
#story-screen{align-items:center;justify-content:center;text-align:center;padding:30px 20px}
.story-title{font-size:1.5em;color:var(--gold-br);margin-bottom:12px}
.story-text{font-size:1em;line-height:1.8;max-width:420px;margin-bottom:25px;color:#c8c0b0}
.story-chapter{color:var(--orange);font-size:.9em;margin-bottom:8px}

/* Battle — SanGuoSha mobile style */
#battle-screen{padding:0;gap:0;background:
repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(201,168,76,.01) 30px,rgba(201,168,76,.01) 31px),
radial-gradient(ellipse at 50% 50%,rgba(40,28,12,.3) 0%,transparent 70%),
linear-gradient(180deg,#1a1208,#0a0806),#0a0806}
.battle-header{text-align:center;padding:4px 8px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;position:relative}
.battle-header .chapter{color:var(--orange);font-size:.75em}
.battle-header .title{color:var(--gold-br);font-size:1em;font-weight:bold}
.phase-indicator{font-size:.7em;padding:1px 8px;border-radius:10px;background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold-br);white-space:nowrap}
.phase-indicator.enemy-turn{background:rgba(200,64,64,.15);border-color:var(--red-d);color:#e87878}
.phase-indicator.discard{background:rgba(152,144,136,.15);border-color:var(--gray);color:#b0a898}
.snd-toggle{position:absolute;top:8px;right:8px;background:rgba(201,168,76,.12);border:1px solid var(--gold-dim);border-radius:6px;color:var(--gold-br);font-size:1em;cursor:pointer;padding:2px 8px;z-index:50}
.snd-toggle:hover{background:rgba(201,168,76,.25)}
.char-row{display:flex;align-items:center;gap:8px;padding:6px 10px}
.char-avatar{width:46px;height:46px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:1.5em;flex-shrink:0;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.5);position:relative}
.char-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.char-avatar.enemy{border-color:var(--red-d);background:radial-gradient(circle,#3a1818 0%,#1a0808 100%);box-shadow:0 0 0 1px rgba(138,40,40,.5),0 0 14px rgba(138,40,40,.35),0 3px 8px rgba(0,0,0,.5)}
.char-avatar.player{border-color:var(--gold-dim);background:radial-gradient(circle,#2a2218 0%,#181208 100%);box-shadow:0 0 0 1px rgba(122,100,56,.5),0 0 14px rgba(201,168,76,.25),0 3px 8px rgba(0,0,0,.5)}
.char-info-block{flex:1;min-width:0}
.char-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.char-name{font-size:.95em;font-weight:bold}
.char-name.enemy{color:#e87878}
.char-name.player{color:var(--gold-br)}
.hp-wrap{display:inline-flex;align-items:center;gap:4px}
.hp-bar-track{width:80px;height:13px;background:#0a0804;border:1px solid rgba(80,60,30,.5);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.hp-bar-fill{height:100%;border-radius:7px;transition:width .3s;position:relative}
.hp-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:7px 7px 0 0}
.hp-bar-fill.high{background:linear-gradient(90deg,#2a8030,#3aa050);box-shadow:0 0 8px rgba(58,160,80,.45)}
.hp-bar-fill.mid{background:linear-gradient(90deg,#c8a030,#e8c040);box-shadow:0 0 8px rgba(232,192,64,.45)}
.hp-bar-fill.low{background:linear-gradient(90deg,#a02020,#c84040);box-shadow:0 0 8px rgba(200,64,64,.55);animation:hpLowPulse 1.5s ease-in-out infinite}
@keyframes hpLowPulse{0%,100%{opacity:1}50%{opacity:.7}}
.hp-text{font-size:.8em;color:var(--text-dim)}
.equip-slots{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.equip-tag{font-size:.68em;padding:1px 6px;border-radius:3px;white-space:nowrap}
.equip-tag.weapon{background:rgba(200,136,56,.2);border:1px solid var(--orange);color:#d8a060}
.equip-tag.armor{background:rgba(42,152,144,.15);border:1px solid var(--teal);color:#4aaaa0}
.equip-tag.mount{background:rgba(152,144,136,.15);border:1px solid var(--gray);color:#b0a898}
.judge-tag{font-size:.68em;padding:1px 6px;border-radius:3px;background:rgba(200,64,64,.15);border:1px solid var(--red-d);color:#d87878;white-space:nowrap}
.enemy-area{background:linear-gradient(180deg,rgba(22,8,8,.65),rgba(16,6,6,.45));border-bottom:1px solid rgba(80,30,30,.35);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.enemy-hand{display:flex;gap:2px;padding:3px 10px 5px;min-height:32px;flex-wrap:nowrap;overflow-x:auto}
.card-back{width:22px;height:32px;flex-shrink:0;background:linear-gradient(135deg,#4a3210 0%,#2a1c08 50%,#1a1408 100%);border:1px solid var(--gold-dim);border-radius:4px;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.card-back::before{content:'';position:absolute;inset:2px;border:1px solid rgba(201,168,76,.2);border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(201,168,76,.05) 3px,rgba(201,168,76,.05) 4px)}
.card-back::after{content:'';position:absolute;top:50%;left:50%;width:10px;height:10px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,168,76,.25),transparent 70%);border-radius:50%}
.battlefield{min-height:52px;max-height:82px;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px;background:radial-gradient(ellipse at center,rgba(201,168,76,.05),transparent 70%),rgba(0,0,0,.18);overflow:hidden;position:relative;border-top:1px solid rgba(60,50,30,.2);border-bottom:1px solid rgba(60,50,30,.2)}
.battlefield .field-card{width:44px;height:62px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.6em;font-weight:bold;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.battlefield .field-card.from-player{animation:fieldCardFromPlayer .4s ease-out}
.battlefield .field-card.from-enemy{animation:fieldCardFromEnemy .4s ease-out}
.battlefield .field-label{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:.5em;color:var(--text-dim);white-space:nowrap}
@keyframes fieldCardFromPlayer{0%{transform:translateY(60px) scale(.5);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes fieldCardFromEnemy{0%{transform:translateY(-60px) scale(.5);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.battle-log{flex:1;background:rgba(0,0,0,.25);padding:4px 10px;overflow-y:auto;font-size:.78em;line-height:1.5;min-height:40px;max-height:80px}
.battle-log p{margin:1px 0}
.log-system{color:var(--orange)}
.log-player{color:#7ab8e8}
.log-enemy{color:#e87878}
.log-damage{color:#ff6b6b}
.log-heal{color:var(--green)}
.player-area{background:linear-gradient(180deg,rgba(20,16,10,.55),rgba(24,20,12,.75));border-top:1px solid rgba(60,50,30,.35);box-shadow:inset 0 2px 0 rgba(201,168,76,.06)}
.player-hand{display:flex;gap:3px;padding:8px 10px 4px;min-height:var(--card-h);flex-wrap:nowrap;overflow-x:auto;justify-content:center}
.card{width:var(--card-w);height:var(--card-h);border-radius:6px;padding:3px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s,box-shadow .15s;user-select:none;position:relative;flex-shrink:0;box-shadow:var(--shadow-card);overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-radius:5px;pointer-events:none;z-index:1}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);pointer-events:none;z-index:1;border-radius:6px 6px 0 0}
.card:hover{transform:translateY(-10px);box-shadow:0 8px 24px rgba(201,168,76,.5),0 0 0 1px rgba(201,168,76,.3);z-index:10}
.card.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.card.disabled:hover{transform:none;box-shadow:var(--shadow-card)}
.card.basic-sha{border:1.5px solid var(--red);background:linear-gradient(160deg,#5a1a12 0%,#3a0e08 50%,#1a0604 100%)}
.card.basic-shan{border:1.5px solid var(--blue);background:linear-gradient(160deg,#1a3a54 0%,#0a1428 50%,#080a1a 100%)}
.card.basic-tao{border:1.5px solid var(--green);background:linear-gradient(160deg,#1a5a30 0%,#0a2810 50%,#081a08 100%)}
.card.trick{border:1.5px solid var(--purple);background:linear-gradient(160deg,#3a1a58 0%,#1a0e28 50%,#14081a 100%)}
.card.delay{border:1.5px solid var(--red-d);background:linear-gradient(160deg,#4a1414 0%,#1a0808 50%,#140606 100%)}
.card.equip-weapon{border:1.5px solid var(--orange);background:linear-gradient(160deg,#5a3818 0%,#2a1c08 50%,#1a1408 100%)}
.card.equip-armor{border:1.5px solid var(--teal);background:linear-gradient(160deg,#1a3a30 0%,#0a1c14 50%,#081a14 100%)}
.card.equip-mount{border:1.5px solid var(--gray);background:linear-gradient(160deg,#2a2a28 0%,#121210 50%,#0e0e0a 100%)}
.card-type-badge{font-size:.42em;text-align:center;padding:1px 0;font-weight:bold;letter-spacing:.1em;z-index:2;position:relative;border-radius:2px 2px 0 0;text-shadow:0 1px 1px rgba(0,0,0,.8)}
.card.basic-sha .card-type-badge{background:linear-gradient(90deg,rgba(200,64,64,.3),rgba(200,64,64,.15));color:#e85050}
.card.basic-shan .card-type-badge{background:linear-gradient(90deg,rgba(42,120,200,.3),rgba(42,120,200,.15));color:#5a9adc}
.card.basic-tao .card-type-badge{background:linear-gradient(90deg,rgba(58,160,80,.3),rgba(58,160,80,.15));color:#4aaa60}
.card.trick .card-type-badge{background:linear-gradient(90deg,rgba(136,80,192,.3),rgba(136,80,192,.15));color:#b890d8}
.card.delay .card-type-badge{background:linear-gradient(90deg,rgba(200,40,40,.3),rgba(200,40,40,.15));color:#e85050}
.card.equip-weapon .card-type-badge{background:linear-gradient(90deg,rgba(200,136,56,.3),rgba(200,136,56,.15));color:#d8a060}
.card.equip-armor .card-type-badge{background:linear-gradient(90deg,rgba(42,152,144,.3),rgba(42,152,144,.15));color:#4aaaa0}
.card.equip-mount .card-type-badge{background:linear-gradient(90deg,rgba(152,144,136,.25),rgba(152,144,136,.12));color:#b0a898}
.battlefield .field-card.basic-sha .card-type-badge{background:rgba(200,64,64,.25);color:#e85050}
.battlefield .field-card.basic-shan .card-type-badge{background:rgba(42,120,200,.25);color:#5a9adc}
.battlefield .field-card.basic-tao .card-type-badge{background:rgba(58,160,80,.25);color:#4aaa60}
.battlefield .field-card.trick .card-type-badge{background:rgba(136,80,192,.25);color:#b890d8}
.battlefield .field-card.delay .card-type-badge{background:rgba(200,40,40,.25);color:#e85050}
.battlefield .field-card.equip-weapon .card-type-badge{background:rgba(200,136,56,.25);color:#d8a060}
.battlefield .field-card.equip-armor .card-type-badge{background:rgba(42,152,144,.25);color:#4aaaa0}
.battlefield .field-card.equip-mount .card-type-badge{background:rgba(152,144,136,.2);color:#b0a898}
.card-corner{font-size:.58em;text-align:left;line-height:1;padding:1px;z-index:2;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.9)}
.card-corner.red{color:#e85050}
.card-corner.black{color:#b0a898}
.card-name{font-size:.72em;text-align:center;font-weight:bold;line-height:1.1;flex:1;display:flex;align-items:center;justify-content:center;padding:2px;z-index:2;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.card-desc{font-size:.48em;text-align:center;color:#b0a090;overflow:hidden;line-height:1.1;padding:0 1px;z-index:2;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.card-selected{box-shadow:0 0 20px var(--gold-br),0 0 40px rgba(201,168,76,.3),inset 0 0 10px rgba(201,168,76,.1)!important;transform:translateY(-12px)!important;border-color:var(--gold-br)!important}
.actions{display:flex;gap:6px;justify-content:center;padding:4px 10px 6px;flex-wrap:wrap}
.skill-btn{padding:5px 12px;font-size:.8em;border:1px solid var(--purple);background:linear-gradient(180deg,rgba(136,80,192,.25),rgba(136,80,192,.1));color:#c4a0e0;border-radius:6px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.4);transition:all .2s cubic-bezier(.4,0,.2,1);text-shadow:0 1px 3px rgba(0,0,0,.7);position:relative;overflow:hidden}
.skill-btn::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(200,160,240,.2),transparent);transition:left .4s}
.skill-btn:hover:not(:disabled){background:linear-gradient(180deg,rgba(136,80,192,.4),rgba(136,80,192,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 14px rgba(136,80,192,.4),0 3px 8px rgba(0,0,0,.4);transform:translateY(-1px)}
.skill-btn:hover:not(:disabled)::before{left:110%}
.skill-btn:active:not(:disabled){transform:translateY(0)}
.skill-btn:disabled{opacity:.3;cursor:not-allowed}
.buff-list{font-size:.72em;color:var(--orange);margin:2px 0}
.char-avatar.targetable{border-color:var(--gold-br)!important;box-shadow:0 0 12px var(--gold-br);animation:targetPulse 1s ease-in-out infinite}
@keyframes targetPulse{0%,100%{box-shadow:0 0 8px var(--gold-br)}50%{box-shadow:0 0 20px var(--gold-br)}}
.equip-mini{width:20px;height:28px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:.45em;font-weight:bold;cursor:help;position:relative;flex-shrink:0;overflow:hidden}
.equip-mini.weapon{border:1px solid var(--orange);background:rgba(200,136,56,.2);color:#d8a060}
.equip-mini.armor{border:1px solid var(--teal);background:rgba(42,152,144,.15);color:#4aaaa0}
.equip-mini.mount{border:1px solid var(--gray);background:rgba(152,144,136,.15);color:#b0a898}
.equip-mini .eq-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:var(--text);padding:3px 6px;border-radius:3px;font-size:.8em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.equip-mini:hover .eq-tip{opacity:1}
.player-hand{display:flex;gap:2px;padding:8px 10px 4px;min-height:var(--card-h);flex-wrap:nowrap;overflow-x:auto;justify-content:center;perspective:600px}

/* ====== Animations & Effects ====== */
@keyframes cardDraw{0%{transform:translateX(-200px) rotate(-15deg);opacity:0}100%{transform:translateX(0) rotate(0);opacity:1}}
@keyframes cardPlay{0%{transform:translateY(0) scale(1);opacity:1}40%{transform:translateY(-40px) scale(1.15);opacity:1}100%{transform:translateY(-80px) scale(.5);opacity:0}}
@keyframes cardDiscard{0%{transform:scale(1);opacity:1}100%{transform:scale(.3) rotate(20deg);opacity:0}}
@keyframes damageFlash{0%,100%{background:transparent}30%{background:rgba(200,40,40,.35)}}
@keyframes healGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(58,160,80,.6)}}
@keyframes screenShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
@keyframes skillPulse{0%,100%{box-shadow:0 0 0 rgba(136,80,192,0)}50%{box-shadow:0 0 25px rgba(136,80,192,.7)}}
@keyframes hpBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes turnGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 15px rgba(201,168,76,.5)}}
@keyframes fadeInUp{0%{transform:translateY(15px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes enemyEnter{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes glowBorder{0%,100%{border-color:var(--gold-dim)}50%{border-color:var(--gold-br)}}
.anim-draw{animation:cardDraw .4s ease-out}
.anim-play{animation:cardPlay .5s ease-in forwards}
.anim-discard{animation:cardDiscard .35s ease-in forwards}
.fx-damage{animation:damageFlash .4s ease-out}
.fx-heal{animation:healGlow .6s ease-out}
.fx-shake{animation:screenShake .4s ease-out}
.fx-skill{animation:skillPulse .6s ease-out}
.fx-hpchange{animation:hpBounce .3s ease-out}
.fx-turn{animation:turnGlow .8s ease-out}
.fx-fadein{animation:fadeInUp .3s ease-out}
.fx-enemy-enter{animation:enemyEnter .5s ease-out}
.fx-flip{animation:cardFlip .4s ease-out}
.fx-glow-border{animation:glowBorder 1s ease-in-out}
.card-entering{animation:cardDraw .35s ease-out}
/* damage float */
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.dmg-float{position:absolute;font-size:1.2em;font-weight:bold;color:#ff4444;text-shadow:0 0 8px rgba(255,68,68,.6),0 2px 2px rgba(0,0,0,.8);animation:floatUp 1s ease-out forwards;pointer-events:none;z-index:60;left:50%;transform:translateX(-50%)}
.dmg-float.heal{color:#44ff66;text-shadow:0 0 8px rgba(68,255,102,.6),0 2px 2px rgba(0,0,0,.8)}
/* target highlight */
@keyframes targetHintPulse{0%,100%{box-shadow:0 0 0 rgba(200,64,64,0)}50%{box-shadow:0 0 20px rgba(200,64,64,.8)}}
.target-hint{animation:targetHintPulse .6s ease-in-out infinite}
/* boss entrance */
@keyframes bossEntry{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.boss-entry{animation:bossEntry .8s ease-out}
/* card flip reveal */
@keyframes flipReveal{0%{transform:rotateY(180deg) scale(.8);opacity:0}50%{transform:rotateY(90deg) scale(1);opacity:.5}100%{transform:rotateY(0) scale(1);opacity:1}}
.flip-reveal{animation:flipReveal .5s ease-out}
#fx-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:hidden}
/* === Enhanced VFX === */
@keyframes vfxSlash{0%{transform:translate(-50%,0) rotate(-45deg) scaleX(0);opacity:0}20%{opacity:1}60%{transform:translate(-50%,0) rotate(-45deg) scaleX(1.5)}100%{transform:translate(-50%,0) rotate(-45deg) scaleX(2);opacity:0}}
.vfx-slash{position:absolute;top:30%;left:50%;width:200px;height:6px;background:linear-gradient(90deg,transparent,#fff 30%,#ff4444 50%,#fff 70%,transparent);border-radius:3px;box-shadow:0 0 20px #ff4444,0 0 40px rgba(255,68,68,.4);animation:vfxSlash .5s ease-out forwards;pointer-events:none;z-index:55}
@keyframes vfxImpact{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5);opacity:.8}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.vfx-impact{position:absolute;top:35%;left:50%;width:120px;height:120px;border-radius:50%;border:4px solid #ff6644;background:radial-gradient(circle,rgba(255,100,60,.3),transparent 70%);animation:vfxImpact .5s ease-out forwards;pointer-events:none;z-index:54}
@keyframes vfxSpark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}}
.vfx-spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--sc,#ffaa44);box-shadow:0 0 8px var(--sc,#ffaa44);animation:vfxSpark .6s ease-out forwards;pointer-events:none;z-index:56}
@keyframes vfxHealAura{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}30%{opacity:.6}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
.vfx-heal-aura{position:absolute;top:50%;left:50%;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(68,255,102,.25),transparent 70%);border:2px solid rgba(68,255,102,.3);animation:vfxHealAura .8s ease-out forwards;pointer-events:none;z-index:54}
@keyframes vfxHealCross{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0}40%{transform:translate(-50%,-50%) scale(1.2) rotate(180deg);opacity:.8}100%{transform:translate(-50%,-50%) scale(1.8) rotate(360deg);opacity:0}}
.vfx-heal-cross{position:absolute;top:45%;left:50%;width:60px;height:60px;animation:vfxHealCross .8s ease-out forwards;pointer-events:none;z-index:55}
.vfx-heal-cross::before,.vfx-heal-cross::after{content:'';position:absolute;background:linear-gradient(transparent,#44ff66,transparent);border-radius:3px;box-shadow:0 0 12px #44ff66}
.vfx-heal-cross::before{top:0;left:50%;transform:translateX(-50%);width:8px;height:100%}
.vfx-heal-cross::after{left:0;top:50%;transform:translateY(-50%);width:100%;height:8px}
@keyframes vfxSkillBurst{0%{transform:translate(-50%,-50%) scale(0);opacity:0}30%{transform:translate(-50%,-50%) scale(1);opacity:.7}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.vfx-skill-burst{position:absolute;top:50%;left:50%;width:80px;height:80px;border-radius:50%;border:3px solid var(--skill-color,#aa66dd);background:radial-gradient(circle,var(--skill-bg,rgba(136,80,192,.2)),transparent 70%);animation:vfxSkillBurst .7s ease-out forwards;pointer-events:none;z-index:55}
@keyframes vfxScreenFlash{0%{opacity:0}15%{opacity:.4}100%{opacity:0}}
.vfx-flash{position:fixed;inset:0;pointer-events:none;z-index:49;animation:vfxScreenFlash .3s ease-out forwards}
@keyframes vfxRipple{0%{transform:translate(-50%,-50%) scale(0);opacity:.8}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.vfx-ripple{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;border:2px solid var(--gold-br);animation:vfxRipple .6s ease-out forwards;pointer-events:none;z-index:54}
@keyframes vfxDust{0%{transform:translate(0,0) scale(1);opacity:.6}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.vfx-dust{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold-dim);animation:vfxDust .8s ease-out forwards;pointer-events:none;z-index:53}
@keyframes vfxVictoryRay{0%{transform:rotate(0) scaleY(0);opacity:0}50%{opacity:.3}100%{transform:rotate(360deg) scaleY(1);opacity:0}}
.vfx-victory-ray{position:fixed;top:50%;left:50%;width:2px;height:100vh;transform-origin:top center;background:linear-gradient(to bottom,transparent,rgba(201,168,76,.4),transparent;pointer-events:none;z-index:48;animation:vfxVictoryRay 1.5s ease-out forwards}
@keyframes vfxLevelUpRing{0%{transform:translate(-50%,-50%) scale(0);opacity:1;border-width:6px}50%{opacity:.6;border-width:3px}100%{transform:translate(-50%,-50%) scale(3);opacity:0;border-width:1px}}
.vfx-levelup-ring{position:fixed;top:40%;left:50%;width:100px;height:100px;border-radius:50%;border:6px solid #ffd700;box-shadow:0 0 30px #ffd700;animation:vfxLevelUpRing 1s ease-out forwards;pointer-events:none;z-index:70}
.turn-tag{font-size:.65em;padding:1px 5px;border-radius:3px;background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold-br)}
.turn-tag.enemy{background:rgba(200,64,64,.15);border-color:var(--red-d);color:#d87878}

/* Response modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:linear-gradient(180deg,#2a2018,#1a140e);border:1px solid var(--gold);border-radius:10px;padding:18px 20px;max-width:360px;text-align:center;box-shadow:0 0 40px rgba(201,168,76,.3),0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.modal-title{font-size:1em;color:var(--gold-br);margin-bottom:8px}
.modal-text{font-size:.9em;margin-bottom:12px;line-height:1.6;color:#c8c0b0}
.modal-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal-buttons .btn{padding:8px 22px;font-size:.92em;margin:2px}

/* Event */
#event-screen{align-items:center;justify-content:center;text-align:center;padding:30px 20px}
.event-choices{display:flex;flex-direction:column;gap:8px;max-width:380px;margin:15px auto}
.event-choice{padding:12px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(201,168,76,.08),rgba(201,168,76,.03));border-radius:7px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden}
.event-choice::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transition:left .4s}
.event-choice:hover{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.18),rgba(201,168,76,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 16px rgba(201,168,76,.25),0 3px 8px rgba(0,0,0,.3);transform:translateX(4px)}
.event-choice:hover::before{left:110%}

/* Level select */
#level-screen{padding:15px}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px;margin-top:12px}
.level-btn{padding:6px 3px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(201,168,76,.06),rgba(201,168,76,.02));border-radius:6px;cursor:pointer;font-size:.72em;text-align:center;transition:all .2s cubic-bezier(.4,0,.2,1);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.level-btn:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 10px rgba(201,168,76,.2),0 3px 6px rgba(0,0,0,.3)}
.level-btn.locked{opacity:.3;cursor:not-allowed}
.level-btn.tutorial{border-color:var(--orange)}
.level-btn.plot{border-color:#888}
.level-btn.light{border-color:var(--green)}
.level-btn.boss{border-color:var(--red)}
.level-btn.event{border-color:var(--purple)}
.level-btn.finale{border-color:var(--gold);background:rgba(201,168,76,.1)}
.level-btn.current{border-color:var(--gold);border-width:2px}

/* Game over / victory */
#over-screen,#victory-screen{align-items:center;justify-content:center;text-align:center}
.over-title{font-size:1.8em;margin-bottom:12px}
.over-title.lose{color:var(--red)}
.over-title.win{color:var(--gold-br)}

/* Char select */
.char-select{display:flex;gap:12px;justify-content:center;margin:15px 0;flex-wrap:wrap}
.char-card{padding:12px;border:1.5px solid var(--gold-dim);background:linear-gradient(180deg,rgba(28,22,18,.85),rgba(20,16,12,.8));border-radius:10px;cursor:pointer;text-align:center;transition:all .25s cubic-bezier(.4,0,.2,1);min-width:110px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.4);position:relative;overflow:hidden}
.char-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 16px rgba(201,168,76,.25),0 6px 16px rgba(0,0,0,.5)}
.char-card.selected{border-color:var(--gold-br);box-shadow:0 0 16px rgba(201,168,76,.4),inset 0 0 10px rgba(201,168,76,.08);transform:translateY(-5px)}
.char-card.injured{opacity:.4;cursor:not-allowed}
.char-card .ch-name{font-size:1em;color:var(--gold-br);margin-bottom:4px}
.char-card .ch-hp{font-size:.8em;color:var(--green)}
.char-card .ch-skill{font-size:.68em;color:var(--text-dim);margin-top:3px}
.char-card .ch-lv{font-size:.72em;color:var(--gold);margin-top:2px;font-weight:bold}
.char-confirm-btn{background:linear-gradient(180deg,rgba(201,168,76,.3),rgba(201,168,76,.12));border-color:var(--gold);color:var(--gold-br);font-size:1.05em;padding:12px 32px;letter-spacing:.1em;animation:glowBorder 1.5s ease-in-out infinite;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 20px rgba(201,168,76,.3),0 3px 10px rgba(0,0,0,.5);position:relative;overflow:hidden}
.char-confirm-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .5s}
.char-confirm-btn:hover{background:linear-gradient(180deg,rgba(201,168,76,.45),rgba(201,168,76,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 30px rgba(201,168,76,.55),0 4px 14px rgba(0,0,0,.5);transform:translateY(-2px)}
.char-confirm-btn:hover::before{left:120%}
.char-confirm-btn:active{transform:translateY(0)}

/* XP bar */
.xp-bar-track{width:100%;height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:2px}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-br));transition:width .4s ease;border-radius:3px}
.lv-badge{display:inline-block;padding:1px 6px;border-radius:3px;background:rgba(201,168,76,.2);border:1px solid var(--gold-dim);color:var(--gold-br);font-size:.7em;font-weight:bold;margin-left:4px}

/* Skill tree screen */
#skilltree-screen{padding:15px;align-items:center;justify-content:flex-start;text-align:center}
.skilltree-info{margin:10px 0 15px;padding:8px 16px;border:1px solid var(--gold-dim);border-radius:8px;background:rgba(201,168,76,.06);display:inline-block}
.skilltree-info .ski-name{font-size:1.1em;color:var(--gold-br);font-weight:bold}
.skilltree-info .ski-level{font-size:.85em;color:var(--green);margin:3px 0}
.skilltree-info .ski-pts{font-size:.85em;color:var(--gold)}
.skilltree-list{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%}
.skill-node{padding:12px 15px;border:1.5px solid var(--gold-dim);background:linear-gradient(180deg,rgba(28,22,18,.85),rgba(20,16,12,.8));border-radius:8px;text-align:left;transition:all .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.skill-node:hover{border-color:var(--gold)}
.skill-node.locked{opacity:.5;cursor:not-allowed}
.skill-node.unlocked{border-color:var(--green);background:linear-gradient(180deg,rgba(20,40,20,.6),rgba(16,28,16,.5))}
.skill-node-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.skill-node-name{font-size:1em;color:var(--gold-br);font-weight:bold}
.skill-node-status{font-size:.7em;padding:2px 8px;border-radius:3px}
.skill-node-status.owned{background:rgba(80,200,80,.2);border:1px solid var(--green);color:#6fd86f}
.skill-node-status.available{background:rgba(201,168,76,.2);border:1px solid var(--gold);color:var(--gold-br)}
.skill-node-status.locked{background:rgba(100,100,100,.15);border:1px solid #555;color:#888}
.skill-node-desc{font-size:.82em;color:var(--text-dim);line-height:1.5}
.skill-node-cost{font-size:.75em;color:var(--gold);margin-top:4px}
.skill-node-btn{margin-top:8px;padding:6px 18px;font-size:.85em;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.22),rgba(201,168,76,.08));border-radius:7px;color:var(--gold-br);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 6px rgba(0,0,0,.35);position:relative;overflow:hidden}
.skill-node-btn::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transition:left .4s}
.skill-node-btn:hover{background:linear-gradient(180deg,rgba(201,168,76,.38),rgba(201,168,76,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 14px rgba(201,168,76,.35),0 3px 8px rgba(0,0,0,.4);transform:translateY(-1px)}
.skill-node-btn:hover::before{left:110%}
.skill-node-btn:active{transform:translateY(0)}
.skill-node-btn:disabled{opacity:.4;cursor:not-allowed}

/* Level up animation */
@keyframes levelUpPop{0%{transform:scale(0) rotate(-10deg);opacity:0}50%{transform:scale(1.3) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.levelup-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;padding:20px 40px;background:linear-gradient(180deg,#2a2018,#1a140e);border:2px solid var(--gold-br);border-radius:12px;text-align:center;box-shadow:0 0 60px rgba(201,168,76,.5),0 8px 40px rgba(0,0,0,.7);animation:levelUpPop .5s ease-out}
.levelup-popup .lu-title{font-size:1.5em;color:var(--gold-br);font-weight:bold;margin-bottom:8px}
.levelup-popup .lu-detail{font-size:.9em;color:var(--green);margin-bottom:6px}

/* Battle header improvements */
.battle-header .lv-badge{vertical-align:middle}

@media(max-width:600px){
:root{--card-w:50px;--card-h:72px}
.card-name{font-size:.68em}
.card-desc{font-size:.46em}
.game-title{font-size:2em}
.char-avatar{width:38px;height:38px;font-size:1.1em}
.card-back{width:18px;height:26px}
.hp-bar-track{width:60px}
}
@media(prefers-reduced-motion:reduce){
.card,.btn,.event-choice,.char-card{transition:none}
.card:hover{transform:none}
}

/* Account system */
.acct-input{width:200px;padding:8px 12px;font-size:.95em;background:rgba(28,22,18,.8);border:1px solid var(--gold-dim);border-radius:6px;color:var(--text);text-align:center;margin:6px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.acct-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.3),inset 0 1px 3px rgba(0,0,0,.4)}
.acct-input::placeholder{color:#666}
.acct-card{padding:14px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(28,22,18,.85),rgba(20,16,12,.8));border-radius:10px;margin:8px 0;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.4)}
.acct-card.official{border-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 12px rgba(201,168,76,.2)}
.acct-card.banned{opacity:.5;border-color:var(--red)}
.acct-name{font-size:1em;color:var(--gold-br);font-weight:bold;margin-bottom:4px}
.acct-badge{display:inline-block;font-size:.65em;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.acct-badge.official{background:rgba(201,168,76,.2);border:1px solid var(--gold);color:var(--gold-br)}
.acct-badge.banned{background:rgba(200,64,64,.2);border:1px solid var(--red);color:#e07070}
.acct-info{font-size:.8em;color:var(--text-dim);margin-top:4px}
.acct-actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.acct-admin-panel{margin-top:15px;padding:12px;border:1px solid var(--gold-dim);border-radius:8px;background:rgba(201,168,76,.05)}
.acct-admin-title{font-size:.9em;color:var(--gold-br);margin-bottom:8px;font-weight:bold}

/* MP system */
.mp-spinner{width:36px;height:36px;border:3px solid rgba(201,168,76,.15);border-top-color:var(--gold);border-radius:50%;margin:15px auto;animation:mp-spin 1s linear infinite}
@keyframes mp-spin{to{transform:rotate(360deg)}}
.mp-char-card{padding:10px 14px;border:2px solid var(--gold-dim);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;background:rgba(28,22,18,.6);min-width:70px}
.mp-char-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.mp-char-card.selected{border-color:var(--gold);background:rgba(201,168,76,.12);box-shadow:0 0 12px rgba(201,168,76,.2)}
.mp-char-card .mp-char-icon{font-size:1.8em;margin-bottom:4px}
.mp-char-card .mp-char-name{font-size:.8em;color:var(--text-dim)}
.mp-char-card.selected .mp-char-name{color:var(--gold)}
.mp-result-banner{font-size:1.6em;font-weight:bold;margin:15px 0}
.mp-result-banner.win{color:var(--gold)}
.mp-result-banner.lose{color:#e07070}
.changelog-entry{margin-bottom:18px;padding:12px 14px;border-left:3px solid var(--gold-dim);background:rgba(28,22,18,.5);border-radius:0 8px 8px 0}
.changelog-ver{font-size:1.05em;font-weight:bold;color:var(--gold);margin-bottom:4px}
.changelog-date{font-size:.75em;color:var(--text-dim);margin-bottom:6px}
.changelog-list{list-style:none;padding:0;margin:0}
.changelog-list li{padding:3px 0;font-size:.88em;color:var(--text-main);line-height:1.5}
.changelog-tag{display:inline-block;font-size:.7em;padding:1px 6px;border-radius:4px;margin-right:4px;font-weight:bold}
.changelog-tag.new{background:rgba(76,175,80,.2);color:#5cb85c}
.changelog-tag.fix{background:rgba(244,67,54,.15);color:#e85d54}
.changelog-tag.opt{background:rgba(33,150,243,.15);color:#4a9eea}
</style>
</head>
<body>
<div id="app">

<!-- 标题界面 -->
<div id="title-screen" class="screen">
<div class="title-particles" id="title-particles"></div>
<div class="title-avatar" id="title-avatar">🐵</div>
<h1 class="game-title">西 游 杀</h1>
<div class="title-glow-line"></div>
<p class="game-sub">取经路上的八十一难 · 一牌一战皆系天命</p>
<div class="card-fan">
<div class="fan-card" style="--fan-c:#8b0000;background:linear-gradient(160deg,#1a0000,#8b0000)">降<br>妖</div>
<div class="fan-card" style="--fan-c:#1a5c1a;background:linear-gradient(160deg,#001a00,#1a5c1a)">蟠<br>桃</div>
<div class="fan-card" style="--fan-c:#4a1a6b;background:linear-gradient(160deg,#0a0010,#4a1a6b)">锦<br>囊</div>
<div class="fan-card" style="--fan-c:#6b4a1a;background:linear-gradient(160deg,#1a0a00,#6b4a1a)">装<br>备</div>
</div>
<div class="title-buttons">
<button class="btn title-btn-1" onclick="startNewGame()">新的旅程</button>
<button class="btn title-btn-2" id="continue-btn" style="display:none" onclick="continueGame()">继续游戏</button>
<button class="btn-sm" onclick="showAccount()" style="margin-top:8px;opacity:.6">账号</button>
<button class="btn-sm" onclick="showMP()" style="margin-top:4px;opacity:.6">联机对战</button>
<button class="btn-sm" onclick="showHelp()" style="margin-top:4px;opacity:.6">游戏介绍</button>
<button class="btn-sm" onclick="showChangelog()" style="margin-top:4px;opacity:.6">更新日志</button>
</div>
<div class="title-footer">
<div class="footer-line"></div>
玩法照搬三国杀标准版 · 手牌改名不改效果
<div class="footer-line"></div>
</div>
</div>

<!-- 剧情界面 -->
<div id="story-screen" class="screen hidden">
<p class="story-chapter" id="story-chapter"></p>
<h2 class="story-title" id="story-title"></h2>
<p class="story-text" id="story-text"></p>
<button class="btn" id="story-btn" onclick="afterStory()">继续</button>
</div>

<!-- 角色选择界面 -->
<div id="charselect-screen" class="screen hidden">
<h2 class="story-title">选择出战角色</h2>
<div class="char-select" id="char-select-cards"></div>
<p style="font-size:.85em;color:var(--text-dim)">未出战的角色将在休息中恢复体力</p>
<button class="btn char-confirm-btn" id="char-confirm-btn" onclick="confirmCharSelect()" style="display:none;margin-top:12px">确认出战</button>
</div>

<!-- 战斗界面 -->
<div id="battle-screen" class="screen hidden">
<div id="mp-chat-box" style="position:fixed;bottom:50px;right:10px;width:200px;max-height:120px;overflow-y:auto;background:rgba(0,0,0,0.7);border-radius:8px;padding:6px;display:none;z-index:100;font-size:12px"></div>
<div class="battle-header">
<span class="chapter" id="bt-chapter"></span>
<span class="title" id="bt-title"></span>
<span class="phase-indicator" id="phase-ind"></span>
<button class="snd-toggle" id="snd-toggle" onclick="SND.toggleMute();this.textContent=SND.muted?'🔇':'🔊'">🔊</button>
</div>
<div class="enemy-area" id="enemy-area">
<div class="char-row">
<div class="char-avatar enemy" id="enemy-avatar">👹</div>
<div class="char-info-block">
<div class="char-name-row">
<span class="char-name enemy" id="enemy-name"></span>
<span class="hp-wrap"><span class="hp-bar-track"><span class="hp-bar-fill" id="enemy-hpbar"></span></span><span class="hp-text" id="enemy-hptext"></span></span>
<span id="enemy-buffs"></span>
</div>
<div class="equip-slots" id="enemy-equips"></div>
</div>
</div>
<div class="enemy-hand" id="enemy-hand"></div>
</div>
<div class="battlefield" id="battlefield"></div>
<div class="battle-log" id="battle-log"></div>
<div class="player-area">
<div class="char-row">
<div class="char-avatar player" id="player-avatar">🐵</div>
<div class="char-info-block">
<div class="char-name-row">
<span class="char-name player" id="player-name"></span>
<span class="hp-wrap"><span class="hp-bar-track"><span class="hp-bar-fill" id="player-hpbar"></span></span><span class="hp-text" id="player-hptext"></span></span>
<span id="player-buffs"></span>
</div>
<div class="equip-slots" id="player-equips"></div>
<div id="player-judge"></div>
</div>
</div>
<div class="player-hand" id="player-hand"></div>
<div class="actions" id="player-actions">
<button class="btn-sm" id="end-turn-btn" onclick="endPlayerTurn()">结束回合</button>
<button class="btn-sm" id="mp-chat-btn" onclick="mpToggleChat()" style="display:none">💬</button>
</div>
</div>
</div>

<!-- 响应弹窗 -->
<div class="modal-overlay hidden" id="response-modal">
<div class="modal-box">
<p class="modal-title" id="response-title"></p>
<p class="modal-text" id="response-text"></p>
<div class="modal-buttons" id="response-buttons"></div>
</div>
</div>

<!-- 事件界面 -->
<div id="event-screen" class="screen hidden">
<p class="story-chapter" id="event-chapter"></p>
<h2 class="story-title" id="event-title"></h2>
<p class="story-text" id="event-text"></p>
<div class="event-choices" id="event-choices"></div>
</div>

<!-- 关卡选择 -->
<div id="level-screen" class="screen hidden">
<h2 class="story-title">关卡选择</h2>
<div style="margin-bottom:10px">
<button class="btn-sm" onclick="showScreen('title-screen')">返回</button>
<button class="btn-sm" onclick="showSkillTree()">技能修炼</button>
</div>
<div class="level-grid" id="level-grid"></div>
</div>

<!-- 失败界面 -->
<div id="over-screen" class="screen hidden">
<h2 class="over-title lose" id="over-title">败北</h2>
<p class="story-text" id="over-text"></p>
<div id="over-buttons">
<button class="btn" onclick="retryLevel()">重试本关</button>
<button class="btn" onclick="showLevelSelect()">关卡选择</button>
</div>
</div>

<!-- 胜利界面 -->
<div id="victory-screen" class="screen hidden">
<h2 class="over-title win">通关！</h2>
<p class="story-text">历经八十一难，终于取得真经，功德圆满！</p>
<button class="btn" onclick="location.reload()">重新开始</button>
</div>

<!-- 技能树界面 -->
<div id="skilltree-screen" class="screen hidden">
<h2 class="story-title" id="skilltree-title">技能修炼</h2>
<div class="skilltree-info" id="skilltree-info"></div>
<div class="skilltree-list" id="skilltree-list"></div>
<button class="btn" onclick="closeSkillTree()" style="margin-top:15px">返回</button>
</div>

<!-- 账号界面 -->
<div id="account-screen" class="screen hidden">
<h2 class="story-title">账号中心</h2>
<div id="account-content" style="max-width:380px;margin:0 auto;text-align:center"></div>
</div>

<!-- 联机对战界面 -->
<div id="mp-screen" class="screen hidden">
<h2 class="story-title">联机对战</h2>
<p style="color:var(--text-dim);margin-bottom:12px">选择角色，开始对战</p>
<div id="mp-char-select" style="display:flex;gap:10px;justify-content:center;margin-bottom:18px"></div>
<div style="display:flex;flex-direction:column;gap:8px;max-width:260px;margin:0 auto">
<button class="btn" onclick="mpQuickMatch()">快速匹配</button>
<button class="btn" onclick="mpCreateRoom()">创建房间</button>
<div style="display:flex;gap:6px">
<input class="acct-input" id="mp-join-code" placeholder="房间号" maxlength="4" style="flex:1;text-transform:uppercase;font-size:.85em">
<button class="btn-sm" style="white-space:nowrap" onclick="mpJoinRoom()">加入</button>
</div>
<button class="btn-sm" onclick="showScreen('title-screen')" style="margin-top:6px">返回</button>
</div>
</div>

<!-- 联机等待界面 -->
<div id="mp-wait-screen" class="screen hidden">
<h2 class="story-title" id="mp-wait-title">搜索中...</h2>
<p style="color:var(--text-dim);margin-bottom:18px" id="mp-wait-sub"></p>
<div id="mp-wait-code" style="font-size:2.4em;letter-spacing:8px;color:var(--gold);font-weight:bold;margin:20px 0;display:none"></div>
<div class="mp-spinner" id="mp-spinner"></div>
<button class="btn-sm" onclick="mpCancel()" style="margin-top:20px">取消</button>
</div>

<!-- 更新日志界面 -->
<div id="changelog-screen" class="screen hidden">
<h2 class="story-title">更新日志</h2>
<div id="changelog-content" style="max-width:420px;margin:0 auto;padding:0 10px"></div>
<button class="btn-sm" onclick="showScreen('title-screen')" style="margin-top:15px">返回</button>
</div>

<!-- 游戏介绍界面 -->
<div id="help-screen" class="screen hidden">
<h2 class="story-title">游戏介绍</h2>
<div id="help-content" style="max-width:460px;margin:0 auto;padding:0 12px;text-align:left;font-size:.88em;line-height:1.7"></div>
<button class="btn-sm" onclick="showScreen('title-screen')" style="margin-top:15px">返回</button>
</div>

</div>
<div id="fx-overlay"></div>

// ==================== 音效系统 ====================
const SND={ctx:null,master:null,enabled:true,muted:false,
init(){
if(this.ctx)return;
try{
this.ctx=new(window.AudioContext||window.webkitAudioContext)();
this.master=this.ctx.createGain();
this.master.gain.value=.7;
// simple reverb via convolver
this.reverb=this.ctx.createConvolver();
const rl=this.ctx.sampleRate*1.2;
const rb=this.ctx.createBuffer(2,rl,this.ctx.sampleRate);
for(let c=0;c<2;c++){const d=rb.getChannelData(c);for(let i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3)}
this.reverb.buffer=rb;
this.revGain=this.ctx.createGain();this.revGain.gain.value=.18;
this.dryGain=this.ctx.createGain();this.dryGain.gain.value=.85;
this.master.connect(this.dryGain);this.dryGain.connect(this.ctx.destination);
this.master.connect(this.reverb);this.reverb.connect(this.revGain);this.revGain.connect(this.ctx.destination);
}catch(e){this.enabled=false}
},
toggleMute(){this.muted=!this.muted;return this.muted},
// core: oscillator with ADSR envelope + optional filter
_voice(freq,dur,type,vol,filterFreq,delay){
if(!this.enabled||this.muted)return;this.init();if(!this.ctx)return;
const t0=this.ctx.currentTime+(delay||0);
const o=this.ctx.createOscillator(),g=this.ctx.createGain();
o.type=type||"sine";o.frequency.value=freq;
const v=vol||.08;
g.gain.setValueAtTime(0,t0);
g.gain.linearRampToValueAtTime(v,t0+.008);
g.gain.exponentialRampToValueAtTime(v*.6,t0+.04);
g.gain.exponentialRampToValueAtTime(.0001,t0+(dur||.15));
let node=o;
if(filterFreq){const f=this.ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=filterFreq;f.Q.value=1;o.connect(f);node=f}
node.connect(g);g.connect(this.master);
o.start(t0);o.stop(t0+(dur||.15)+.02);
},
// pitch slide voice
_slide(f1,f2,dur,type,vol,filterFreq,delay){
if(!this.enabled||this.muted)return;this.init();if(!this.ctx)return;
const t0=this.ctx.currentTime+(delay||0);
const o=this.ctx.createOscillator(),g=this.ctx.createGain();
o.type=type||"sine";
o.frequency.setValueAtTime(f1,t0);
o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t0+dur);
const v=vol||.08;
g.gain.setValueAtTime(0,t0);
g.gain.linearRampToValueAtTime(v,t0+.008);
g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
let node=o;
if(filterFreq){const f=this.ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=filterFreq;o.connect(f);node=f}
node.connect(g);g.connect(this.master);
o.start(t0);o.stop(t0+dur+.02);
},
// noise burst with filter
_noise(dur,vol,filterType,filterFreq,delay){
if(!this.enabled||this.muted)return;this.init();if(!this.ctx)return;
const t0=this.ctx.currentTime+(delay||0);
const bs=Math.floor(this.ctx.sampleRate*dur);
const buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate);
const d=buf.getChannelData(0);
for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,2);
const n=this.ctx.createBufferSource();n.buffer=buf;
const g=this.ctx.createGain();
g.gain.setValueAtTime(vol||.05,t0);
g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
let node=n;
if(filterFreq){const f=this.ctx.createBiquadFilter();f.type=filterType||"lowpass";f.frequency.value=filterFreq;n.connect(f);node=f}
node.connect(g);g.connect(this.master);
n.start(t0);
},
// play multiple voices in parallel
_chord(freqs,dur,type,vol,delay){freqs.forEach(f=>this._voice(f,dur,type,vol,delay))},
// sequence with timing
_seq(notes){notes.forEach(n=>{const d=n[n.length-1]||0;if(n.length>=5&&typeof n[1]==='number'&&typeof n[2]==='number'&&n[1]!==n[2])this._slide(n[0],n[1],n[2],n[3],n[4],null,d);else this._voice(n[0],n[1],n[2],n[3],null,d)})},

skillUnlock(){this._seq([[659,.08,"sine",.05,0],[880,.08,"sine",.05,70],[1100,.1,"sine",.06,140],[1320,.12,"sine",.05,230],[1760,.15,"sine",.04,330]])},
// new enhanced sounds

death(){this._seq([[330,.1,"sawtooth",.05,0],[220,.12,"sawtooth",.045,80],[110,.3,"sine",.05,180]]);this._noise(.15,.04,"lowpass",500,null,100)},
buttonClick(){this._voice(500,.02,"square",.03);this._voice(700,.02,"square",.02,null,15)},
titleMusic(){this._seq([[523,.15,"sine",.05,0],[659,.15,"sine",.05,150],[784,.15,"sine",.05,300],[659,.15,"sine",.045,450],[523,.15,"sine",.045,600],[587,.15,"sine",.05,750],[659,.3,"sine",.055,900]])},

function fxOverlay(){return document.getElementById("fx-overlay")}
function fxSpawn(cls,style){
const ov=fxOverlay();if(!ov)return null;
const d=document.createElement("div");d.className=cls;
if(style)Object.assign(d.style,style);
ov.appendChild(d);setTimeout(()=>d.remove(),1200);return d
}

// ====== 战场出牌展示 ======
function getCardClass(card){
if(!card)return"card";
if(card.type==="basic")return"card basic-"+(card.basicSubtype||card.key);
if(card.type==="equip")return"card equip-"+(card.equipSubtype||"weapon");
return"card "+card.type;
}
function getTypeLabel(card){
if(!card)return"";
return card.type==='basic'?'基本':card.type==='trick'?'锦囊':card.type==='delay'?'劫':card.type==='equip'?(card.equipSubtype==='weapon'?'武器':card.equipSubtype==='armor'?'防具':'坐骑'):'';
}
function showFieldCard(card,side){
const bf=document.getElementById("battlefield");if(!bf||!card)return;
const d=document.createElement("div");
d.className="field-card "+(side==="player"?"from-player":"from-enemy");
const cls=getCardClass(card);
d.classList.add(cls.replace("card ",""));
const suitRed=isRed(card.suit);
d.innerHTML=`<div class="card-type-badge" style="font-size:.36em">${getTypeLabel(card)}</div><div class="card-corner ${suitRed?'red':'black'}" style="font-size:.5em">${card.suit||""}${card.rank||""}</div><div style="flex:1;display:flex;align-items:center">${card.name}</div>`;
const label=document.createElement("div");
label.className="field-label";
label.textContent=side==="player"?"我方":"敌方";
d.appendChild(label);
bf.appendChild(d);
return d;
}
function clearFieldCards(){const bf=document.getElementById("battlefield");if(bf)bf.innerHTML=""}
function removeFieldCard(el){if(el){el.style.transition="all .3s";el.style.opacity="0";el.style.transform="scale(.3)";setTimeout(()=>el.remove(),300)}}

// ==================== 构建牌堆 ====================
function buildDeck(){
const deck=[];let id=0;
for(const[key,def]of Object.entries(CARD_DEF)){
const suits=CARD_SUITS[key]||[];
const count=CARD_COUNTS[key]||suits.length;
for(let i=0;i<count;i++){
const sr=suits[i%suits.length];
const suit=sr[0],rank=sr[1];
const red=isRed(suit);
let cls=def.t;
if(def.t==='basic')cls='basic-'+def.st;
if(def.t==='equip')cls='equip-'+def.st;
deck.push({id:id++,key:key,name:def.n,type:def.t,basicSubtype:def.st||null,equipSubtype:def.st||null,range:def.r||null,suit:suit,rank:rank,red:red,desc:def.d,cls:cls});
}
}
return shuffle(deck);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// 检查角色是否解锁了某技能
function hasSkill(charKey,skillKey){
const u=G.partyUnlocked&&G.partyUnlocked[charKey];
return u&&u[skillKey];
}
// 获取技能等级(被动技能可能有多级)
function getSkillLv(charKey,skillKey){
const u=G.partyUnlocked&&G.partyUnlocked[charKey];
return u&&u[skillKey]?u[skillKey]:0;
}
// 检查战斗技能是否存在(兼容角色对象数组与Boss字符串数组)
function hasSk(s,k){if(!s||!s.skills)return false;return s.skills.some(x=>typeof x==='string'?x===k:x.key===k)}

const FINALE_LEVELS=[80,81];

function levelType(n){
if(n===0)return"tutorial";
if(PLOT_LEVELS.includes(n))return"plot";
if(FINALE_LEVELS.includes(n))return"finale";
if(EVENT_LEVELS.includes(n))return"event";
if(LIGHT_LEVELS.includes(n))return"light";
return"boss";
}

const GENERIC_BOSS_NAMES=["妖王","魔头","山精","水怪","夜叉","罗刹","鬼将","妖道","魔修","邪灵","蛮妖","毒蛟"];

function getBoss(n){
if(KEY_BOSSES[n])return KEY_BOSSES[n];
const t=levelType(n);
if(t!=="boss"&&t!=="light"&&t!=="finale")return null;
if(t==="light")return{name:"小妖",hp:3+Math.floor(n/20),draw:2,skills:[]};
const hp=Math.min(4+Math.floor(n/8),8);
const draw=n>40?3:2;
const name=GENERIC_BOSS_NAMES[n%GENERIC_BOSS_NAMES.length]+"·第"+n+"难";
const skills=[];
if(n>=20)skills.push("generic1");
if(n>=40)skills.push("generic2");
return{name,hp,draw,skills};
}

partyExp:{wukong:0},partyLevel:{wukong:1},partySkillPoints:{wukong:0},

function makeCombatant(charKey,bossData){
const char=CHARS[charKey];
let hp=bossData?bossData.hp:char.maxHp;
let maxHp=bossData?bossData.hp:char.maxHp;
const drawCount=bossData?bossData.draw:2;
// player level bonus: +1 maxHp per 2 levels above 1
if(!bossData){
const lv=(G.partyLevel&&G.partyLevel[charKey])||1;
const lvBonus=Math.floor((lv-1)/2);
maxHp+=lvBonus;
hp+=lvBonus;
}
// collect unlocked skills
let skills=bossData?bossData.skills:(char.skills||[]).map(s=>({...s}));
let skillsDef=bossData?null:char.skills.map(s=>({...s}));
if(!bossData&&SKILL_TREE[charKey]){
const unlocked=G.partyUnlocked&&G.partyUnlocked[charKey]||{};
Object.entries(SKILL_TREE[charKey]).forEach(([key,node])=>{
if(unlocked[key]){
const lv=typeof unlocked[key]==='number'?unlocked[key]:1;
skills.push({key:key,name:node.name,desc:node.desc,perTurn:node.maxLv?lv:1});
if(skillsDef)skillsDef.push({key:key,name:node.name,desc:node.desc,perTurn:node.maxLv?lv:1});
}
});
}
return{
charKey:charKey,name:bossData?bossData.name:char.name,
hp:hp,maxHp:maxHp,drawCount:drawCount,
hand:[],equipment:{weapon:null,armor:null,mount:null,defMount:null},
judge:[],shaPlayed:false,
skills:skills,skillUsed:{},
alive:true,skillsDef:skillsDef,
isEnemy:!!bossData,
bossData:bossData,
};
}

// ==================== 工具函数 ====================
function log(msg,cls=""){G.log.push({msg,cls});renderLog()}
function drawFromDeck(n=1){const cards=[];for(let i=0;i<n;i++){if(G.deck.length===0){G.deck=shuffle(G.discard);G.discard=[];log("牌堆重洗","log-system")}if(G.deck.length>0)cards.push(G.deck.pop())}return cards}
function findCard(side,key){return side.hand.findIndex(c=>c.key===key)}
function hasCard(side,key){return side.hand.some(c=>c.key===key)}
function dist(a,b){let d=1;if(a.equipment.mount)d--;if(b.equipment.defMount)d++;return Math.max(1,d)}
function canPlayBasic(side,card){
if(card.key==="sha"&&side.shaPlayed&&!(side.equipment.weapon&&(side.equipment.weapon.key==="crossbow"||side.equipment.weapon.key==="zhuge")))return{ok:false,msg:"每回合限出一张降妖"};
if(card.key==="sha"){
const opp=side.isEnemy?G.player:G.enemy;
const d=dist(side,opp);
const range=side.equipment.weapon?(side.equipment.weapon.range||1):1;
if(d>range)return{ok:false,msg:"距离不够，需武器或坐骑"};
}
return{ok:true}
}

function discardCard(idx){
const p=G.player;
// MP guest mode: send to host
if(G.mpMode&&!G.mpIsHost){
if(!G.awaitingResponse||G.awaitingResponse.type!=='discard')return;
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_action',id:MP.myId,action:'discard',cardIdx:idx,ts:Date.now()});
p.hand.splice(idx,1);
G.awaitingResponse.need--;
if(G.awaitingResponse.need<=0){G.awaitingResponse=null;G.turn='enemy';renderBattle()}
else{renderHand()}
return;
}
const card=p.hand.splice(idx,1)[0];
G.discard.push(card);
log("弃置"+card.name,"log-system");
G.awaitingResponse.need--;
if(G.awaitingResponse.need<=0){
G.awaitingResponse=null;
log("你结束了回合","log-player");
G.turn="enemy";
setPhase("敌方回合","enemy");
renderBattle();
if(G.mpMode&&G.mpIsHost&&!G.mpBot){setTimeout(()=>mpGuestTurnStart(),500)}
else{setTimeout(()=>aiTurn(),500)}
return;
}
renderHand();
}
function canPlayCardNow(card){
if(card.key==="shan")return false;
if(card.key==="wuxie")return false;

const r=canPlayBasic(G.player,card);
if(!r.ok)return false;
}
if(card.key==="tao"&&G.player.hp>=G.player.maxHp)return false;
return true;
}

// ==================== 出牌逻辑 ====================
function onCardClick(idx){
const p=G.player;
const card=p.hand[idx];
if(!card)return;
// MP guest mode: send action to host
if(G.mpMode&&!G.mpIsHost){
if(G.turn==='player'&&G.phase==='play'&&!G.awaitingResponse){
if(canPlayCardNow(card)){
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_action',id:MP.myId,action:'play_card',cardIdx:idx,ts:Date.now()});
p.hand.splice(idx,1);
renderHand();
}
}
return;
}
if(G.tutorialStep>0&&G.tutorialStep<10){handleTutorialClick(idx);return}
if(card.type==="basic")playBasic(idx);
else if(card.type==="trick")playTrick(idx);
else if(card.type==="delay")playDelay(idx);
else if(card.type==="equip")playEquipment(idx);
}

function playBasic(idx){
const p=G.player,e=G.enemy;
const card=p.hand[idx];
const chk=canPlayBasic(p,card);
if(!chk.ok){log(chk.msg,"log-system");return}
if(card.key==="tao"&&p.hp>=p.maxHp){log("体力已满","log-system");return}
// remove from hand
p.hand.splice(idx,1);
G.discard.push(card);
if(card.key==="sha"){
p.shaPlayed=true;
G._lastPlayerCardKey="sha";
log(`${p.name}出了降妖！`,"log-player");
SND.cardPlay();
const fc=showFieldCard(card,"player");
resolveSha(p,e,card);
setTimeout(()=>removeFieldCard(fc),1500);
}else if(card.key==="tao"){
G._lastPlayerCardKey="tao";
let healAmt=1;
// foen: first tao each turn heals 2
if(p.skills.some(s=>s.key==="foen")&&!(p.skillUsed.foen>0)){
healAmt=2;
p.skillUsed.foen=1;
}
p.hp=Math.min(p.maxHp,p.hp+healAmt);
log(`${p.name}使用蟠桃，回复${healAmt}点体力`,"log-heal");
SND.heal();fxHeal("player");fxHealAura("player");fxHpChange("player");fxDmgFloat("player",-healAmt);
const fc=showFieldCard(card,"player");
setTimeout(()=>removeFieldCard(fc),1500);
}else if(card.key==="jiu"){
G._lastPlayerCardKey="jiu";
p._jiuActive=true;
log(`${p.name}饮下仙酿，下一张降妖伤害+1`,"log-player");
SND.cardPlay();
const fc=showFieldCard(card,"player");
setTimeout(()=>removeFieldCard(fc),1500);
}
renderBattle();
checkEnd();
if(G.mpMode&&G.mpIsHost&&MP.connected&&!G.mpBot&&!G._mpPendingDodge)mpSendState();
}

function playTrick(idx){
const p=G.player,e=G.enemy;
const card=p.hand[idx];
if(card.key==="shunshou"&&dist(p,e)>1){log("距离不够，无法顺手牵宝","log-system");return}
// check wuxie from enemy (PvE only - in MP, guest decides)
if(!G.mpMode&&e.hand.some(c=>c.key==="wuxie")){
const widx=findCard(e,"wuxie");
if(Math.random()<0.4||card.key==="nanman"||card.key==="wanjian"){
const wc=e.hand.splice(widx,1)[0];
G.discard.push(wc);
log(`${e.name}出了护身法，抵消了${card.name}！`,"log-enemy");
p.hand.splice(idx,1);
G.discard.push(card);
renderBattle();
return;
}
}
p.hand.splice(idx,1);
G.discard.push(card);
G._lastPlayerCardKey=card.key;
// check enemy luohan: immune to next trick
if(e._luohanActive){
e._luohanActive=false;
log(`罗汉金身抵消了${card.name}！`,"log-enemy");
SND.skill();
renderBattle();
return;
}
log(`${p.name}出了${card.name}`,"log-player");
SND.trickPlay();
const fc=showFieldCard(card,"player");
setTimeout(()=>removeFieldCard(fc),1500);
switch(card.key){

function playEquipment(idx){

// check source weapon qinggang
const qinggang=source.equipment.weapon&&source.equipment.weapon.key==="qinggang";
// fangtian: last card in hand → +1 dmg, undodgeable
const fangtian=source.equipment.weapon&&source.equipment.weapon.key==="fangtian"&&source.hand.length===0;
// enemy respond (if target is enemy, AI; if target is player, prompt)
// MP online: host attacks guest → prompt guest via network
if(G.mpMode&&G.mpIsHost&&!G.mpBot&&!target.isEnemy&&target===G.enemy){
G._mpPendingDodge={source:source,card:card,qinggang:qinggang,fangtian:fangtian};
mpSendState();
return;
}
if(target.isEnemy||(G.mpMode&&G.mpBot&&target===G.enemy)){
// feixiang: 25% chance to auto-dodge

// ==================== 伤害与死亡 ====================
function damage(target,amount,source){
// MP: enemy may be a player character (not isEnemy) but still needs buff checks
const isPC=!target.isEnemy||(G.mpMode&&target===G.enemy);
// defense buff
if(amount>0&&isPC&&target._defBuff){
const reduced=Math.min(amount,target._defBuff);
amount=Math.max(0,amount-target._defBuff);
log(`防御增益抵消${reduced}点伤害`,"log-heal");
}
// liusha shield - only trigger if there's still damage to mitigate
const liushaMax=target.skills&&target.skills.some(s=>s.key==="liusha_up")?2:1;
if(amount>0&&isPC&&target.charKey==="shaseng"&&(target.skillUsed.liusha||0)<liushaMax&&target.hand.length>0){
target.skillUsed.liusha=(target.skillUsed.liusha||0)+1;
const di=0;const dc=target.hand.splice(di,1)[0];G.discard.push(dc);
log(`沙和尚流沙护体：弃1牌抵消1伤`,"log-heal");
amount=Math.max(0,amount-1);
}
// jinshen: 50% chance to reduce 1 damage
if(amount>0&&isPC&&target.skills&&target.skills.some(s=>s.key==="jinshen")&&(target.skillUsed.jinshen||0)<1&&Math.random()<0.5){
target.skillUsed.jinshen=1;
amount=Math.max(0,amount-1);
log("金身罗汉：减伤1点","log-heal");
}
// tiedan: niulang/chanti/shuiyu immune 1 damage
if(amount>0&&isPC&&target._tiedanActive){
target._tiedanActive=false;
amount=Math.max(0,amount-1);
log("免疫1点伤害","log-heal");
}
// dadi: 后土娘娘弃1牌减1伤
if(amount>0&&isPC&&target.charKey==="houtu"&&target.hand.length>0&&(target.skillUsed.dadi||0)<1){
target.skillUsed.dadi=1;
const dc=target.hand.splice(0,1)[0];G.discard.push(dc);
amount=Math.max(0,amount-1);
log("大地之护：弃1牌减1伤","log-heal");
}
// zhisheng: 玉帝体力≤1时所有伤害-1
if(amount>0&&isPC&&target.charKey==="yudi"&&target.hp<=1){
amount=Math.max(0,amount-1);
log("至圣：减伤1点","log-heal");
}
if(amount<=0)return;
target.hp-=amount;
log(`${target.name}受到${amount}点伤害 (${target.hp}/${target.maxHp})`,"log-damage");
SND.damage();
const side=(target.isEnemy||(G.mpMode&&target===G.enemy))?"enemy":"player";
fxDamage(side);
fxImpact(side);
if(amount>=2){fxSlash();fxShake()}else{fxDust(side,4)}
fxHpChange(side);
fxDmgFloat(side,amount);
if(target.hp<=0){
target.hp=0;
target.alive=false;
SND.death();
}
// tiesuo chain damage: if both chained, other takes same damage
if(target._chained&&amount>0){
const other=target===G.player?G.enemy:G.player;
if(other&&other.alive&&other._chained){
log('铁索连环传导伤害！','log-damage');
other._chained=false;target._chained=false;
damage(other,amount,source);
}
}
}

function checkEnd(){
// 结算前归还被人种袋锁走的牌，避免关卡结束时牌凭空消失
if(G.player._locked&&G.player._locked.length){G.player.hand.push(...G.player._locked);G.player._locked=[]}
// fusheng auto-trigger for player
if(!G.player.alive&&G.player.charKey==="houtu"&&!(G.player.skillUsed.fusheng>0)&&G.player.hand.length>=3){
G.player.skillUsed.fusheng=1;
for(let i=0;i<3;i++){const c=G.player.hand.splice(0,1)[0];G.discard.push(c)}
G.player.hp=1;G.player.alive=true;
log("复生：弃3牌回复1点体力！","log-player");
SND.heal();fxHeal("player");fxHpChange("player");renderBattle();
return;
}
if(!G.player.alive){
if(G.mpMode){const bid2=G.battleId;setTimeout(()=>{if(G.battleId===bid2)mpEndBattle(false)},800);return}
const failLevel=G.level;const bid=G.battleId;
setTimeout(()=>{if(G.level===failLevel&&G.battleId===bid)onLevelFail()},800);
return;
}
if(!G.enemy.alive){
// check fusheng auto-trigger
if(G.enemy.charKey==="houtu"&&!(G.enemy.skillUsed.fusheng>0)&&G.enemy.hand.length>=3){
G.enemy.skillUsed.fusheng=1;
for(let i=0;i<3;i++){const c=G.enemy.hand.splice(0,1)[0];G.discard.push(c)}
G.enemy.hp=1;G.enemy.alive=true;
log("后土娘娘复生：弃3牌回1血！","log-enemy");
SND.heal();fxHeal("enemy");renderBattle();
return;
}
// check huapo revive
if(G.enemy.skills&&G.enemy.skills.includes("huapo")&&!G.enemy._revived){
G.enemy._revived=true;G.enemy.hp=Math.min(G.enemy.maxHp,3);G.enemy.alive=true;
log("白骨精化尸大法：复活并恢复3体力！","log-enemy");
fxHeal("enemy");renderBattle();
return;
}
if(G.mpMode){const bid3=G.battleId;setTimeout(()=>{if(G.battleId===bid3)mpEndBattle(true)},800);return}
const winLevel=G.level;const bid=G.battleId;
setTimeout(()=>{if(G.level===winLevel&&G.battleId===bid)onLevelWin()},800);
return;
}
}

function aiPlayPhase(e,p){
let actions=0;
while(actions<8&&e.alive){
const action=aiDecide(e,p);
if(!action)break;
actions++;
switch(action.type){
case"sha":
const si=findCard(e,"sha");
if(si>=0){
const card=e.hand.splice(si,1)[0];G.discard.push(card);
e.shaPlayed=true;
SND.play();
const fc=showFieldCard(card,"enemy");
log(`${e.name}出了降妖！`,"log-enemy");
renderBattle();
// player response
if(hasCard(p,"shan")||p.equipment.armor){
setTimeout(()=>{removeFieldCard(fc);promptPlayerDodge(e,card)},300);
return;
}else{
let dmg=1;
if(e.equipment.weapon&&e.equipment.weapon.key==="fangtian"&&e.hand.length===0){dmg+=1;log('方天画戟：最后一击伤害+1','log-enemy')}
if(e._jiuActive){dmg+=1;e._jiuActive=false;log('仙酿效果：降妖伤害+1','log-enemy')}
if(hasSk(e,"manniu"))dmg=2;
if(hasSk(e,"sanmei"))dmg=2;if(hasSk(e,"huli"))dmg+=1;
if(e._atkBuff)dmg+=e._atkBuff;
if(e._shilongActive){dmg+=1;e._shilongActive=false}
if(!e.isEnemy||(G.mpMode&&e===G.enemy)){
const jinbaoSk=e.skills.find(s=>s.key==="jinbao");
if(jinbaoSk)dmg+=(typeof jinbaoSk.perTurn==='number'?jinbaoSk.perTurn:1);
const tpSk=e.skills.find(s=>s.key==="tianpeng_up");
if(tpSk&&card&&card.red)dmg+=(typeof tpSk.perTurn==='number'?tpSk.perTurn:1);
}
if(e.charKey==="yanwang"&&e.hp<=2)dmg+=1;
if(e.charKey==="niulang"&&e.hp<=2)dmg+=1;
if(e.equipment.weapon&&e.equipment.weapon.key==="huosha"&&p.equipment.armor&&p.equipment.armor.key==="tengjia"){dmg+=1;log('火灵珠灼烧藤甲+1伤','log-damage')}
if(hasSk(e,"jiutou2"))dmg=1;
if(hasSk(p,"xiniu")&&dmg>0)dmg=Math.max(0,dmg-1);
if(e.equipment.weapon&&e.equipment.weapon.key==="hanbing"&&p.hand.length>=2){
for(let h=0;h<2;h++){const dc=p.hand.splice(0,1)[0];G.discard.push(dc)}
log(`寒冰剑：你弃2牌代替伤害`,"log-system");
}else if(dmg>0){damage(p,dmg,e);onShaDamage(e,p,card)}else{log('伤害被完全抵消','log-system')}
renderBattle();
setTimeout(()=>removeFieldCard(fc),1500);
if(!p.alive){setTimeout(()=>{const bid=G.battleId;if(G.player&&!G.player.alive&&G.battleId===bid){if(G.mpMode)mpEndBattle(false);else onLevelFail()}},800);return}
}
}
break;
case"tao":
if(e.hp<e.maxHp){
const ti=findCard(e,"tao");
if(ti>=0){
const card=e.hand.splice(ti,1)[0];G.discard.push(card);
e.hp++;
log(`${e.name}使用蟠桃回复1体力`,"log-heal");
renderBattle();
}
}
break;
case"equip":
const ei=e.hand.findIndex(c=>c.type==="equip");
if(ei>=0){
const card=e.hand.splice(ei,1)[0];
const st=card.equipSubtype;
if(st==="weapon"){if(e.equipment.weapon)G.discard.push(e.equipment.weapon);e.equipment.weapon=card}
else if(st==="armor"){if(e.equipment.armor)G.discard.push(e.equipment.armor);e.equipment.armor=card}
else if(st==="mount"){
if(card.key==="jiahorse"||card.key==="hualiu"){if(e.equipment.defMount)G.discard.push(e.equipment.defMount);e.equipment.defMount=card}
else{if(e.equipment.mount)G.discard.push(e.equipment.mount);e.equipment.mount=card}
}
else{e.hand.push(card);break}
log(`${e.name}装备了${card.name}`,"log-enemy");
SND.equipSound();
const fc=showFieldCard(card,"enemy");
setTimeout(()=>removeFieldCard(fc),1500);
renderBattle();
}
break;
case"trick":
aiPlayTrick(e,p);
renderBattle();
break;
case"skill":
// AI skill effects already applied in aiDecide, just continue
renderBattle();
break;
}
}
if(!e.alive){checkEnd();return}
setTimeout(()=>aiEndTurn(),500);
}

function aiDecide(e,p){
// AI skill usage for new characters
if(e.charKey&&!e.isEnemy===false||e.charKey&&G.level!=='MP'){
const sk=e.skills||[];
// heal when low
if(e.hp<=2){
if(e.charKey==='guanyin'&&!(e.skillUsed.cibei>0)){e.skillUsed.cibei=1;e.hp=Math.min(e.maxHp,e.hp+1);log(e.name+'慈悲为怀：回1血','log-heal');SND.heal();fxHeal('enemy');return{type:'skill',key:'cibei'}}
if(e.charKey==='guanyin'&&!(e.skillUsed.jingping>0)&&e.hand.length>0&&e.hp<e.maxHp){e.skillUsed.jingping=1;const c=e.hand.splice(0,1)[0];G.discard.push(c);e.hp=Math.min(e.maxHp,e.hp+2);log(e.name+'净瓶甘露：回2血','log-heal');SND.heal();fxHeal('enemy');return{type:'skill',key:'jingping'}}
if(e.charKey==='qiaodi'&&!(e.skillUsed.chanshu>0)&&e.hand.length>0&&e.hp<e.maxHp){e.skillUsed.chanshu=1;const c=e.hand.splice(0,1)[0];G.discard.push(c);e.hp=Math.min(e.maxHp,e.hp+1);log(e.name+'禅术：回1血','log-heal');SND.heal();fxHeal('enemy');return{type:'skill',key:'chanshu'}}
}
// aggressive skills
if(p.hp>0){
if(e.charKey==='erlang'&&!(e.skillUsed.xiao>0)&&e.hand.length>1){e.skillUsed.xiao=1;const c=e.hand.splice(0,1)[0];G.discard.push(c);log(e.name+'哮天犬：造1伤','log-enemy');SND.skill();fxImpact('player');damage(p,1,e);return{type:'skill',key:'xiao'}}
if(e.charKey==='leigong'&&!(e.skillUsed.leiting>0)&&e.hand.some(c=>c.red)){e.skillUsed.leiting=1;const idx=e.hand.findIndex(c=>c.red);const c=e.hand.splice(idx,1)[0];G.discard.push(c);log(e.name+'雷霆万钧：造1伤','log-enemy');SND.skill();fxImpact('player');damage(p,1,e);return{type:'skill',key:'leiting'}}
if(e.charKey==='qiaodi'&&!(e.skillUsed.kanmu>0)&&e.hand.some(c=>c.type==='equip')){e.skillUsed.kanmu=1;const idx=e.hand.findIndex(c=>c.type==='equip');const c=e.hand.splice(idx,1)[0];G.discard.push(c);log(e.name+'砍木：造1伤','log-enemy');SND.skill();fxImpact('player');damage(p,1,e);return{type:'skill',key:'kanmu'}}
if(e.charKey==='rulai'&&!(e.skillUsed.wuzhishan>0)&&e.hand.length>=2&&p.hp<=2){e.skillUsed.wuzhishan=1;for(let i=0;i<2;i++){const c=e.hand.splice(0,1)[0];G.discard.push(c)}log(e.name+'五指山：造2伤！','log-enemy');SND.skill();fxImpact('player');damage(p,2,e);return{type:'skill',key:'wuzhishan'}}
if(e.charKey==='yanwang'&&!(e.skillUsed.shengsi>0)&&p.hand.length>0){e.skillUsed.shengsi=1;const ec=p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0];G.discard.push(ec);log(e.name+'生死簿：弃你1牌','log-enemy');SND.skill();return{type:'skill',key:'shengsi'}}
if(e.charKey==='yudi'&&!(e.skillUsed.tianming>0)&&p.hand.length>0){e.skillUsed.tianming=1;const dn=Math.min(2,p.hand.length);for(let i=0;i<dn;i++){const ec=p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0];G.discard.push(ec)}log(e.name+'天命：弃你'+dn+'牌','log-enemy');SND.skill();return{type:'skill',key:'tianming'}}
if(e.charKey==='tang'&&!(e.skillUsed.jingu>0)&&p.hand.length>0){e.skillUsed.jingu=1;const ec=p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0];G.discard.push(ec);log(e.name+'紧箍咒：弃你1牌','log-enemy');SND.skill();return{type:'skill',key:'jingu'}}
}
// buff/utility skills
if(e.charKey==='taibai'&&!(e.skillUsed.zhiyin>0)){e.skillUsed.zhiyin=1;const dr=drawFromDeck(2);e.hand.push(...dr);log(e.name+'指引：摸2牌','log-enemy');SND.draw();return{type:'skill',key:'zhiyin'}}
if(e.charKey==='puti'&&!(e.skillUsed.chuandao>0)&&e.hand.length>0){e.skillUsed.chuandao=1;const c=e.hand.splice(0,1)[0];G.discard.push(c);const dr=drawFromDeck(2);e.hand.push(...dr);log(e.name+'传道：弃1摸2','log-enemy');SND.skill();return{type:'skill',key:'chuandao'}}
if(e.charKey==='dianmu'&&!(e.skillUsed.dianshu>0)&&e.hand.some(c=>!c.red)){e.skillUsed.dianshu=1;const idx=e.hand.findIndex(c=>!c.red);const c=e.hand.splice(idx,1)[0];G.discard.push(c);const dr=drawFromDeck(2);e.hand.push(...dr);log(e.name+'电术：弃1黑摸2','log-enemy');SND.skill();return{type:'skill',key:'dianshu'}}
if(e.charKey==='hailong'&&!(e.skillUsed.xingyun>0)){e.skillUsed.xingyun=1;const c1=drawFromDeck(1)[0];e.hand.push(c1);const c2=drawFromDeck(1)[0];p.hand.push(c2);log(e.name+'兴云布雨','log-enemy');SND.skill();return{type:'skill',key:'xingyun'}}
if(e.charKey==='niulang'&&!(e.skillUsed.tiedan>0)){e.skillUsed.tiedan=1;e._tiedanActive=true;log(e.name+'铁胆：免疫1伤','log-enemy');SND.skill();return{type:'skill',key:'tiedan'}}
if(e.charKey==='bailong'&&!(e.skillUsed.shilong>0)&&hasCard(e,'sha')&&!e.shaPlayed){e.skillUsed.shilong=1;e._shilongActive=true;log(e.name+'化龙一击','log-enemy');SND.skill();return{type:'skill',key:'shilong'}}
// dianmu bingdian: convert black card to sha when no sha available
if(e.charKey==='dianmu'&&!hasCard(e,'sha')&&!e.shaPlayed&&e.hand.some(c=>!c.red&&c.key!=='sha')){const bi2=e.hand.findIndex(c=>!c.red&&c.key!=='sha');const old4=e.hand[bi2];e.hand[bi2]={id:old4.id,key:'sha',name:'冰电·降妖',type:'basic',basicSubtype:'sha',suit:old4.suit,rank:old4.rank,red:old4.red,desc:'冰电化降妖',cls:'basic-sha'};log(e.name+'冰电：将'+old4.name+'变为降妖','log-enemy');SND.skill();fxSkill('enemy');return{type:'skill',key:'bingdian'}}
}
if(e.hp<=2&&hasCard(e,"tao")&&e.hp<e.maxHp)return{type:"tao"};
if(hasCard(e,"sha")&&!e.shaPlayed&&dist(e,p)<=((e.equipment.weapon&&e.equipment.weapon.range)||1))return{type:"sha"};
// equip
const ei=e.hand.findIndex(c=>c.type==="equip");
if(ei>=0){
const card=e.hand[ei];
const st=card.equipSubtype;
if((st==="weapon"&&!e.equipment.weapon)||(st==="armor"&&!e.equipment.armor)||(st==="mount"&&((card.key==="jiahorse"||card.key==="hualiu")?!e.equipment.defMount:!e.equipment.mount)))return{type:"equip"};
}
// tricks - priority order
if(hasCard(e,"wuzhong"))return{type:"trick",key:"wuzhong"};
if(hasCard(e,"jiedao")&&p.equipment.weapon)return{type:"trick",key:"jiedao"};
if(hasCard(e,"guohe")&&(p.equipment.weapon||p.hand.length>3))return{type:"trick",key:"guohe"};

if(hasCard(e,"nanman")&&!hasCard(p,"sha"))return{type:"trick",key:"nanman"};

function aiEndTurn(){

// tanshi (MP bot mode: enemy could be bajie)
if(e.charKey==="bajie"&&!(e.skillUsed.tanshi>0)&&hasCard(e,"tao")&&e.hp<e.maxHp){
e.skillUsed.tanshi=1;
let healAmt=1;
if(e.skills.some(s=>s.key==="tanshi_up"))healAmt=2;
e.hp=Math.min(e.maxHp,e.hp+healAmt);
log(`${e.name}贪食：额外回复${healAmt}点体力`,"log-heal");
SND.heal();fxHeal("enemy");fxHpChange("enemy");
}
// unlock player locked cards
if(p._locked){p.hand.push(...p._locked);p._locked=[];log("人种袋中的牌归还","log-system")}
// discard phase
while(e.hand.length>e.hp){
// discard lowest priority
let idx=0;let priority=99;
e.hand.forEach((c,i)=>{
let pr=5;
if(c.key==="wuxie")pr=1;
else if(c.key==="shan")pr=2;
else if(c.key==="tao")pr=3;
else if(c.key==="sha")pr=4;
else if(c.type==="equip")pr=6;
else if(c.type==="trick")pr=7;
if(pr<priority){priority=pr;idx=i}
});
const dc=e.hand.splice(idx,1)[0];G.discard.push(dc);
}
log(`${e.name}结束回合`,"log-enemy");
// switch to player
G.turn="player";G.phase="play";
playerTurnStart();
}

function continueEnemyTurn(){

const e=G.enemy,p=G.player;
if(!p.alive||!e.alive)return;
setTimeout(()=>{
let actions=0;
while(actions<8&&e.alive){
const action=aiDecide(e,p);
if(!action)break;
actions++;
switch(action.type){
case"sha":if(hasCard(e,"sha")&&!e.shaPlayed){
const si=findCard(e,"sha");const card=e.hand.splice(si,1)[0];G.discard.push(card);
e.shaPlayed=true;
