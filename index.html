<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>西游杀 — 卡牌闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0a06;--gold:#c9a84c;--gold-br:#e8c96a;--gold-dim:#7a6438;--red:#c84040;--red-d:#8a2828;--green:#3aa050;--blue:#4a8ac8;--purple:#8850c0;--orange:#c88838;--teal:#2a9890;--gray:#989088;--text:#e8e0d0;--text-dim:#998878;--card-w:56px;--card-h:80px;--glow-gold:0 0 20px rgba(201,168,76,.3);--shadow-card:0 4px 12px rgba(0,0,0,.5);--shadow-panel:0 2px 8px rgba(0,0,0,.4)}
body{background:
repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(201,168,76,.015) 20px,rgba(201,168,76,.015) 21px),
radial-gradient(ellipse at 50% 0%,#2a1808 0%,transparent 50%),
radial-gradient(ellipse at 50% 100%,#1a1208 0%,transparent 50%),
#0d0a06;
color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.screen{min-height:100vh;display:flex;flex-direction:column}

/* Title */
#title-screen{align-items:center;justify-content:center;text-align:center;background:
radial-gradient(ellipse at 50% 20%,rgba(201,168,76,.18) 0%,transparent 55%),
radial-gradient(ellipse at 30% 80%,rgba(138,40,40,.1) 0%,transparent 50%),
radial-gradient(ellipse at 75% 70%,rgba(74,26,107,.06) 0%,transparent 45%),
linear-gradient(180deg,#1a1008 0%,#0d0a06 40%,#15100a 70%,#1a0e06 100%);
position:relative;overflow:hidden}
#title-screen::before{content:'';position:absolute;inset:0;background-image:
radial-gradient(2px 2px at 15% 25%,rgba(201,168,76,.35),transparent),
radial-gradient(1px 1px at 55% 65%,rgba(201,168,76,.25),transparent),
radial-gradient(2px 2px at 75% 15%,rgba(232,201,106,.3),transparent),
radial-gradient(1px 1px at 25% 75%,rgba(201,168,76,.2),transparent),
radial-gradient(1.5px 1.5px at 65% 35%,rgba(232,201,106,.2),transparent),
radial-gradient(1px 1px at 85% 55%,rgba(201,168,76,.2),transparent),
radial-gradient(2px 2px at 8% 45%,rgba(232,201,106,.25),transparent),
radial-gradient(1px 1px at 45% 85%,rgba(201,168,76,.15),transparent),
radial-gradient(1.5px 1.5px at 92% 80%,rgba(201,168,76,.2),transparent),
radial-gradient(1px 1px at 35% 10%,rgba(232,201,106,.2),transparent);
animation:titleParticle 8s ease-in-out infinite;pointer-events:none;z-index:0}
#title-screen::after{content:'';position:absolute;inset:0;background:
repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(201,168,76,.012) 20px,rgba(201,168,76,.012) 21px);
pointer-events:none;z-index:0}
@keyframes titleParticle{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title-avatar{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:2.6em;margin-bottom:14px;background:radial-gradient(circle,#2a2218,#181208);box-shadow:0 0 30px rgba(201,168,76,.45),inset 0 0 14px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.5);animation:avatarFloat 4s ease-in-out infinite;position:relative;z-index:1;overflow:hidden}
.title-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
@keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.game-title{font-size:3.2em;color:var(--gold-br);margin-bottom:4px;letter-spacing:.18em;font-weight:bold;background:linear-gradient(180deg,#f0d878,#c9a84c 60%,#a08030);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(201,168,76,.4));position:relative;z-index:1;animation:titleGlow 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 18px rgba(201,168,76,.4))}50%{filter:drop-shadow(0 0 32px rgba(201,168,76,.7))}}
.title-glow-line{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:2px auto 8px;position:relative;z-index:1;opacity:.6;animation:lineGlow 3s ease-in-out infinite}
@keyframes lineGlow{0%,100%{opacity:.4;width:180px}50%{opacity:.8;width:240px}}
.game-sub{font-size:.9em;color:var(--text-dim);margin-bottom:22px;text-shadow:0 1px 2px rgba(0,0,0,.6);position:relative;z-index:1;letter-spacing:.1em}
.card-fan{display:flex;justify-content:center;margin-bottom:20px;position:relative;z-index:1;height:50px}
.card-fan .fan-card{width:34px;height:48px;border-radius:4px;border:1px solid var(--gold-dim);flex-shrink:0;box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:.6em;color:rgba(255,255,255,.5);font-weight:bold;letter-spacing:.1em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card-fan .fan-card:nth-child(1){transform:rotate(-18deg) translateY(8px);margin-right:-12px}
.card-fan .fan-card:nth-child(2){transform:rotate(-6deg) translateY(3px);margin-right:-12px}
.card-fan .fan-card:nth-child(3){transform:rotate(6deg) translateY(3px);margin-right:-12px}
.card-fan .fan-card:nth-child(4){transform:rotate(18deg) translateY(8px)}
.title-buttons{position:relative;z-index:1}
#title-screen .btn{position:relative;z-index:1;min-width:200px;animation:btnFadeIn .6s ease-out backwards}
.title-btn-2{animation-delay:.15s}
@keyframes btnFadeIn{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
.title-footer{margin-top:24px;font-size:.76em;color:var(--text-dim);position:relative;z-index:1;line-height:1.8;opacity:.7}
.footer-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:6px auto}
.btn{padding:11px 34px;font-size:1em;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.22),rgba(201,168,76,.08));color:var(--gold-br);border-radius:6px;cursor:pointer;transition:all .2s;margin:5px;letter-spacing:.06em;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.5);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.btn:hover{background:linear-gradient(180deg,rgba(201,168,76,.38),rgba(201,168,76,.2));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 20px rgba(201,168,76,.45),0 2px 10px rgba(0,0,0,.5)}
.btn:active{transform:translateY(1px)}
.btn-sm{padding:6px 14px;font-size:.85em;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(201,168,76,.12),rgba(201,168,76,.05));color:var(--text);border-radius:5px;cursor:pointer;margin:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.3);transition:all .15s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold-br);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 10px rgba(201,168,76,.25)}
.btn-sm:disabled{opacity:.3;cursor:not-allowed}

/* Story */
#story-screen{align-items:center;justify-content:center;text-align:center;padding:30px 20px}
.story-title{font-size:1.5em;color:var(--gold-br);margin-bottom:12px}
.story-text{font-size:1em;line-height:1.8;max-width:420px;margin-bottom:25px;color:#c8c0b0}
.story-chapter{color:var(--orange);font-size:.9em;margin-bottom:8px}

/* Battle — SanGuoSha mobile style */
#battle-screen{padding:0;gap:0;background:
repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(201,168,76,.01) 30px,rgba(201,168,76,.01) 31px),
radial-gradient(ellipse at 50% 50%,rgba(40,28,12,.3) 0%,transparent 70%),
linear-gradient(180deg,#1a1208,#0a0806),#0a0806}
.battle-header{text-align:center;padding:4px 8px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.battle-header .chapter{color:var(--orange);font-size:.75em}
.battle-header .title{color:var(--gold-br);font-size:1em;font-weight:bold}
.phase-indicator{font-size:.7em;padding:1px 8px;border-radius:10px;background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold-br);white-space:nowrap}
.phase-indicator.enemy-turn{background:rgba(200,64,64,.15);border-color:var(--red-d);color:#e87878}
.phase-indicator.discard{background:rgba(152,144,136,.15);border-color:var(--gray);color:#b0a898}
.char-row{display:flex;align-items:center;gap:8px;padding:6px 10px}
.char-avatar{width:46px;height:46px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:1.5em;flex-shrink:0;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.5);position:relative}
.char-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.char-avatar.enemy{border-color:var(--red-d);background:radial-gradient(circle,#3a1818 0%,#1a0808 100%);box-shadow:0 0 0 1px rgba(138,40,40,.5),0 0 14px rgba(138,40,40,.35),0 3px 8px rgba(0,0,0,.5)}
.char-avatar.player{border-color:var(--gold-dim);background:radial-gradient(circle,#2a2218 0%,#181208 100%);box-shadow:0 0 0 1px rgba(122,100,56,.5),0 0 14px rgba(201,168,76,.25),0 3px 8px rgba(0,0,0,.5)}
.char-info-block{flex:1;min-width:0}
.char-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.char-name{font-size:.95em;font-weight:bold}
.char-name.enemy{color:#e87878}
.char-name.player{color:var(--gold-br)}
.hp-wrap{display:inline-flex;align-items:center;gap:4px}
.hp-bar-track{width:80px;height:13px;background:#0a0804;border:1px solid rgba(80,60,30,.5);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.7)}
.hp-bar-fill{height:100%;border-radius:7px;transition:width .3s;position:relative}
.hp-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:7px 7px 0 0}
.hp-bar-fill.high{background:linear-gradient(90deg,#2a8030,#3aa050);box-shadow:0 0 8px rgba(58,160,80,.45)}
.hp-bar-fill.mid{background:linear-gradient(90deg,#c8a030,#e8c040);box-shadow:0 0 8px rgba(232,192,64,.45)}
.hp-bar-fill.low{background:linear-gradient(90deg,#a02020,#c84040);box-shadow:0 0 8px rgba(200,64,64,.55);animation:hpLowPulse 1.5s ease-in-out infinite}
@keyframes hpLowPulse{0%,100%{opacity:1}50%{opacity:.7}}
.hp-text{font-size:.8em;color:var(--text-dim)}
.equip-slots{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.equip-tag{font-size:.68em;padding:1px 6px;border-radius:3px;white-space:nowrap}
.equip-tag.weapon{background:rgba(200,136,56,.2);border:1px solid var(--orange);color:#d8a060}
.equip-tag.armor{background:rgba(42,152,144,.15);border:1px solid var(--teal);color:#4aaaa0}
.equip-tag.mount{background:rgba(152,144,136,.15);border:1px solid var(--gray);color:#b0a898}
.judge-tag{font-size:.68em;padding:1px 6px;border-radius:3px;background:rgba(200,64,64,.15);border:1px solid var(--red-d);color:#d87878;white-space:nowrap}
.enemy-area{background:linear-gradient(180deg,rgba(22,8,8,.65),rgba(16,6,6,.45));border-bottom:1px solid rgba(80,30,30,.35);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.enemy-hand{display:flex;gap:2px;padding:3px 10px 5px;min-height:32px;flex-wrap:nowrap;overflow-x:auto}
.card-back{width:22px;height:32px;flex-shrink:0;background:linear-gradient(135deg,#4a3210 0%,#2a1c08 50%,#1a1408 100%);border:1px solid var(--gold-dim);border-radius:4px;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.card-back::before{content:'';position:absolute;inset:2px;border:1px solid rgba(201,168,76,.2);border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(201,168,76,.05) 3px,rgba(201,168,76,.05) 4px)}
.card-back::after{content:'';position:absolute;top:50%;left:50%;width:10px;height:10px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,168,76,.25),transparent 70%);border-radius:50%}
.battlefield{min-height:52px;max-height:82px;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px;background:radial-gradient(ellipse at center,rgba(201,168,76,.05),transparent 70%),rgba(0,0,0,.18);overflow:hidden;position:relative;border-top:1px solid rgba(60,50,30,.2);border-bottom:1px solid rgba(60,50,30,.2)}
.battlefield .field-card{width:44px;height:62px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.6em;font-weight:bold;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.battlefield .field-card.from-player{animation:fieldCardFromPlayer .4s ease-out}
.battlefield .field-card.from-enemy{animation:fieldCardFromEnemy .4s ease-out}
.battlefield .field-label{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:.5em;color:var(--text-dim);white-space:nowrap}
@keyframes fieldCardFromPlayer{0%{transform:translateY(60px) scale(.5);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes fieldCardFromEnemy{0%{transform:translateY(-60px) scale(.5);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.battle-log{flex:1;background:rgba(0,0,0,.25);padding:4px 10px;overflow-y:auto;font-size:.78em;line-height:1.5;min-height:40px;max-height:80px}
.battle-log p{margin:1px 0}
.log-system{color:var(--orange)}
.log-player{color:#7ab8e8}
.log-enemy{color:#e87878}
.log-damage{color:#ff6b6b}
.log-heal{color:var(--green)}
.player-area{background:linear-gradient(180deg,rgba(20,16,10,.55),rgba(24,20,12,.75));border-top:1px solid rgba(60,50,30,.35);box-shadow:inset 0 2px 0 rgba(201,168,76,.06)}
.player-hand{display:flex;gap:3px;padding:8px 10px 4px;min-height:var(--card-h);flex-wrap:nowrap;overflow-x:auto;justify-content:center}
.card{width:var(--card-w);height:var(--card-h);border-radius:6px;padding:3px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s,box-shadow .15s;user-select:none;position:relative;flex-shrink:0;box-shadow:var(--shadow-card);overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-radius:5px;pointer-events:none;z-index:1}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);pointer-events:none;z-index:1;border-radius:6px 6px 0 0}
.card:hover{transform:translateY(-10px);box-shadow:0 8px 24px rgba(201,168,76,.5),0 0 0 1px rgba(201,168,76,.3);z-index:10}
.card.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.card.disabled:hover{transform:none;box-shadow:var(--shadow-card)}
.card.basic-sha{border:1.5px solid var(--red);background:linear-gradient(160deg,#4a1812 0%,#2a0e08 50%,#1a0604 100%)}
.card.basic-shan{border:1.5px solid var(--blue);background:linear-gradient(160deg,#142a44 0%,#0a1428 50%,#080a1a 100%)}
.card.basic-tao{border:1.5px solid var(--green);background:linear-gradient(160deg,#144a20 0%,#0a2810 50%,#081a08 100%)}
.card.trick{border:1.5px solid var(--purple);background:linear-gradient(160deg,#321848 0%,#1a0e28 50%,#14081a 100%)}
.card.delay{border:1.5px solid var(--red-d);background:linear-gradient(160deg,#3a1414 0%,#1a0808 50%,#140606 100%)}
.card.equip-weapon{border:1.5px solid var(--orange);background:linear-gradient(160deg,#4a3014 0%,#2a1c08 50%,#1a1408 100%)}
.card.equip-armor{border:1.5px solid var(--teal);background:linear-gradient(160deg,#143028 0%,#0a1c14 50%,#081a14 100%)}
.card.equip-mount{border:1.5px solid var(--gray);background:linear-gradient(160deg,#222220 0%,#121210 50%,#0e0e0a 100%)}
.card-corner{font-size:.58em;text-align:left;line-height:1;padding:1px;z-index:2;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.9)}
.card-corner.red{color:#e85050}
.card-corner.black{color:#b0a898}
.card-name{font-size:.72em;text-align:center;font-weight:bold;line-height:1.1;flex:1;display:flex;align-items:center;justify-content:center;padding:2px;z-index:2;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.card-desc{font-size:.48em;text-align:center;color:#b0a090;overflow:hidden;line-height:1.1;padding:0 1px;z-index:2;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.card-selected{box-shadow:0 0 20px var(--gold-br),0 0 40px rgba(201,168,76,.3),inset 0 0 10px rgba(201,168,76,.1)!important;transform:translateY(-12px)!important;border-color:var(--gold-br)!important}
.actions{display:flex;gap:6px;justify-content:center;padding:4px 10px 6px;flex-wrap:wrap}
.skill-btn{padding:4px 10px;font-size:.8em;border:1px solid var(--purple);background:linear-gradient(180deg,rgba(136,80,192,.2),rgba(136,80,192,.08));color:#b890d8;border-radius:5px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.3);transition:all .15s;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.skill-btn:hover:not(:disabled){background:linear-gradient(180deg,rgba(136,80,192,.35),rgba(136,80,192,.15));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 10px rgba(136,80,192,.3)}
.skill-btn:disabled{opacity:.3;cursor:not-allowed}
.buff-list{font-size:.72em;color:var(--orange);margin:2px 0}
.char-avatar.targetable{border-color:var(--gold-br)!important;box-shadow:0 0 12px var(--gold-br);animation:targetPulse 1s ease-in-out infinite}
@keyframes targetPulse{0%,100%{box-shadow:0 0 8px var(--gold-br)}50%{box-shadow:0 0 20px var(--gold-br)}}
.equip-mini{width:20px;height:28px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:.45em;font-weight:bold;cursor:help;position:relative;flex-shrink:0;overflow:hidden}
.equip-mini.weapon{border:1px solid var(--orange);background:rgba(200,136,56,.2);color:#d8a060}
.equip-mini.armor{border:1px solid var(--teal);background:rgba(42,152,144,.15);color:#4aaaa0}
.equip-mini.mount{border:1px solid var(--gray);background:rgba(152,144,136,.15);color:#b0a898}
.equip-mini .eq-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:var(--text);padding:3px 6px;border-radius:3px;font-size:.8em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.equip-mini:hover .eq-tip{opacity:1}
.player-hand{display:flex;gap:2px;padding:8px 10px 4px;min-height:var(--card-h);flex-wrap:nowrap;overflow-x:auto;justify-content:center;perspective:600px}

/* ====== Animations & Effects ====== */
@keyframes cardDraw{0%{transform:translateX(-200px) rotate(-15deg);opacity:0}100%{transform:translateX(0) rotate(0);opacity:1}}
@keyframes cardPlay{0%{transform:translateY(0) scale(1);opacity:1}40%{transform:translateY(-40px) scale(1.15);opacity:1}100%{transform:translateY(-80px) scale(.5);opacity:0}}
@keyframes cardDiscard{0%{transform:scale(1);opacity:1}100%{transform:scale(.3) rotate(20deg);opacity:0}}
@keyframes damageFlash{0%,100%{background:transparent}30%{background:rgba(200,40,40,.35)}}
@keyframes healGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(58,160,80,.6)}}
@keyframes screenShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
@keyframes skillPulse{0%,100%{box-shadow:0 0 0 rgba(136,80,192,0)}50%{box-shadow:0 0 25px rgba(136,80,192,.7)}}
@keyframes hpBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes turnGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 15px rgba(201,168,76,.5)}}
@keyframes fadeInUp{0%{transform:translateY(15px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes enemyEnter{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes glowBorder{0%,100%{border-color:var(--gold-dim)}50%{border-color:var(--gold-br)}}
.anim-draw{animation:cardDraw .4s ease-out}
.anim-play{animation:cardPlay .5s ease-in forwards}
.anim-discard{animation:cardDiscard .35s ease-in forwards}
.fx-damage{animation:damageFlash .4s ease-out}
.fx-heal{animation:healGlow .6s ease-out}
.fx-shake{animation:screenShake .4s ease-out}
.fx-skill{animation:skillPulse .6s ease-out}
.fx-hpchange{animation:hpBounce .3s ease-out}
.fx-turn{animation:turnGlow .8s ease-out}
.fx-fadein{animation:fadeInUp .3s ease-out}
.fx-enemy-enter{animation:enemyEnter .5s ease-out}
.fx-flip{animation:cardFlip .4s ease-out}
.fx-glow-border{animation:glowBorder 1s ease-in-out}
.card-entering{animation:cardDraw .35s ease-out}
/* damage float */
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.dmg-float{position:absolute;font-size:1.2em;font-weight:bold;color:#ff4444;text-shadow:0 0 8px rgba(255,68,68,.6),0 2px 2px rgba(0,0,0,.8);animation:floatUp 1s ease-out forwards;pointer-events:none;z-index:60;left:50%;transform:translateX(-50%)}
.dmg-float.heal{color:#44ff66;text-shadow:0 0 8px rgba(68,255,102,.6),0 2px 2px rgba(0,0,0,.8)}
/* target highlight */
@keyframes targetHintPulse{0%,100%{box-shadow:0 0 0 rgba(200,64,64,0)}50%{box-shadow:0 0 20px rgba(200,64,64,.8)}}
.target-hint{animation:targetHintPulse .6s ease-in-out infinite}
/* boss entrance */
@keyframes bossEntry{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.boss-entry{animation:bossEntry .8s ease-out}
/* card flip reveal */
@keyframes flipReveal{0%{transform:rotateY(180deg) scale(.8);opacity:0}50%{transform:rotateY(90deg) scale(1);opacity:.5}100%{transform:rotateY(0) scale(1);opacity:1}}
.flip-reveal{animation:flipReveal .5s ease-out}
#fx-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}
.turn-tag{font-size:.65em;padding:1px 5px;border-radius:3px;background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold-br)}
.turn-tag.enemy{background:rgba(200,64,64,.15);border-color:var(--red-d);color:#d87878}

/* Response modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:linear-gradient(180deg,#2a2018,#1a140e);border:1px solid var(--gold);border-radius:10px;padding:18px 20px;max-width:360px;text-align:center;box-shadow:0 0 40px rgba(201,168,76,.3),0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.modal-title{font-size:1em;color:var(--gold-br);margin-bottom:8px}
.modal-text{font-size:.9em;margin-bottom:12px;line-height:1.6;color:#c8c0b0}
.modal-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* Event */
#event-screen{align-items:center;justify-content:center;text-align:center;padding:30px 20px}
.event-choices{display:flex;flex-direction:column;gap:8px;max-width:380px;margin:15px auto}
.event-choice{padding:12px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(201,168,76,.08),rgba(201,168,76,.03));border-radius:6px;cursor:pointer;transition:all .2s;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.event-choice:hover{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,168,76,.15),rgba(201,168,76,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 12px rgba(201,168,76,.2)}

/* Level select */
#level-screen{padding:15px}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px;margin-top:12px}
.level-btn{padding:6px 3px;border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(201,168,76,.06),rgba(201,168,76,.02));border-radius:5px;cursor:pointer;font-size:.72em;text-align:center;transition:all .15s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.level-btn:hover{border-color:var(--gold)}
.level-btn.locked{opacity:.3;cursor:not-allowed}
.level-btn.tutorial{border-color:var(--orange)}
.level-btn.plot{border-color:#888}
.level-btn.light{border-color:var(--green)}
.level-btn.boss{border-color:var(--red)}
.level-btn.event{border-color:var(--purple)}
.level-btn.finale{border-color:var(--gold);background:rgba(201,168,76,.1)}
.level-btn.current{border-color:var(--gold);border-width:2px}

/* Game over / victory */
#over-screen,#victory-screen{align-items:center;justify-content:center;text-align:center}
.over-title{font-size:1.8em;margin-bottom:12px}
.over-title.lose{color:var(--red)}
.over-title.win{color:var(--gold-br)}

/* Char select */
.char-select{display:flex;gap:12px;justify-content:center;margin:15px 0;flex-wrap:wrap}
.char-card{padding:12px;border:1.5px solid var(--gold-dim);background:linear-gradient(180deg,rgba(28,22,18,.85),rgba(20,16,12,.8));border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;min-width:110px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.4)}
.char-card:hover{border-color:var(--gold)}
.char-card.selected{border-color:var(--gold-br);box-shadow:0 0 12px rgba(201,168,76,.3)}
.char-card.injured{opacity:.4;cursor:not-allowed}
.char-card .ch-name{font-size:1em;color:var(--gold-br);margin-bottom:4px}
.char-card .ch-hp{font-size:.8em;color:var(--green)}
.char-card .ch-skill{font-size:.68em;color:var(--text-dim);margin-top:3px}

@media(max-width:600px){
:root{--card-w:50px;--card-h:72px}
.card-name{font-size:.68em}
.card-desc{font-size:.46em}
.game-title{font-size:2em}
.char-avatar{width:38px;height:38px;font-size:1.1em}
.card-back{width:18px;height:26px}
.hp-bar-track{width:60px}
}
@media(prefers-reduced-motion:reduce){
.card,.btn,.event-choice,.char-card{transition:none}
.card:hover{transform:none}
}
</style>
</head>

<div id="title-screen" class="screen">
<div class="title-particles" id="title-particles"></div>

<h1 class="game-title">西 游 杀</h1>
<div class="title-glow-line"></div>
<p class="game-sub">取经路上的八十一难 · 一牌一战皆系天命</p>
<div class="card-fan">
<div class="fan-card" style="--fan-c:#8b0000;background:linear-gradient(160deg,#1a0000,#8b0000)">降<br>妖</div>
<div class="fan-card" style="--fan-c:#1a5c1a;background:linear-gradient(160deg,#001a00,#1a5c1a)">蟠<br>桃</div>
<div class="fan-card" style="--fan-c:#4a1a6b;background:linear-gradient(160deg,#0a0010,#4a1a6b)">锦<br>囊</div>
<div class="fan-card" style="--fan-c:#6b4a1a;background:linear-gradient(160deg,#1a0a00,#6b4a1a)">装<br>备</div>
</div>
<div class="title-buttons">
<button class="btn title-btn-1" onclick="startNewGame()">新的旅程</button>

</div>
<div class="title-footer">
<div class="footer-line"></div>
玩法照搬三国杀标准版 · 手牌改名不改效果
<div class="footer-line"></div>
</div>
</div>

<!-- 剧情界面 -->
<div id="story-screen" class="screen hidden">
<p class="story-chapter" id="story-chapter"></p>
<h2 class="story-title" id="story-title"></h2>
<p class="story-text" id="story-text"></p>

<div id="charselect-screen" class="screen hidden">

<p style="font-size:.85em;color:var(--text-dim)">未出战的角色将在休息中恢复体力</p>
</div>

<!-- 战斗界面 -->
<div id="battle-screen" class="screen hidden">
<div class="battle-header">
<span class="chapter" id="bt-chapter"></span>
<span class="title" id="bt-title"></span>
<span class="phase-indicator" id="phase-ind"></span>
</div>
<div class="enemy-area" id="enemy-area">
<div class="char-row">
<div class="char-avatar enemy" id="enemy-avatar">👹</div>
<div class="char-info-block">
<div class="char-name-row">
<span class="char-name enemy" id="enemy-name"></span>
<span class="hp-wrap"><span class="hp-bar-track"><span class="hp-bar-fill" id="enemy-hpbar"></span></span><span class="hp-text" id="enemy-hptext"></span></span>
<span id="enemy-buffs"></span>
</div>
<div class="equip-slots" id="enemy-equips"></div>
</div>
</div>
<div class="enemy-hand" id="enemy-hand"></div>
</div>
<div class="battlefield" id="battlefield"></div>
<div class="battle-log" id="battle-log"></div>
<div class="player-area">
<div class="char-row">
<div class="char-avatar player" id="player-avatar">🐵</div>
<div class="char-info-block">
<div class="char-name-row">
<span class="char-name player" id="player-name"></span>
<span class="hp-wrap"><span class="hp-bar-track"><span class="hp-bar-fill" id="player-hpbar"></span></span><span class="hp-text" id="player-hptext"></span></span>
<span id="player-buffs"></span>
</div>
<div class="equip-slots" id="player-equips"></div>
<div id="player-judge"></div>
</div>
</div>
<div class="player-hand" id="player-hand"></div>
<div class="actions" id="player-actions">
<button class="btn-sm" id="end-turn-btn" onclick="endPlayerTurn()">结束回合</button>
</div>
</div>
</div>

<!-- 响应弹窗 -->
<div class="modal-overlay hidden" id="response-modal">
<div class="modal-box">
<p class="modal-title" id="response-title"></p>
<p class="modal-text" id="response-text"></p>
<div class="modal-buttons" id="response-buttons"></div>
</div>
</div>

<!-- 事件界面 -->
<div id="event-screen" class="screen hidden">
<p class="story-chapter" id="event-chapter"></p>
<h2 class="story-title" id="event-title"></h2>
<p class="story-text" id="event-text"></p>
<div class="event-choices" id="event-choices"></div>
</div>

<!-- 关卡选择 -->
<div id="level-screen" class="screen hidden">
<h2 class="story-title">关卡选择</h2>
<button class="btn-sm" onclick="showScreen('title-screen')">返回</button>
<div class="level-grid" id="level-grid"></div>
</div>

<!-- 失败界面 -->
<div id="over-screen" class="screen hidden">
<h2 class="over-title lose" id="over-title">败北</h2>
<p class="story-text" id="over-text"></p>
<div>
<button class="btn" onclick="retryLevel()">重试本关</button>
<button class="btn" onclick="showLevelSelect()">关卡选择</button>
</div>
</div>

<div id="victory-screen" class="screen hidden">
<h2 class="over-title win">通关！</h2>
<p class="story-text">历经八十一难，终于取得真经，功德圆满！</p>
<button class="btn" onclick="location.reload()">重新开始</button>
</div>

</div>

const SND={ctx:null,enabled:true,
init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){this.enabled=false}}},
tone(freq,dur,type,vol){if(!this.enabled)return;this.init();if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||"sine";o.frequency.value=freq;g.gain.value=vol||.08;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+(dur||.15));o.stop(this.ctx.currentTime+(dur||.15))},
seq(notes){notes.forEach(n=>setTimeout(()=>this.tone(n[0],n[1],n[2],n[3]),n[4]||0))},
play(){this.tone(440,.1,"square",.06)},
draw(){this.tone(330,.08,"triangle",.05)},
damage(){this.seq([[150,.2,"sawtooth",.1,0],[100,.15,"sawtooth",.08,80]])},
heal(){this.seq([[523,.12,"sine",.06,0],[659,.12,"sine",.06,100]])},
skill(){this.seq([[440,.08,"square",.05,0],[587,.08,"square",.05,60],[740,.15,"square",.06,120]])},
turn(){this.tone(220,.2,"sine",.05)},
equip(){this.tone(500,.1,"triangle",.06)},
victory(){this.seq([[523,.15,"sine",.07,0],[659,.15,"sine",.07,150],[784,.15,"sine",.07,300],[1047,.3,"sine",.08,450]])},
defeat(){this.seq([[330,.2,"sine",.06,0],[262,.2,"sine",.06,200],[196,.4,"sine",.05,400]])},
flip(){this.tone(600,.05,"square",.04)},

// ==================== 构建牌堆 ====================
function buildDeck(){
const deck=[];let id=0;
for(const[key,def]of Object.entries(CARD_DEF)){
const suits=CARD_SUITS[key]||[];
const count=CARD_COUNTS[key]||suits.length;
for(let i=0;i<count;i++){
const sr=suits[i%suits.length];
const suit=sr[0],rank=sr[1];
const red=isRed(suit);
let cls=def.t;
if(def.t==='basic')cls='basic-'+def.st;
if(def.t==='equip')cls='equip-'+def.st;
deck.push({id:id++,key:key,name:def.n,type:def.t,basicSubtype:def.st||null,equipSubtype:def.st||null,range:def.r||null,suit:suit,rank:rank,red:red,desc:def.d,cls:cls});
}
}
return shuffle(deck);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeCombatant(charKey,bossData){
const char=CHARS[charKey];
const hp=bossData?bossData.hp:char.maxHp;
const maxHp=bossData?bossData.hp:char.maxHp;
const drawCount=bossData?bossData.draw:2;
return{
charKey:charKey,name:bossData?bossData.name:char.name,
hp:hp,maxHp:maxHp,drawCount:drawCount,
hand:[],equipment:{weapon:null,armor:null,mount:null,defMount:null},
judge:[],shaPlayed:false,
skills:bossData?bossData.skills:(char.skills||[]),
skillUsed:{},
alive:true,skillsDef:bossData?null:char.skills,
isEnemy:!!bossData,
bossData:bossData,
};
}

// ==================== 工具函数 ====================
function log(msg,cls=""){G.log.push({msg,cls});renderLog()}
function drawFromDeck(n=1){const cards=[];for(let i=0;i<n;i++){if(G.deck.length===0){G.deck=shuffle(G.discard);G.discard=[];log("牌堆重洗","log-system")}if(G.deck.length>0)cards.push(G.deck.pop())}return cards}
function findCard(side,key){return side.hand.findIndex(c=>c.key===key)}
function hasCard(side,key){return side.hand.some(c=>c.key===key)}
function dist(a,b){let d=1;if(a.equipment.mount)d--;if(b.equipment.defMount)d++;return Math.max(1,d)}
function canPlayBasic(side,card){
if(card.key==="sha"&&side.shaPlayed&&!(side.equipment.weapon&&side.equipment.weapon.key==="crossbow"))return{ok:false,msg:"每回合限出一张降妖"};
if(card.key==="sha"){
const opp=side.isEnemy?G.player:G.enemy;
const d=dist(side,opp);
const range=side.equipment.weapon?(side.equipment.weapon.range||1):1;
if(d>range)return{ok:false,msg:"距离不够，需武器或坐骑"};
}
return{ok:true}
}

function renderHand(){
const ph=document.getElementById("player-hand");
const prevCount=ph.childElementCount;
ph.innerHTML="";
const p=G.player;
const isDiscard=G.awaitingResponse&&G.awaitingResponse.type==="discard";
const canAct=(G.turn==="player"&&G.phase==="play"&&!G.awaitingResponse)||isDiscard;
const tut=G.tutorialStep>0&&G.tutorialStep<10;
p.hand.forEach((card,i)=>{
const div=document.createElement("div");
div.className="card "+card.cls;
if(i>=prevCount)div.classList.add("card-entering");
if(isDiscard){
// all cards clickable for discard
}else if(tut){
if(!isTutorialCard(G.tutorialStep,card))div.classList.add("disabled");
}else if(!canAct||!canPlayCardNow(card))div.classList.add("disabled");
div.innerHTML=`<div class="card-corner ${card.red?'red':'black'}">${card.suit}${card.rank}</div><div class="card-name">${card.name}</div><div class="card-desc">${card.desc}</div>`;
if(isDiscard){
div.onclick=()=>discardCard(i);
}else if(tut){
if(isTutorialCard(G.tutorialStep,card))div.onclick=()=>onCardClick(i);
}else if(canAct&&canPlayCardNow(card)){
div.onclick=()=>onCardClick(i);
}

});

function discardCard(idx){
const p=G.player;
const card=p.hand.splice(idx,1)[0];
G.discard.push(card);
log("弃置"+card.name,"log-system");
G.awaitingResponse.need--;
if(G.awaitingResponse.need<=0){
G.awaitingResponse=null;
log("你结束了回合","log-player");
G.turn="enemy";
renderBattle();
setTimeout(()=>aiTurn(),500);
return;
}
renderHand();
}
function canPlayCardNow(card){
if(card.key==="shan")return false;
if(card.key==="wuxie")return false;
if(card.key==="sha"){
const r=canPlayBasic(G.player,card);
if(!r.ok)return false;
}
if(card.key==="tao"&&G.player.hp>=G.player.maxHp)return false;
return true;
}

// ==================== 出牌逻辑 ====================
function onCardClick(idx){
const p=G.player;
const card=p.hand[idx];
if(!card)return;
if(G.tutorialStep>0&&G.tutorialStep<10){handleTutorialClick(idx);return}
if(card.type==="basic")playBasic(idx);
else if(card.type==="trick")playTrick(idx);
else if(card.type==="delay")playDelay(idx);
else if(card.type==="equip")playEquipment(idx);
}

function playBasic(idx){
const p=G.player,e=G.enemy;
const card=p.hand[idx];
const chk=canPlayBasic(p,card);
if(!chk.ok){log(chk.msg,"log-system");return}
if(card.key==="tao"&&p.hp>=p.maxHp){log("体力已满","log-system");return}
// remove from hand
p.hand.splice(idx,1);
G.discard.push(card);
if(card.key==="sha"){
p.shaPlayed=true;
G._lastPlayerCardKey="sha";
log(`${p.name}出了降妖！`,"log-player");
SND.play();
const fc=showFieldCard(card,"player");
resolveSha(p,e,card);
setTimeout(()=>removeFieldCard(fc),1500);
}else if(card.key==="tao"){
p.hp=Math.min(p.maxHp,p.hp+1);
log(`${p.name}使用蟠桃，回复1点体力`,"log-heal");
SND.heal();fxHeal("player");fxHpChange("player");fxDmgFloat("player",-1);
const fc=showFieldCard(card,"player");
setTimeout(()=>removeFieldCard(fc),1500);
}
renderBattle();
checkEnd();
}

function playTrick(idx){
const p=G.player,e=G.enemy;
const card=p.hand[idx];
if(card.key==="shunshou"&&dist(p,e)>1){log("距离不够，无法顺手牵宝","log-system");return}

case"nanman":if(hasCard(e,"sha")){const si=findCard(e,"sha");const sc=e.hand.splice(si,1)[0];G.discard.push(sc);log(`${e.name}出了降妖抵挡群妖来袭`,"log-enemy")}else{damage(e,1,p);log(`${e.name}受群妖来袭1点伤害`,"log-damage")}break;
case"wanjian":enemyRespondWanjian();break;

case"jiedao":if(e.equipment.weapon){const w=e.equipment.weapon;G.discard.push(w);e.equipment.weapon=null;log(`${e.name}被迫弃去${w.name}`,"log-enemy")}else{damage(e,1,p);log(`${e.name}无武器，受1点伤害`,"log-damage")}break;
case"juedou":resolveDuel(p,e);break;
case"wugu":const c1=drawFromDeck(1)[0];const c2=drawFromDeck(1)[0];p.hand.push(c1);e.hand.push(c2);log(`仙果普降，双方各得1牌`,"log-heal");break;

renderBattle();

// ==================== 降妖结算 ====================
function resolveSha(source,target,card){
// check target armor
if(target.equipment.armor){
if(target.equipment.armor.key==="renwang"&&!card.red){
log(`${target.name}的玄铁盾抵消了黑色降妖`,"log-system");
return;
}
if(target.equipment.armor.key==="bagua"){
const jc=drawFromDeck(1)[0];G.discard.push(jc);
log(`八卦阵判定：${jc.suit}${jc.rank} ${jc.red?"红":"黑"}`,"log-system");
if(jc.red){log("八卦阵判定红色，视为出了遁法","log-system");return;}
}
}
// check source weapon qinggang
const qinggang=source.equipment.weapon&&source.equipment.weapon.key==="qinggang";
// enemy respond (if target is enemy, AI; if target is player, prompt)
if(target.isEnemy){
// AI dodge
if(!qinggang&&hasCard(target,"shan")){
if(target.hp<=2||target.hand.length>4||Math.random()<0.5){
const si=findCard(target,"shan");
const sc=target.hand.splice(si,1)[0];
G.discard.push(sc);
log(`${target.name}出了遁法`,"log-enemy");
// guanshi: discard 2 to force hit
if(source.equipment.weapon&&source.equipment.weapon.key==="guanshi"&&source.hand.length>=2){
showResponse("贯石斧",`${target.name}出了遁法！是否弃2牌强制命中？`,[
{label:"弃2牌强命中",action:()=>{
for(let g=0;g<2;g++){const gc=source.hand.splice(0,1)[0];G.discard.push(gc)}
log(`贯石斧：弃2牌强制命中！`,"log-player");
let dmg=1;
if(source.skills.includes("manniu"))dmg=2;
if(source.skills.includes("sanmei"))dmg=2;
if(!source.isEnemy&&source._atkBuff)dmg+=source._atkBuff;
if(target.skills&&target.skills.includes("xiniu")){dmg=Math.max(0,dmg-1);if(dmg===0)log(`${target.name}犀角护体抵消`,"log-system")}
if(dmg>0){damage(target,dmg,source);if(target.hp>0)onShaDamage(source,target,card)}
renderBattle();checkEnd();
}},
{label:"放弃",action:()=>{renderBattle()}},
]);
return;
}
// qinglong: allow another sha
if(source.equipment.weapon&&source.equipment.weapon.key==="qinglong"&&source.shaPlayed&&!source._qinglongUsed){
source._qinglongUsed=true;source.shaPlayed=false;
log(`${source.name}的青龙偃月刀：可再出一张降妖`,"log-player");
}
return;
}
}
// not dodged
let dmg=1;
if(source.skills.includes("manniu"))dmg=2;
if(source.skills.includes("sanmei"))dmg=2;
if(!source.isEnemy&&source._atkBuff)dmg+=source._atkBuff;
// xiniu: reduce sha damage by 1
if(target.skills&&target.skills.includes("xiniu")){dmg=Math.max(0,dmg-1);if(dmg===0)log(`${target.name}犀角护体抵消降妖伤害`,"log-system")}
// hanbing: replace damage with discard 2
if(source.equipment.weapon&&source.equipment.weapon.key==="hanbing"&&target.hand.length>=2){
for(let h=0;h<2;h++){const dc=target.hand.splice(0,1)[0];G.discard.push(dc)}
log(`寒冰剑：${target.name}弃2牌代替伤害`,"log-system");
}else if(dmg>0){
damage(target,dmg,source);
if(target.hp>0)onShaDamage(source,target,card);
}
}else{
// player is target - prompt
if(!qinggang&&hasCard(target,"shan")){
showResponse("敌人出了降妖！",`${source.name}对你出了降妖。是否出遁法抵消？`,[
{label:"出遁法",action:()=>{
const si=findCard(target,"shan");
const sc=target.hand.splice(si,1)[0];
G.discard.push(sc);
log(`${target.name}出了遁法`,"log-player");
renderBattle();checkEnd();
}},
{label:"受到伤害",danger:true,action:()=>{
let dmg=1;
if(source.skills.includes("manniu"))dmg=2;
if(source.skills.includes("sanmei"))dmg=2;
if(source.skills.includes("jiutou2")){dmg=1;log("九灵元圣圣威：降妖不可闪避","log-enemy")}
damage(target,dmg,source);
if(target.hp>0)onShaDamage(source,target,card);
renderBattle();checkEnd();
}},
]);
}else{
let dmg=1;
if(source.skills.includes("manniu"))dmg=2;
if(source.skills.includes("sanmei"))dmg=2;
if(source.skills.includes("jiutou2")){dmg=1;log("九灵元圣圣威：降妖不可闪避","log-enemy")}
damage(target,dmg,source);
if(target.hp>0)onShaDamage(source,target,card);
}
}
}

function onShaDamage(source,target,card){
// cixiong: target discards
if(source.equipment.weapon&&source.equipment.weapon.key==="cixiong"&&target.hand.length>0){
const di=Math.floor(Math.random()*target.hand.length);
const dc=target.hand.splice(di,1)[0];G.discard.push(dc);
log(`雌雄双剑：${target.name}被迫弃1牌`,"log-system");
}
// qilin: discard mount
if(source.equipment.weapon&&source.equipment.weapon.key==="qilin"){
if(target.equipment.mount){G.discard.push(target.equipment.mount);target.equipment.mount=null;log(`麒麟弓击落${target.name}的坐骑`,"log-system")}
else if(target.equipment.defMount){G.discard.push(target.equipment.defMount);target.equipment.defMount=null;log(`麒麟弓击落${target.name}的坐骑`,"log-system")}
}
// madu: reflect
if(target.skills&&target.skills.includes("madu")){

// ==================== 斗法结算 ====================
function resolveDuel(source,target){
let cur=target,other=source;
let depth=0;
while(depth<20){
const si=findCard(cur,"sha");
if(si<0){
damage(cur,1,other);
log(`${cur.name}无降妖可出，受1点伤害`,"log-damage");
return;
}
const sc=cur.hand.splice(si,1)[0];G.discard.push(sc);
log(`${cur.name}出了降妖应战`,"log-"+(cur.isEnemy?"enemy":"player"));
[cur,other]=[other,cur];
depth++;
}
damage(cur,1,other);
log("斗法僵持不下，"+cur.name+"受1点伤害","log-damage");
}

// ==================== 伤害与死亡 ====================
function damage(target,amount,source){
// defense buff
if(!target.isEnemy&&target._defBuff){
amount=Math.max(0,amount-target._defBuff);
log(`防御增益抵消${target._defBuff}点伤害`,"log-heal");
}
// liusha shield
if(!target.isEnemy&&target.charKey==="shaseng"&&(target.skillUsed.liusha||0)<1&&target.hand.length>0){
target.skillUsed.liusha=1;
const di=0;const dc=target.hand.splice(di,1)[0];G.discard.push(dc);
log(`沙和尚流沙护体：弃1牌抵消1伤`,"log-heal");
amount=Math.max(0,amount-1);
}
if(amount<=0)return;
target.hp-=amount;
log(`${target.name}受到${amount}点伤害 (${target.hp}/${target.maxHp})`,"log-damage");
SND.damage();
fxDamage(target.isEnemy?"enemy":"player");
fxHpChange(target.isEnemy?"enemy":"player");
fxDmgFloat(target.isEnemy?"enemy":"player",amount);
if(amount>=2)fxShake();
if(target.hp<=0){
target.hp=0;
target.alive=false;
}
}

function checkEnd(){
// 结算前归还被人种袋锁走的牌，避免关卡结束时牌凭空消失
if(G.player._locked&&G.player._locked.length){G.player.hand.push(...G.player._locked);G.player._locked=[]}
if(!G.player.alive){
setTimeout(()=>onLevelFail(),800);
return;
}
if(!G.enemy.alive){
// check huapo revive
if(G.enemy.skills&&G.enemy.skills.includes("huapo")&&!G.enemy._revived){
G.enemy._revived=true;G.enemy.hp=Math.min(G.enemy.maxHp,3);G.enemy.alive=true;
log("白骨精化尸大法：复活并恢复3体力！","log-enemy");
fxHeal("enemy");renderBattle();
return;
}
setTimeout(()=>onLevelWin(),800);
return;
}
}

function aiTurn(){
const e=G.enemy,p=G.player;

aiJudgePhase(e);
// boss passive skills
applyBossStart(e,p);
// draw phase

e.hand.push(...drawn);
e.shaPlayed=false;e._qinglongUsed=false;e.skillUsed={};
SND.draw();

fxTurn("enemy");
setPhase("敌方回合","enemy-turn");
clearFieldCards();

// play phase
if(!e.skipPlay){
setTimeout(()=>aiPlayPhase(e,p),500);
}else{
e.skipPlay=false;
log(`${e.name}被迷心劫影响，跳过出牌阶段`,"log-system");
setTimeout(()=>aiEndTurn(),500);
}
}

function aiJudgePhase(e){
if(e.judge.length===0)return;
const toResolve=[...e.judge];
e.judge=[];
for(const card of toResolve){
const jc=drawFromDeck(1)[0];G.discard.push(jc);
log(`判定${card.name}：${jc.suit}${jc.rank}`,"log-system");
if(card.key==="lebu"){
if(jc.suit!=="♥"){
e.skipPlay=true;
log(`迷心劫判定非红桃，${e.name}跳过出牌阶段`,"log-system");
}
G.discard.push(card);
}else if(card.key==="shandian"){
if(jc.suit==="♠"&&parseInt(jc.rank)>=2&&parseInt(jc.rank)<=9){
damage(e,2,e);
log(`天雷劫判定黑桃${jc.rank}，${e.name}受2点伤害`,"log-damage");
G.discard.push(card);
}else{
// pass to player
G.player.judge.push(card);
log(`天雷劫未触发，传给${G.player.name}`,"log-system");
}
}
}
renderBattle();
}

function aiPlayPhase(e,p){
let actions=0;
while(actions<8&&e.alive){
const action=aiDecide(e,p);
if(!action)break;
actions++;
switch(action.type){
case"sha":
const si=findCard(e,"sha");
if(si>=0){
const card=e.hand.splice(si,1)[0];G.discard.push(card);
e.shaPlayed=true;
SND.play();
const fc=showFieldCard(card,"enemy");
log(`${e.name}出了降妖！`,"log-enemy");
renderBattle();
// player response
if(hasCard(p,"shan")||p.equipment.armor){
setTimeout(()=>{removeFieldCard(fc);promptPlayerDodge(e,card)},300);
return;
}else{
let dmg=1;
if(e.skills.includes("manniu"))dmg=2;
if(e.skills.includes("sanmei"))dmg=2;
damage(p,dmg,e);
if(p.hp>0)onShaDamage(e,p,card);
renderBattle();
setTimeout(()=>removeFieldCard(fc),1500);
if(!p.alive){setTimeout(()=>onLevelFail(),800);return}
}
}
break;
case"tao":
if(e.hp<e.maxHp){
const ti=findCard(e,"tao");
if(ti>=0){
const card=e.hand.splice(ti,1)[0];G.discard.push(card);
e.hp++;
log(`${e.name}使用蟠桃回复1体力`,"log-heal");
renderBattle();
}
}
break;
case"equip":
const ei=e.hand.findIndex(c=>c.type==="equip");
if(ei>=0){
const card=e.hand.splice(ei,1)[0];
const st=card.equipSubtype;
if(st==="weapon"&&!e.equipment.weapon)e.equipment.weapon=card;
else if(st==="armor"&&!e.equipment.armor)e.equipment.armor=card;
else if(st==="mount"){
if(card.key==="jiahorse"&&!e.equipment.defMount)e.equipment.defMount=card;
else if(card.key!=="jiahorse"&&!e.equipment.mount)e.equipment.mount=card;
else{e.hand.push(card);break}
}
else{e.hand.push(card);break}
log(`${e.name}装备了${card.name}`,"log-enemy");
SND.equip();
const fc=showFieldCard(card,"enemy");
setTimeout(()=>removeFieldCard(fc),1500);
renderBattle();
}
break;
case"trick":
aiPlayTrick(e,p);
renderBattle();
break;
}
}
if(!e.alive){checkEnd();return}
setTimeout(()=>aiEndTurn(),500);
}

function aiDecide(e,p){
if(e.hp<=2&&hasCard(e,"tao")&&e.hp<e.maxHp)return{type:"tao"};
if(hasCard(e,"sha")&&!e.shaPlayed&&dist(e,p)<=((e.equipment.weapon&&e.equipment.weapon.range)||1))return{type:"sha"};
// equip
const ei=e.hand.findIndex(c=>c.type==="equip");
if(ei>=0){
const card=e.hand[ei];
const st=card.equipSubtype;
if((st==="weapon"&&!e.equipment.weapon)||(st==="armor"&&!e.equipment.armor)||(st==="mount"&&(card.key==="jiahorse"?!e.equipment.defMount:!e.equipment.mount)))return{type:"equip"};
}
// tricks - priority order
if(hasCard(e,"wuzhong"))return{type:"trick",key:"wuzhong"};
if(hasCard(e,"jiedao")&&p.equipment.weapon)return{type:"trick",key:"jiedao"};
if(hasCard(e,"guohe")&&(p.equipment.weapon||p.hand.length>3))return{type:"trick",key:"guohe"};
if(hasCard(e,"juedou")&&e.hand.filter(c=>c.key==="sha").length>=2&&p.hand.filter(c=>c.key==="sha").length<=1)return{type:"trick",key:"juedou"};
if(hasCard(e,"nanman")&&!hasCard(p,"sha"))return{type:"trick",key:"nanman"};
if(hasCard(e,"wanjian")&&!hasCard(p,"shan"))return{type:"trick",key:"wanjian"};
if(hasCard(e,"lebu")&&!p.judge.some(c=>c.key==="lebu"))return{type:"trick",key:"lebu"};
if(hasCard(e,"shandian")&&!p.judge.some(c=>c.key==="shandian")&&Math.random()<0.5)return{type:"trick",key:"shandian"};
if(hasCard(e,"shunshou")&&dist(e,p)<=1&&p.hand.length>0)return{type:"trick",key:"shunshou"};
if(hasCard(e,"nanman")&&p.hp<=3)return{type:"trick",key:"nanman"};
if(hasCard(e,"wanjian")&&p.hp<=3)return{type:"trick",key:"wanjian"};
return null;
}

function aiPlayTrick(e,p){
const keys=["wuzhong","jiedao","guohe","juedou","nanman","wanjian","lebu","shandian","shunshou"];
for(const key of keys){
if(!hasCard(e,key))continue;
// check player wuxie
let cancelled=false;
if(p.hand.some(c=>c.key==="wuxie")){
const chance=key==="nanman"||key==="wanjian"?0.7:0.4;
if(Math.random()<chance){
const wi=findCard(p,"wuxie");
const wc=p.hand.splice(wi,1)[0];G.discard.push(wc);
log(`你出了护身法抵消${e.name}的锦囊`,"log-player");
cancelled=true;
}
}
if(cancelled)continue;
const ti=findCard(e,key);
const card=e.hand.splice(ti,1)[0];
if(key!=="lebu"&&key!=="shandian")G.discard.push(card);
log(`${e.name}出了${card.name}`,"log-enemy");
SND.play();
const fc=showFieldCard(card,"enemy");
setTimeout(()=>removeFieldCard(fc),1500);
switch(key){
case"wuzhong":const dr=drawFromDeck(2);e.hand.push(...dr);log(`${e.name}摸了2牌`,"log-enemy");break;
case"nanman":if(hasCard(p,"sha")){const si=findCard(p,"sha");const sc=p.hand.splice(si,1)[0];G.discard.push(sc);log(`你出了降妖抵挡群妖来袭`,"log-player")}else{damage(p,1,e);log("你受群妖来袭1伤","log-damage")}break;
case"wanjian":{let dodged=false;if(p.equipment.armor&&p.equipment.armor.key==="bagua"){const jc=drawFromDeck(1)[0];G.discard.push(jc);log(`八卦阵判定：${jc.suit}${jc.rank}`,"log-system");if(jc.red){log("八卦阵判定红色，万箭穿云被抵消","log-system");dodged=true}}if(!dodged&&hasCard(p,"shan")){const si=findCard(p,"shan");const sc=p.hand.splice(si,1)[0];G.discard.push(sc);log(`你出了遁法抵挡万箭穿云`,"log-player");dodged=true}if(!dodged){damage(p,1,e);log("你受万箭穿云1伤","log-damage")}break;}
case"guohe":if(p.equipment.weapon){const w=p.equipment.weapon;p.equipment.weapon=null;G.discard.push(w);log(`${e.name}拆掉了你的${w.name}`,"log-enemy")}else if(p.hand.length>0){const di=Math.floor(Math.random()*p.hand.length);const dc=p.hand.splice(di,1)[0];G.discard.push(dc);log(`${e.name}拆掉你一张手牌`,"log-enemy")}break;
case"shunshou":if(dist(e,p)<=1&&p.hand.length>0){const si=Math.floor(Math.random()*p.hand.length);const stolen=p.hand.splice(si,1)[0];e.hand.push(stolen);log(`${e.name}顺走你一张牌`,"log-enemy")}break;
case"lebu":p.judge.push(card);log(`${e.name}对你使用迷心劫`,"log-enemy");break;
case"juedou":resolveDuel(e,p);break;
case"jiedao":if(p.equipment.weapon){const w=p.equipment.weapon;p.equipment.weapon=null;G.discard.push(w);log(`借宝降妖：${e.name}迫使你弃去${w.name}`,"log-enemy")}else{damage(p,1,e);log(`你无武器，受借宝降妖1伤`,"log-damage")}break;
case"shandian":p.judge.push(card);log(`${e.name}对你使用天雷劫`,"log-enemy");break;
}
return;
}
}

else if(e.hand.length>0){const di=Math.floor(Math.random()*e.hand.length);const dc=e.hand.splice(di,1)[0];G.discard.push(dc);log(`拆桥断路：弃掉${e.name}一张手牌`,"log-player")}

function aiEndTurn(){
const e=G.enemy,p=G.player;
// unlock player locked cards
if(p._locked){p.hand.push(...p._locked);p._locked=[];log("人种袋中的牌归还","log-system")}
// discard phase
while(e.hand.length>e.hp){
// discard lowest priority
let idx=0;let priority=99;
e.hand.forEach((c,i)=>{
let pr=5;
if(c.key==="wuxie")pr=1;
else if(c.key==="shan")pr=2;
else if(c.key==="tao")pr=3;
else if(c.key==="sha")pr=4;
else if(c.type==="equip")pr=6;
else if(c.type==="trick")pr=7;
if(pr<priority){priority=pr;idx=i}
});
const dc=e.hand.splice(idx,1)[0];G.discard.push(dc);
}
log(`${e.name}结束回合`,"log-enemy");
// switch to player
G.turn="player";G.phase="play";
playerTurnStart();
}

SND.play();
const fc=showFieldCard(card,"enemy");
log(`${e.name}出了降妖！`,"log-enemy");
renderBattle();
if(hasCard(p,"shan")||p.equipment.armor){setTimeout(()=>{removeFieldCard(fc);promptPlayerDodge(e,card)},300);return}
else{let d=1;if(e.skills.includes("manniu"))d=2;if(e.skills.includes("sanmei"))d=2;damage(p,d,e);if(p.hp>0)onShaDamage(e,p,card);renderBattle();setTimeout(()=>removeFieldCard(fc),1500);if(!p.alive){setTimeout(()=>onLevelFail(),800);return}}
}
break;
case"tao":if(e.hp<e.maxHp){const ti=findCard(e,"tao");if(ti>=0){const c=e.hand.splice(ti,1)[0];G.discard.push(c);e.hp++;log(`${e.name}用蟠桃回1血`,"log-heal");renderBattle()}}
break;
case"equip":{const ei=e.hand.findIndex(c=>c.type==="equip");if(ei>=0){const c=e.hand.splice(ei,1)[0];const st=c.equipSubtype;if(st==="weapon"){if(e.equipment.weapon)G.discard.push(e.equipment.weapon);e.equipment.weapon=c}else if(st==="armor"){if(e.equipment.armor)G.discard.push(e.equipment.armor);e.equipment.armor=c}else if(st==="mount"){if(c.key==="jiahorse"){if(e.equipment.defMount)G.discard.push(e.equipment.defMount);e.equipment.defMount=c}else{if(e.equipment.mount)G.discard.push(e.equipment.mount);e.equipment.mount=c}}log(`${e.name}装备${c.name}`,"log-enemy");SND.equip();const fc=showFieldCard(c,"enemy");setTimeout(()=>removeFieldCard(fc),1500);renderBattle()}}
break;
case"trick":aiPlayTrick(e,p);renderBattle();break;
}
}
if(!e.alive){checkEnd();return}
if(!p.alive){setTimeout(()=>onLevelFail(),800);return}
aiEndTurn();
},300);
}

// ==================== 技能 ====================
function useSkill(key){
const p=G.player;
if(G.tutorialStep>0&&G.tutorialStep<10){useSkillTutorial(key);return}
SND.skill();fxSkill("player");
if(key==="huoyan"){
if((p.skillUsed.huoyan||0)>=1)return;
p.skillUsed.huoyan=1;
const cards=G.enemy.hand.map(c=>`${c.name}(${c.suit}${c.rank})`).join("、");
showResponse("火眼金睛",`${G.enemy.name}的手牌：${cards}`,[{label:"知道了",action:()=>{}}]);
log("孙悟空使用火眼金睛查看敌方手牌","log-player");
}
else if(key==="bian"){
if((p.skillUsed.bian||0)>=1)return;
showResponse("七十二变","选择要变化的基本牌类型：",[
{label:"降妖",action:()=>{doBian("sha")}},
{label:"遁法",action:()=>{doBian("shan")}},
{label:"蟠桃",action:()=>{doBian("tao")}},
]);
}
else if(key==="tianpeng"){
const idx=p.hand.findIndex(c=>c.red&&c.key!=="sha");
if(idx<0){log("没有可用的红色牌","log-system");return}
const old=p.hand[idx];
const def=CARD_DEF["sha"];
const newCard={...old,key:"sha",name:def.n,type:"basic",basicSubtype:"sha",desc:def.d,cls:"basic-sha"};
p.hand[idx]=newCard;
log(`天蓬之力：将${old.name}(${old.suit}${old.rank})变为降妖`,"log-player");
renderBattle();
}
else if(key==="zhangba_skill"){
if(p.hand.length<2){log("手牌不足","log-system");return}
const c1=p.hand.splice(0,1)[0];G.discard.push(c1);
const c2=p.hand.splice(0,1)[0];G.discard.push(c2);
const def=CARD_DEF["sha"];
const newCard={id:Math.random(),key:"sha",name:"丈八蛇矛·降妖",type:"basic",basicSubtype:"sha",suit:c1.suit,rank:c1.rank,red:c1.red,desc:"丈八蛇矛化降妖",cls:"basic-sha"};
p.hand.push(newCard);
log(`丈八蛇矛：将${c1.name}+${c2.name}合为降妖`,"log-player");
renderBattle();
}
}
function doBian(targetKey){
const p=G.player;
// find any non-basic card to transform
const idx=p.hand.findIndex(c=>c.type!=="basic"||c.key!==targetKey);
if(idx<0){log("没有可变化的牌","log-system");return}
const old=p.hand[idx];
const def=CARD_DEF[targetKey];
let cls="basic-"+def.st;
const newCard={id:old.id,key:targetKey,name:def.n,type:"basic",basicSubtype:def.st,suit:old.suit,rank:old.rank,red:old.red,desc:def.d,cls:cls};
p.hand[idx]=newCard;
p.skillUsed.bian=1;
log(`七十二变：将${old.name}变为${newCard.name}`,"log-player");
renderBattle();
}

// ==================== 关卡流程 ====================
function startNewGame(){
SND.init();
G=newGameState();
G.level=0;
save();
startLevel(0);
}

function continueGame(){
const data=load();
if(data){
G=Object.assign(newGameState(),data);
startLevel(G.level);
}
}

function startLevel(n){
G.level=n;
save();
const type=levelType(n);
if(n===0){startTutorial();return}
if(type==="plot"){showStory(n);return}
if(type==="event"){showEvent(n);return}
if(type==="finale"&&n===80){showStory(80);return}
if(G.buffs.bianhua){delete G.buffs.bianhua;log("变化通关：无伤通过本关","log-system");nextLevel();return}
// battle: show char select
if(G.party.length>1){
showCharSelect(n);
}else{
G.selectedChar=G.party[0];
startBattle(n);
}
}

function showCharSelect(n){
showScreen("charselect-screen");
const el=document.getElementById("char-select-cards");
el.innerHTML="";
G.party.forEach(key=>{
const ch=CHARS[key];
const hp=G.partyHp[key];
const injured=hp<=0;
const div=document.createElement("div");
div.className="char-card"+(injured?" injured":"");
const svg=getCharSvg(null,ch.key);const av=svg?'<img src="'+svg+'" style="width:48px;height:48px;border-radius:50%;border:2px solid var(--gold-dim);object-fit:cover">':(ch.key==='wukong'?'🐵':ch.key==='bajie'?'🐷':'🧔');
div.innerHTML=`<div style="margin-bottom:4px">${av}</div><div class="ch-name">${ch.name}</div><div class="ch-hp">体力 ${hp}/${ch.maxHp}</div><div class="ch-skill">${ch.skills.map(s=>s.name).join(" · ")}</div>`;
if(!injured)div.onclick=()=>{G.selectedChar=key;startBattle(n)};
el.appendChild(div);
});
}

function startBattle(n){
const type=levelType(n);
const bossData=getBoss(n);
// apply buffs
let extraHp=0,extraDraw=0,extraAtk=0,extraDef=0;
if(G.buffs.lingji){bossData={...bossData,hp:Math.max(1,bossData.hp-2)};delete G.buffs.lingji}
if(G.buffs.chechi){bossData={...bossData,hp:Math.max(1,bossData.hp-1)};delete G.buffs.chechi}
if(G.buffs.xishi){bossData={...bossData,hp:Math.max(1,bossData.hp-2)};delete G.buffs.xishi}
if(G.buffs.wenfo){bossData={...bossData,skills:[]};delete G.buffs.wenfo}
if(G.buffs.baohua){extraDraw=1;delete G.buffs.baohua}
if(G.buffs.jingji){extraDraw=1;delete G.buffs.jingji}
if(G.buffs.liangguo){extraDraw=2;delete G.buffs.liangguo}
if(G.buffs.zhenxiang){extraDraw=2;delete G.buffs.zhenxiang}
if(G.buffs.xinmo1){extraAtk=1;delete G.buffs.xinmo1}
if(G.buffs.xinmo2){extraDef=1;delete G.buffs.xinmo2}
if(G.buffs.dingli){extraDef=(extraDef||0)+1;delete G.buffs.dingli}
if(G.buffs.guanyin){G.party.forEach(k=>{G.partyHp[k]=CHARS[k].maxHp});delete G.buffs.guanyin}
if(G.buffs.ruolai){G.party.forEach(k=>{G.partyHp[k]=CHARS[k].maxHp});delete G.buffs.ruolai}
if(G.buffs.qiyu){G.party.forEach(k=>{G.partyHp[k]=CHARS[k].maxHp});delete G.buffs.qiyu}
if(n===81&&G.buffs.tuotai){extraHp=2;delete G.buffs.tuotai}
if(G.buffs.luotai){G.partyHp[G.selectedChar]=Math.min(CHARS[G.selectedChar].maxHp,(G.partyHp[G.selectedChar]??CHARS[G.selectedChar].maxHp)+1);delete G.buffs.luotai}

G.player=makeCombatant(G.selectedChar,null);
G.player.hp=(G.partyHp[G.selectedChar]??CHARS[G.selectedChar].maxHp);
G.player.maxHp=CHARS[G.selectedChar].maxHp+extraHp;
G.player.hp=Math.min(G.player.hp+extraHp,G.player.maxHp);
G.player._atkBuff=extraAtk;
G.player._defBuff=extraDef;
G.player.drawBonus=extraDraw;
G.enemy=makeCombatant(null,bossData);
G.deck=buildDeck();
G.discard=[];
G.log=[];
G.turn="player";
G.awaitingResponse=null;
G.tutorialStep=0;

// starting hands
const ph=drawFromDeck(4);G.player.hand.push(...ph);
const eh=drawFromDeck(4);G.enemy.hand.push(...eh);

// boss starting equipment
if(bossData.equip){
const ed=CARD_DEF[bossData.equip];
let cls="equip-"+ed.st;
const ec={id:9999,key:bossData.equip,name:ed.n,type:"equip",equipSubtype:ed.st,range:ed.r,suit:"♣",rank:"A",red:false,desc:ed.d,cls:cls};
if(ed.st==="weapon")G.enemy.equipment.weapon=ec;
else if(ed.st==="armor")G.enemy.equipment.armor=ec;
}

showScreen("battle-screen");
log(`第 ${n} 难：${L81_NAMES[n]}`,"log-system");
log(`${G.enemy.name} 出现！体力 ${G.enemy.hp}/${G.enemy.maxHp}`,"log-system");
renderBattle();
setTimeout(()=>{fxBossEntry();SND.flip()},200);
playerTurnStart();
}

// ==================== 教学关 ====================
function startTutorial(){
G.tutorialStep=1;
G.player=makeCombatant("wukong",null);
G.enemy=makeCombatant(null,KEY_BOSSES[0]);
G.deck=buildDeck();G.discard=[];
G.log=[];G.turn="player";G.awaitingResponse=null;
// give specific cards
G.player.hand=[];
G.player.hand.push(makeCard("sha"));
G.player.hand.push(makeCard("shan"));
G.player.hand.push(makeCard("tao"));
G.player.hand.push(makeCard("qinggang"));
G.enemy.hand=drawFromDeck(4);
showScreen("battle-screen");
log("【教学】大闹天宫 — 如来佛祖降临","log-system");
log("如来佛祖体力99，此战为教学，不可获胜","log-system");
renderBattle();
showTutorialStep(1);
}

function makeCard(key){
const def=CARD_DEF[key];
const suits=CARD_SUITS[key]||[['♠','7']];
const sr=suits[0];
let cls=def.t;
if(def.t==='basic')cls='basic-'+def.st;
if(def.t==='equip')cls='equip-'+def.st;
return{id:Math.random(),key:key,name:def.n,type:def.t,basicSubtype:def.st||null,equipSubtype:def.st||null,range:def.r||null,suit:sr[0],rank:sr[1],red:isRed(sr[0]),desc:def.d,cls:cls};
}

function isTutorialCard(step,card){
if(step===1)return card.key==="sha";
if(step===2)return card.key==="tao";
if(step===3)return card.type==="equip";
return false;
}

function showTutorialStep(step){
const steps=[
null,
{text:"欢迎来到西游杀！这是你的手牌。点击「降妖」对如来发起攻击。",wait:"sha"},
{text:"很好！如来出了遁法抵挡。现在试试用「蟠桃」回复体力。",wait:"tao"},
{text:"体力已回复。接下来装备「青釭剑」，点击它即可装备。",wait:"equip"},
{text:"装备完毕！青釭剑使你的降妖无法被遁法抵挡。点击「火眼金睛」技能查看如来手牌。",wait:"skill"},
{text:"如来佛祖施展佛法无边……五行山镇压！",wait:"end"},
];
if(step<steps.length){
const s=steps[step];
if(s.text){
setTimeout(()=>{
showResponse("教学引导",s.text,[{label:"明白了",action:()=>{hideResponse();G.tutorialStep=step;renderBattle()}}]);
},300);
}
}
}

function handleTutorialClick(idx){
const p=G.player;
const card=p.hand[idx];
const step=G.tutorialStep;
if(step===1&&card.key==="sha"){
// play sha
p.hand.splice(idx,1);G.discard.push(card);
p.shaPlayed=true;
log("你出了降妖！","log-player");
log("如来出了遁法抵消","log-enemy");
p.hp=Math.max(1,p.hp-1);
log("如来反手一掌，你受到1点伤害","log-damage");
renderBattle();
showTutorialStep(2);
}else if(step===2&&card.key==="tao"){
p.hand.splice(idx,1);G.discard.push(card);
p.hp=Math.min(p.maxHp,p.hp+1);
log("你使用蟠桃回复1点体力","log-heal");
renderBattle();
showTutorialStep(3);
}else if(step===3&&card.type==="equip"){
p.hand.splice(idx,1);
p.equipment.weapon=card;
log(`你装备了${card.name}`,"log-player");
renderBattle();
showTutorialStep(4);
}else{
log(step===4?"【教学】这一步请点击上方的「火眼金睛」技能按钮":"【教学】请点击高亮的牌","log-system");
}
}

function useSkillTutorial(key){
if(G.tutorialStep>0&&G.tutorialStep<4){
log("【教学】先按引导出牌，技能稍后再用","log-system");
return;
}
if(G.tutorialStep===4&&key==="huoyan"){
G.player.skillUsed.huoyan=1;
log("孙悟空使用火眼金睛查看敌方手牌","log-player");
log("如来手牌："+G.enemy.hand.map(c=>c.name+"("+c.suit+c.rank+")").join("、"),"log-system");
setTimeout(()=>{
showResponse("教学引导","如来佛祖施展佛法无边……五行山镇压！",[{label:"继续",action:()=>{
hideResponse();
log("孙悟空被压五行山下五百年……","log-system");
setTimeout(()=>{
G.partyHp.wukong=4;
showStory(0,"被镇压","孙悟空被如来以五行山镇压，五百年后，唐僧揭去封条，取经之旅正式开始……");
},1000);
}}]);
},1000);
}else{
log("【教学】请点击「火眼金睛」技能按钮","log-system");
}
}

// ==================== 剧情/事件 ====================
function showStory(n,customTitle,customText){
showScreen("story-screen");
const type=levelType(n);
const title=customTitle||L81_NAMES[n];
const text=customText||STORIES[n]||"";
document.getElementById("story-chapter").textContent=n===0?"教学关":`第 ${n} 难`;
document.getElementById("story-title").textContent=title;
document.getElementById("story-text").textContent=text;
}

function afterStory(){
const n=G.level;
if(n===0){
// tutorial done, go to level 1
G.tutorialStep=0;
G.level=1;G.maxLevel=Math.max(G.maxLevel,1);
save();
startLevel(1);
return;
}
if(n===80){
// finale: start level 81
G.level=81;G.maxLevel=Math.max(G.maxLevel,81);
G.buffs.tuotai=true;
save();
startLevel(81);
return;
}
// next level
const type=levelType(n);
if(type==="plot"){
nextLevel();
}else{
nextLevel();
}
}

function showEvent(n){
showScreen("event-screen");
const ev=EVENT_CHOICES[n];
if(!ev){nextLevel();return}
document.getElementById("event-chapter").textContent=`第 ${n} 难`;
document.getElementById("event-title").textContent=ev.title;
document.getElementById("event-text").textContent=ev.text;
const ec=document.getElementById("event-choices");
ec.innerHTML="";
ev.choices.forEach((choice,i)=>{
const div=document.createElement("div");
div.className="event-choice";
div.innerHTML=`<strong>${choice.label}</strong>`;
div.onclick=()=>{resolveEventChoice(choice.effect)};
ec.appendChild(div);
});
}

function resolveEventChoice(effect){
if(effect.hp){
G.party.forEach(key=>{
G.partyHp[key]=Math.max(0,(G.partyHp[key]??CHARS[key].maxHp)+effect.hp);
});
log(`${effect.hp>0?"回复":"失去"}${Math.abs(effect.hp)}点体力（全队）`,"log-system");
}
if(effect.buff){
G.buffs[effect.buff]=true;
}
if(effect.buff==="guanyin"||effect.buff==="ruolai"||effect.buff==="qiyu"){
G.party.forEach(key=>{G.partyHp[key]=CHARS[key].maxHp});
log("全队体力回满！","log-heal");
}
if(effect.buff==="raolu"){
nextLevel();
return;
}
nextLevel();
}

function nextLevel(){
G.level++;
G.maxLevel=Math.max(G.maxLevel,G.level);
// resting characters heal
G.party.forEach(key=>{
if(key!==G.selectedChar&&G.partyHp[key]<CHARS[key].maxHp){
G.partyHp[key]=Math.min(CHARS[key].maxHp,G.partyHp[key]+1);
}
});
save();
if(G.level>81){
showScreen("victory-screen");
return;
}
startLevel(G.level);
}

// ==================== 胜利/失败 ====================
function onLevelWin(){
const n=G.level;
log(`${G.enemy.name}被击败！`,"log-system");
SND.victory();
// check party join
const boss=KEY_BOSSES[n];
G.partyHp[G.selectedChar]=G.player.hp;
if(boss&&boss.join){
if(boss.join==="bajie"&&!G.party.includes("bajie")){
G.party.push("bajie");
G.partyHp.bajie=CHARS.bajie.maxHp;
log("猪八戒加入队伍！","log-system");
setTimeout(()=>showStory(n,"收降八戒","高老庄一战，猪八戒败北，愿随唐僧西天取经，拜为二徒弟。"),1000);
return;
}
if(boss.join==="shaseng"&&!G.party.includes("shaseng")){
G.party.push("shaseng");
G.partyHp.shaseng=CHARS.shaseng.maxHp;
log("沙和尚加入队伍！","log-system");
}
}
// heal selected char
G.partyHp[G.selectedChar]=G.player.hp;
if(n===81){
setTimeout(()=>showScreen("victory-screen"),1500);
return;
}
// show victory story
setTimeout(()=>{
showStory(n,"胜利",`击败${G.enemy.name}！第${n}难已过，继续前行。`);
},1000);
}

function onLevelFail(){
const n=G.level;
SND.defeat();
if(n===0){
// tutorial failure - proceed
showStory(0,"五行山镇压","孙悟空被如来镇压，五百年后唐僧揭去封条，取经之旅开始……");
return;
}
G.partyHp[G.selectedChar]=Math.max(1,Math.floor(G.player.maxHp/2));
showScreen("over-screen");
document.getElementById("over-title").textContent="败北";
document.getElementById("over-text").textContent=`${G.enemy.name}击败了你……重整旗鼓，再战一回！`;
}

function retryLevel(){
G.partyHp[G.selectedChar]=CHARS[G.selectedChar].maxHp;
startLevel(G.level);
}

function showLevelSelect(){
showScreen("level-screen");
const grid=document.getElementById("level-grid");
grid.innerHTML="";
for(let i=0;i<=81;i++){
const btn=document.createElement("div");
const type=levelType(i);
btn.className="level-btn "+type+(i>G.maxLevel?" locked":"")+(i===G.level?" current":"");
btn.textContent=`${i===0?"教学":i}. ${L81_NAMES[i]||""}`;
if(i<=G.maxLevel)btn.onclick=()=>startLevel(i);
grid.appendChild(btn);
}
}

// ==================== 存档 ====================
function save(){
try{
const data={
level:G.level,maxLevel:G.maxLevel,
party:G.party,partyHp:G.partyHp,partyMaxHp:G.partyMaxHp,
buffs:G.buffs,
};
localStorage.setItem("xiyousha_save",JSON.stringify(data));
}catch(e){}
}

function load(){
try{
const s=localStorage.getItem("xiyousha_save");
if(s){
const data=JSON.parse(s);
if(data&&data.level!==undefined){
document.getElementById("continue-btn").style.display="";
return data;
}
}
}catch(e){}
return null;
}

// ==================== 初始化 ====================
function init(){
load();
// inject title avatar SVG
const ta=document.getElementById("title-avatar");
if(ta){const svg=getCharSvg(null,"wukong");if(svg)ta.innerHTML='<img src="'+svg+'">'};
}
init();

// expose for onclick
window.SND=SND;
window.startNewGame=startNewGame;
window.continueGame=continueGame;
window.afterStory=afterStory;
window.endPlayerTurn=endPlayerTurn;
window.retryLevel=retryLevel;
window.showLevelSelect=showLevelSelect;
window.showScreen=showScreen;
window.useSkill=useSkill;
window.onCardClick=onCardClick;
window.startLevel=startLevel;
window.discardCard=discardCard;
window.hideResponse=hideResponse;

}catch(e){
console.error("Game init error:",e);
document.body.innerHTML='<div style="color:#fff;padding:20px;text-align:center"><h2>游戏加载失败</h2><p>'+e.message+'</p><button onclick="location.reload()" style="padding:10px 20px;margin:10px">重新加载</button></div>';
}
</script>
