renderBattle();
if(hasCard(p,"shan")||p.equipment.armor){setTimeout(()=>{removeFieldCard(fc);promptPlayerDodge(e,card)},300);return}
else{let d=1;if(e.equipment.weapon&&e.equipment.weapon.key==="fangtian"&&e.hand.length===0){d+=1;log('方天画戟：最后一击伤害+1','log-enemy')}if(e._jiuActive){d+=1;e._jiuActive=false;log('仙酿效果：降妖伤害+1','log-enemy')}if(hasSk(e,"manniu"))d=2;if(hasSk(e,"sanmei"))d=2;if(hasSk(e,"huli"))d+=1;if(e._atkBuff)d+=e._atkBuff;if(e._shilongActive){d+=1;e._shilongActive=false}if(!e.isEnemy||(G.mpMode&&e===G.enemy)){const jinbaoSk=e.skills.find(s=>s.key==="jinbao");if(jinbaoSk)d+=(typeof jinbaoSk.perTurn==='number'?jinbaoSk.perTurn:1);const tpSk=e.skills.find(s=>s.key==="tianpeng_up");if(tpSk&&card&&card.red)d+=(typeof tpSk.perTurn==='number'?tpSk.perTurn:1);}if(e.charKey==="yanwang"&&e.hp<=2)d+=1;if(e.charKey==="niulang"&&e.hp<=2)d+=1;if(e.equipment.weapon&&e.equipment.weapon.key==="huosha"&&p.equipment.armor&&p.equipment.armor.key==="tengjia"){d+=1;log('火灵珠灼烧藤甲+1伤','log-damage')}if(hasSk(e,"jiutou2"))d=1;if(hasSk(p,"xiniu")&&d>0)d=Math.max(0,d-1);if(e.equipment.weapon&&e.equipment.weapon.key==="hanbing"&&p.hand.length>=2){for(let h=0;h<2;h++){const dc=p.hand.splice(0,1)[0];G.discard.push(dc)}log('寒冰剑：你弃2牌代替伤害','log-system')}else if(d>0){damage(p,d,e);onShaDamage(e,p,card)}else{log('伤害被完全抵消','log-system')}renderBattle();setTimeout(()=>removeFieldCard(fc),1500);if(!p.alive){setTimeout(()=>{const bid=G.battleId;if(G.player&&!G.player.alive&&G.battleId===bid){if(G.mpMode)mpEndBattle(false);else onLevelFail()}},800);return}}
}
break;
case"tao":if(e.hp<e.maxHp){const ti=findCard(e,"tao");if(ti>=0){const c=e.hand.splice(ti,1)[0];G.discard.push(c);e.hp++;log(`${e.name}用蟠桃回1血`,"log-heal");renderBattle()}}
break;
case"equip":{const ei=e.hand.findIndex(c=>c.type==="equip");if(ei>=0){const c=e.hand.splice(ei,1)[0];const st=c.equipSubtype;if(st==="weapon"){if(e.equipment.weapon)G.discard.push(e.equipment.weapon);e.equipment.weapon=c}else if(st==="armor"){if(e.equipment.armor)G.discard.push(e.equipment.armor);e.equipment.armor=c}else if(st==="mount"){if(c.key==="jiahorse"||c.key==="hualiu"){if(e.equipment.defMount)G.discard.push(e.equipment.defMount);e.equipment.defMount=c}else{if(e.equipment.mount)G.discard.push(e.equipment.mount);e.equipment.mount=c}}log(`${e.name}装备${c.name}`,"log-enemy");SND.equip();const fc=showFieldCard(c,"enemy");setTimeout(()=>removeFieldCard(fc),1500);renderBattle()}}
break;
case"trick":aiPlayTrick(e,p);renderBattle();break;
}
}
if(!e.alive){checkEnd();return}
if(!p.alive){setTimeout(()=>{const bid=G.battleId;if(G.player&&!G.player.alive&&G.battleId===bid){if(G.mpMode)mpEndBattle(false);else onLevelFail()}},800);return}
aiEndTurn();
},300);
}

// ==================== 关卡流程 ====================
function startNewGame(){
SND.init();SND.buttonClick();
G=newGameState();
G.level=0;
save();
startLevel(0);
}

function continueGame(){
SND.buttonClick();
const data=load();
if(data){
G=Object.assign(newGameState(),data);
if(!G.partyExp)G.partyExp={};
if(!G.partyLevel)G.partyLevel={};
if(!G.partySkillPoints)G.partySkillPoints={};
if(!G.partyUnlocked)G.partyUnlocked={};
if(!G.partySkillLv)G.partySkillLv={};
G.party.forEach(k=>{
if(G.partyExp[k]===undefined)G.partyExp[k]=0;
if(G.partyLevel[k]===undefined)G.partyLevel[k]=1;
if(G.partySkillPoints[k]===undefined)G.partySkillPoints[k]=0;
if(!G.partyUnlocked[k])G.partyUnlocked[k]={};
if(!G.partySkillLv[k])G.partySkillLv[k]={};
});
startLevel(G.level);
}
}

function startLevel(n){
G.level=n;
save();
const type=levelType(n);
if(n===0){startTutorial();return}
if(type==="plot"){showStory(n);return}
if(type==="event"){showEvent(n);return}
if(type==="finale"&&n===80){showStory(80);return}
if(G.buffs.bianhua){delete G.buffs.bianhua;log("变化通关：无伤通过本关","log-system");nextLevel();return}
// battle: show char select
if(G.party.length>1){
showCharSelect(n);
}else{
G.selectedChar=G.party[0];
startBattle(n);
}
}

function showCharSelect(n){
showScreen("charselect-screen");
G.charSelectPending=n;
const el=document.getElementById("char-select-cards");
el.innerHTML="";
const btn=document.getElementById("char-confirm-btn");
if(btn)btn.style.display="none";
// safety: if all party members are at 0 HP, revive the first one to 1
const allDead=G.party.every(key=>(G.partyHp[key]??0)<=0);
if(allDead&&G.party.length>0){
G.partyHp[G.party[0]]=1;
log("全队濒危！"+CHARS[G.party[0]].name+"勉强支撑，恢复1点体力","log-heal");
}
G.party.forEach(key=>{
const ch=CHARS[key];
const hp=G.partyHp[key];
const injured=hp<=0;
const lv=(G.partyLevel&&G.partyLevel[key])||1;
const displayMaxHp=ch.maxHp+Math.floor((lv-1)/2);
const exp=(G.partyExp&&G.partyExp[key])||0;
const expNeed=EXP_TABLE[lv]||999;
const expPct=Math.min(100,(exp/(expNeed||1))*100);
const div=document.createElement("div");
div.className="char-card"+(injured?" injured":"")+(key===G.selectedChar?" selected":"");
const svg=getCharSvg(null,ch.key);const av=svg?'<img src="'+svg+'" style="width:48px;height:48px;border-radius:50%;border:2px solid var(--gold-dim);object-fit:cover">':(ch.key==='wukong'?'🐵':ch.key==='bajie'?'🐷':'🧔');
const unlockedCount=Object.keys(G.partyUnlocked&&G.partyUnlocked[key]||{}).length;
div.innerHTML=`<div style="margin-bottom:4px">${av}</div><div class="ch-name">${ch.name}</div><div class="ch-lv">Lv.${lv}</div><div class="ch-hp">体力 ${hp}/${displayMaxHp}</div><div class="ch-skill">${ch.skills.map(s=>s.name).join(" · ")}${unlockedCount>0?" +"+unlockedCount:""}</div><div class="xp-bar-track"><div class="xp-bar-fill" style="width:${expPct}%"></div></div>`;
if(!injured){
div.onclick=()=>{
G.party.forEach(k=>{
const c=document.querySelectorAll(".char-card");
c.forEach(card=>card.classList.remove("selected"));
});
div.classList.add("selected");
G.selectedChar=key;
if(btn){btn.style.display="";SND.select();}
};
}
el.appendChild(div);
});
}

function confirmCharSelect(){
if(G.charSelectPending!==null&&G.charSelectPending!==undefined){
const n=G.charSelectPending;
G.charSelectPending=null;
SND.flip();
startBattle(n);
}
}

function startBattle(n){
const type=levelType(n);
const bossData=getBoss(n);
// apply buffs
let extraHp=0,extraDraw=0,extraAtk=0,extraDef=0;
if(G.buffs.lingji){bossData={...bossData,hp:Math.max(1,bossData.hp-2)};delete G.buffs.lingji}
if(G.buffs.chechi){bossData={...bossData,hp:Math.max(1,bossData.hp-1)};delete G.buffs.chechi}
if(G.buffs.xishi){bossData={...bossData,hp:Math.max(1,bossData.hp-2)};delete G.buffs.xishi}
if(G.buffs.wenfo){bossData={...bossData,skills:[]};delete G.buffs.wenfo}
if(G.buffs.baohua){extraDraw=1;delete G.buffs.baohua}
if(G.buffs.jingji){extraDraw=1;delete G.buffs.jingji}
if(G.buffs.liangguo){extraDraw=2;delete G.buffs.liangguo}
if(G.buffs.zhenxiang){extraDraw=2;delete G.buffs.zhenxiang}
if(G.buffs.xinmo1){extraAtk=1;delete G.buffs.xinmo1}
if(G.buffs.xinmo2){extraDef=1;delete G.buffs.xinmo2}
if(G.buffs.dingli){extraDef=(extraDef||0)+1;delete G.buffs.dingli}
if(G.buffs.guanyin){G.party.forEach(k=>{const kLv=(G.partyLevel&&G.partyLevel[k])||1;G.partyHp[k]=CHARS[k].maxHp+Math.floor((kLv-1)/2)});delete G.buffs.guanyin}
if(G.buffs.ruolai){G.party.forEach(k=>{const kLv=(G.partyLevel&&G.partyLevel[k])||1;G.partyHp[k]=CHARS[k].maxHp+Math.floor((kLv-1)/2)});delete G.buffs.ruolai}
if(G.buffs.qiyu){G.party.forEach(k=>{const kLv=(G.partyLevel&&G.partyLevel[k])||1;G.partyHp[k]=CHARS[k].maxHp+Math.floor((kLv-1)/2)});delete G.buffs.qiyu}
if(n===81&&G.buffs.tuotai){extraHp=2;delete G.buffs.tuotai}
if(G.buffs.luotai){const pLv2=(G.partyLevel&&G.partyLevel[G.selectedChar])||1;const pMaxHp2=CHARS[G.selectedChar].maxHp+Math.floor((pLv2-1)/2);G.partyHp[G.selectedChar]=Math.min(pMaxHp2,(G.partyHp[G.selectedChar]??pMaxHp2)+1);delete G.buffs.luotai}

G.player=makeCombatant(G.selectedChar,null);
// preserve level bonus maxHp from makeCombatant, only add extraHp
const pLv=(G.partyLevel&&G.partyLevel[G.selectedChar])||1;
const baseMaxHp=CHARS[G.selectedChar].maxHp+Math.floor((pLv-1)/2);
G.player.maxHp=baseMaxHp+extraHp;
G.player.hp=Math.min((G.partyHp[G.selectedChar]??baseMaxHp)+extraHp,G.player.maxHp);
if(G.player.hp<=0)G.player.hp=1;
G.player._atkBuff=extraAtk;
G.player._defBuff=extraDef;
G.player.drawBonus=extraDraw;
G.enemy=makeCombatant(null,bossData);
G.deck=buildDeck();
G.discard=[];
G.log=[];
G.turn="player";
G.awaitingResponse=null;
G.tutorialStep=0;
G.battleId=(G.battleId||0)+1; // unique battle session ID to prevent stale callbacks

// starting hands
const ph=drawFromDeck(4);G.player.hand.push(...ph);
const eh=drawFromDeck(4);G.enemy.hand.push(...eh);

// boss starting equipment
if(bossData.equip){
const ed=CARD_DEF[bossData.equip];
let cls="equip-"+ed.st;
const ec={id:9999,key:bossData.equip,name:ed.n,type:"equip",equipSubtype:ed.st,range:ed.r,suit:"♣",rank:"A",red:false,desc:ed.d,cls:cls};
if(ed.st==="weapon")G.enemy.equipment.weapon=ec;
else if(ed.st==="armor")G.enemy.equipment.armor=ec;
}

showScreen("battle-screen");
log(`第 ${n} 难：${L81_NAMES[n]}`,"log-system");
log(`${G.enemy.name} 出现！体力 ${G.enemy.hp}/${G.enemy.maxHp}`,"log-system");
renderBattle();
setTimeout(()=>{fxBossEntry();SND.flip();SND.boss();fxScreenFlash("rgba(200,64,64,.15)");fxImpact("enemy")},200);
playerTurnStart();
}

function makeCard(key){
const def=CARD_DEF[key];
const suits=CARD_SUITS[key]||[['♠','7']];
const sr=suits[0];
let cls=def.t;
if(def.t==='basic')cls='basic-'+def.st;
if(def.t==='equip')cls='equip-'+def.st;
return{id:Math.random(),key:key,name:def.n,type:def.t,basicSubtype:def.st||null,equipSubtype:def.st||null,range:def.r||null,suit:sr[0],rank:sr[1],red:isRed(sr[0]),desc:def.d,cls:cls};
}

function isTutorialCard(step,card){
if(step===1)return card.key==="sha";
if(step===2)return card.key==="tao";
if(step===3)return card.type==="equip";
return false;
}

const steps=[
null,
{text:"欢迎来到西游杀！这是你的手牌。点击「降妖」对如来发起攻击。",wait:"sha"},
{text:"很好！如来出了遁法抵挡。现在试试用「蟠桃」回复体力。",wait:"tao"},

];
if(step<steps.length){

function showStory(n,customTitle,customText){

const text=customText||STORIES[n]||"";

function afterStory(){
const n=G.level;
if(n===0){
// tutorial done, go to level 1
G.tutorialStep=0;
G.level=1;G.maxLevel=Math.max(G.maxLevel,1);
save();
startLevel(1);
return;
}
if(n===80){
// finale: start level 81
G.level=81;G.maxLevel=Math.max(G.maxLevel,81);
G.buffs.tuotai=true;

startLevel(81);

function showEvent(n){
showScreen("event-screen");
const ev=EVENT_CHOICES[n];
if(!ev){nextLevel();return}
document.getElementById("event-chapter").textContent=`第 ${n} 难`;
document.getElementById("event-title").textContent=ev.title;
document.getElementById("event-text").textContent=ev.text;

ec.innerHTML="";
ev.choices.forEach((choice,i)=>{

ec.appendChild(div);
});
}

function resolveEventChoice(effect){
if(effect.hp){
G.party.forEach(key=>{
const kLv=(G.partyLevel&&G.partyLevel[key])||1;
const kMaxHp=CHARS[key].maxHp+Math.floor((kLv-1)/2);
G.partyHp[key]=Math.max(0,Math.min(kMaxHp,(G.partyHp[key]??kMaxHp)+effect.hp));
});
log(`${effect.hp>0?"回复":"失去"}${Math.abs(effect.hp)}点体力（全队）`,"log-system");
}
if(effect.buff){
G.buffs[effect.buff]=true;
}
if(effect.buff==="guanyin"||effect.buff==="ruolai"||effect.buff==="qiyu"){
G.party.forEach(key=>{const kLv=(G.partyLevel&&G.partyLevel[key])||1;G.partyHp[key]=CHARS[key].maxHp+Math.floor((kLv-1)/2)});
log("全队体力回满！","log-heal");
}
if(effect.buff==="raolu"){
nextLevel();
return;
}
nextLevel();
}

function nextLevel(){
G.level++;
G.maxLevel=Math.max(G.maxLevel,G.level);
// resting characters heal
G.party.forEach(key=>{
const kLv=(G.partyLevel&&G.partyLevel[key])||1;
const kMaxHp=CHARS[key].maxHp+Math.floor((kLv-1)/2);
if(key!==G.selectedChar&&G.partyHp[key]<kMaxHp){
G.partyHp[key]=Math.min(kMaxHp,G.partyHp[key]+1);
}
});
save();
if(G.level>81){
showScreen("victory-screen");
return;
}
startLevel(G.level);
}

function checkLevelUp(charKey){
const lv=(G.partyLevel[charKey]||1);

const exp=G.partyExp[charKey]||0;

if(exp>=need){
G.partyLevel[charKey]=lv+1;
G.partySkillPoints[charKey]=(G.partySkillPoints[charKey]||0)+1;
G.partyExp[charKey]=exp-need;
SND.levelup();fxLevelUpRing();
// show level up popup
const ch=CHARS[charKey];
const newLv=lv+1;
const popup=document.createElement("div");
popup.className="levelup-popup";
popup.innerHTML=`<div class="lu-title">${ch.name} 升级！</div><div class="lu-detail">Lv.${lv} → Lv.${newLv}</div><div class="lu-detail">体力上限+1 · 获得1技能点</div>`;
document.body.appendChild(popup);
setTimeout(()=>{
popup.style.transition="all .4s ease-out";
popup.style.opacity="0";
popup.style.transform="translate(-50%,-50%) scale(.7)";
setTimeout(()=>popup.remove(),400);
},2000);
log(`${ch.name}升级至Lv.${newLv}！体力上限+1，获得1技能点`,"log-heal");
// recursive check for multi-level
checkLevelUp(charKey);
}
}

// ==================== 技能树 ====================
function showSkillTree(charKey){
if(!charKey)charKey=G.selectedChar;
const ch=CHARS[charKey];
const tree=SKILL_TREE[charKey];
if(!tree){showLevelSelect();return}
showScreen("skilltree-screen");
const lv=(G.partyLevel&&G.partyLevel[charKey])||1;
const exp=(G.partyExp&&G.partyExp[charKey])||0;
const pts=(G.partySkillPoints&&G.partySkillPoints[charKey])||0;
const expNeed=EXP_TABLE[lv]||999;
const unlocked=G.partyUnlocked&&G.partyUnlocked[charKey]||{};
document.getElementById("skilltree-title").textContent=ch.name+" · 技能修炼";
const info=document.getElementById("skilltree-info");
info.innerHTML=`<span class="ski-name">${ch.name}</span> <span class="ski-level">Lv.${lv}</span> <span class="ski-pts">技能点: ${pts}</span> <span style="color:var(--text-dim)">${exp}/${expNeed}exp</span>`;
const list=document.getElementById("skilltree-list");
list.innerHTML="";
// char tabs
const tabs=document.createElement("div");
tabs.style.cssText="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap";
G.party.forEach(k=>{
const btn=document.createElement("button");
btn.className="btn-sm"+(k===charKey?"":" btn-dim");
btn.textContent=CHARS[k].name;
btn.onclick=()=>showSkillTree(k);
tabs.appendChild(btn);
});
list.appendChild(tabs);
Object.entries(tree).forEach(([key,node])=>{
const isUnlocked=!!unlocked[key];
const reqMet=!node.req||!!unlocked[node.req];
const curLv=isUnlocked?(typeof unlocked[key]==='number'?unlocked[key]:1):0;
const isMaxLv=node.maxLv&&curLv>=node.maxLv;
const canUnlock=!isUnlocked&&reqMet&&pts>=node.cost;
const canUpgrade=isUnlocked&&!isMaxLv&&pts>=node.cost;
const div=document.createElement("div");
div.className="skill-node"+(isUnlocked?" unlocked":"")+(isUnlocked?"":" locked");
let statusHtml="";
if(isUnlocked){
statusHtml='<span class="skill-node-status owned">已解锁'+(node.maxLv>1?' Lv.'+curLv+'/'+node.maxLv:'')+'</span>';
}else if(!reqMet){
const reqNode=tree[node.req];
statusHtml='<span class="skill-node-status locked">需先解锁'+(reqNode?reqNode.name:node.req)+'</span>';
}else{
statusHtml='<span class="skill-node-status available">可解锁</span>';
}
div.innerHTML=`<div class="skill-node-head"><span class="skill-node-name">${node.name}</span>${statusHtml}</div><div class="skill-node-desc">${node.desc}</div><div class="skill-node-cost">消耗: ${node.cost} 技能点</div>`;
if(!isUnlocked&&canUnlock){
const btn=document.createElement("button");
btn.className="skill-node-btn";
btn.textContent="解锁";
btn.onclick=()=>{
G.partyUnlocked[charKey]=G.partyUnlocked[charKey]||{};
G.partyUnlocked[charKey][key]=node.maxLv?1:true;
G.partySkillPoints[charKey]=pts-node.cost;
SND.skillUnlock();
save();
showSkillTree(charKey);
};
div.appendChild(btn);
}else if(isUnlocked&&!isMaxLv&&canUpgrade){
const btn=document.createElement("button");
btn.className="skill-node-btn";
btn.textContent="升级 → Lv."+(curLv+1);
btn.onclick=()=>{
G.partyUnlocked[charKey][key]=curLv+1;
G.partySkillPoints[charKey]=pts-node.cost;
SND.skillUnlock();
save();
showSkillTree(charKey);
};
div.appendChild(btn);
}
list.appendChild(div);
});
}

// ==================== 账号系统 ====================
const OFFICIAL_CODES=["1101"]; // 解锁官方账号的暗号
const OFFICIAL_ACCOUNTS=[
{id:"official_1",name:"天庭管理员",role:"official",desc:"天庭御赐管理权限"},
{id:"official_2",name:"地府掌簿使",role:"official",desc:"地府生死簿管理权"},
{id:"official_3",name:"灵山执法僧",role:"official",desc:"灵山戒律执行权"},
];

function getAccounts(){
try{const s=localStorage.getItem("xiyousha_accounts");return s?JSON.parse(s):[]}catch(e){return[]}
}
function saveAccounts(list){try{localStorage.setItem("xiyousha_accounts",JSON.stringify(list))}catch(e){}}

function getOfficialAccount(acctId){return OFFICIAL_ACCOUNTS.find(a=>a.id===acctId)}

function showAccount(){

function renderAccount(){
const el=document.getElementById("account-content");

if(current){
// logged in
let html='<div class="acct-card'+(current.role==='official'?' official':'')+'">';
html+='<div class="acct-name">'+current.name;
if(current.role==='official')html+='<span class="acct-badge official">官方</span>';
if(current.banned)html+='<span class="acct-badge banned">已封号</span>';
html+='</div>';
html+='<div class="acct-info">'+(current.desc||'')+'</div>';
html+='<div class="acct-info">关卡进度: '+(current.maxLevel||0)+'/81</div>';
html+='</div>';
html+='<div style="margin-top:12px">';

html+='<button class="btn-sm" onclick="showScreen(\'title-screen\')">返回</button>';
html+='</div>';
// admin panel for officials
if(current.role==='official'&&!current.banned){

if(accounts.length>0){
html+='<div class="acct-admin-panel">';

});

OFFICIAL_ACCOUNTS.forEach(a=>{
if(a.id===current.id)return;
const localAcct=accounts.find(x=>x.id===a.id);
if(!localAcct){
// can't ban non-local officials, skip
}
});
html+='</div>';
}
}
el.innerHTML=html;
}else{

function loginAccount(){

SND.buttonClick();

acct={id:"user_"+Date.now(),name:name,role:"user",maxLevel:0,createdAt:Date.now()};

}

function logoutAccount(){
SND.buttonClick();
setCurrentAccount(null);
renderAccount();
}

function checkUnlockCode(code){
if(OFFICIAL_CODES.includes(code)){
// unlock - pick next available official account
const current=getCurrentAccount();
const accounts=getAccounts();
// find official account not yet claimed
let claimed=accounts.filter(a=>a.role==='official').map(a=>a.id);
// also check current account
if(current&&current.role==='official')claimed.push(current.id);
const available=OFFICIAL_ACCOUNTS.filter(a=>!claimed.includes(a.id));
if(available.length===0){
// all 3 claimed, just switch to first
const pick=OFFICIAL_ACCOUNTS[0];
let acct=accounts.find(a=>a.id===pick.id);
if(!acct){acct={...pick,maxLevel:0,createdAt:Date.now()};accounts.push(acct);saveAccounts(accounts)}
setCurrentAccount(acct);
}else{
const pick=available[0];
const acct={...pick,maxLevel:0,createdAt:Date.now()};
accounts.push(acct);
saveAccounts(accounts);
setCurrentAccount(acct);
}
SND.levelup();
renderAccount();
}
}

function toggleBan(acctId){
const current=getCurrentAccount();
if(!current||current.role!=='official'||current.banned)return;
let accounts=getAccounts();
const acct=accounts.find(a=>a.id===acctId);
if(!acct)return;
// can't ban other officials
if(acct.role==='official')return;
acct.banned=!acct.banned;
saveAccounts(accounts);
SND.flip();
renderAccount();
}

// ==================== 联机对战系统 ====================
const MP={
ws:null,roomCode:null,isHost:false,myId:null,myName:'',myChar:null,
oppName:'',oppChar:null,botMode:false,connected:false,mmTimer:null,mmSearching:false,
mpSelectedChar:'wukong',
genId(){return 'p'+Math.random().toString(36).substr(2,8)},
genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];return r},
publish(topic,msg){try{fetch('https://ntfy.sh/'+topic,{method:'POST',body:JSON.stringify(msg)})}catch(e){}},
subscribe(topic,handler){
if(this.ws){try{this.ws.close()}catch(e){}}
try{
this.ws=new WebSocket('wss://ntfy.sh/'+topic+'/ws');
this.ws.onopen=()=>{this.connected=true};
this.ws.onmessage=(e)=>{
try{const d=JSON.parse(e.data);if(d.event==='message'&&d.message){handler(JSON.parse(d.message))}}catch(err){}};
this.ws.onclose=()=>{this.connected=false;if(G.mpMode&&!this.botMode){if(!G.mpIsHost){mpGuestDisconnected()}else{showResponse('断线','与对手的连接已断开',[{label:'返回',action:function(){mpLeaveBattle()}}])}}else if(this.mmSearching){this.mmSearching=false;if(this.mmTimer){clearTimeout(this.mmTimer);this.mmTimer=null}showResponse('连接断开','匹配期间连接断开',[{label:'返回',action:function(){hideResponse();showMP()}}])}};
this.ws.onerror=()=>{};
}catch(e){}},
disconnect(){
if(this.ws){try{this.ws.close()}catch(e){}}
this.ws=null;this.connected=false;this.roomCode=null;this.isHost=false;this.botMode=false;
this.oppName='';this.oppChar=null;
if(this.mmTimer){clearTimeout(this.mmTimer);this.mmTimer=null}
this.mmSearching=false;},
};

function mpHandleMM(msg){
if(!MP.mmSearching)return;
if(msg.id===MP.myId)return;
if(msg.type==='mm_search'&&msg.ts&&Date.now()-msg.ts>14000)return;
if(msg.type==='mm_search'&&msg.id!==MP.myId){
// use ID comparison to determine host - smaller ID becomes host
if(MP.myId<msg.id){
// I am host
MP.oppName=msg.name;MP.oppChar=msg.char;MP.roomCode=MP.genCode();MP.isHost=true;
MP.mmSearching=false;
if(MP.mmTimer){clearTimeout(MP.mmTimer);MP.mmTimer=null}
MP.publish('xiyousha_mm',{type:'mm_match',id:MP.myId,targetId:msg.id,name:MP.myName,char:MP.myChar,room:MP.roomCode,ts:Date.now()});
setTimeout(function(){MP.subscribe('xiyousha_room_'+MP.roomCode,function(m){mpHandleRoom(m)});setTimeout(function(){mpStartBattle()},500)},300);
}
// if my ID is larger, I wait for the other player's mm_match
}else if(msg.type==='mm_match'&&msg.targetId===MP.myId){
MP.oppName=msg.name;MP.oppChar=msg.char;MP.roomCode=msg.room;MP.isHost=false;
MP.mmSearching=false;
if(MP.mmTimer){clearTimeout(MP.mmTimer);MP.mmTimer=null}
setTimeout(function(){MP.subscribe('xiyousha_room_'+MP.roomCode,function(m){mpHandleRoom(m)})},300);
}
}

function mpHandleRoom(msg){
if(msg.id===MP.myId)return;
if(msg.type==='mp_leave'){
if(G.mpMode){
showResponse('对手离开','对手已断开连接',[{label:'返回',action:function(){hideResponse();mpLeaveBattle()}}]);
}
return;
}
if(msg.type==='mp_chat'){
mpShowChat(msg.name,msg.text);
return;
}
if(MP.isHost){
if(msg.type==='room_join'&&!MP.oppName){
MP.oppName=msg.name;MP.oppChar=msg.char;
if(MP.mmTimer){clearTimeout(MP.mmTimer);MP.mmTimer=null}
MP.publish('xiyousha_room_'+MP.roomCode,{type:'room_accept',id:MP.myId,name:MP.myName,char:MP.myChar,ts:Date.now()});
setTimeout(function(){mpStartBattle()},500);
}
if(msg.type==='mp_action')mpHandleGuestAction(msg);
if(msg.type==='mp_dodge')mpHandleGuestDodge(msg);
}else{
if(msg.type==='room_accept'){
MP.oppName=msg.name;MP.oppChar=msg.char;
if(MP.mmTimer){clearTimeout(MP.mmTimer);MP.mmTimer=null}
}
if(msg.type==='mp_state')mpRenderState(msg.state);
if(msg.type==='mp_end')mpHandleEnd(msg);
}
}

function mpGuestTurnStart(){
const e=G.enemy,p=G.player;
// judge phase
if(e.judge.length>0){
const toResolve=[...e.judge];e.judge=[];
for(const card of toResolve){
const jc=drawFromDeck(1)[0];G.discard.push(jc);
log('判定'+card.name+'：'+jc.suit+jc.rank,'log-system');
if(card.key==='lebu'){if(jc.suit!=='♥'){e.skipPlay=true;log('迷心劫判定非红桃，'+e.name+'跳过出牌阶段','log-system')}G.discard.push(card)}
else if(card.key==='shandian'){if(jc.suit==='♠'&&parseInt(jc.rank)>=2&&parseInt(jc.rank)<=9){damage(e,2,e);log('天雷劫触发，'+e.name+'受2伤','log-damage');G.discard.push(card);if(!e.alive){renderBattle();checkEnd();return}}else{p.judge.push(card);log('天雷劫传给你','log-system')}}
}
renderBattle();
}
const drawN=2+(e.drawBonus||0)+(e._extraDraw||0);
let extraDrawSkill=0;
if(e.skills.some(function(s){return s.key==='chanxin'}))extraDrawSkill++;
const drawn=drawFromDeck(drawN+extraDrawSkill);
e.hand.push(...drawn);
e._extraDraw=0;
e.shaPlayed=false;var _fs3=e.skillUsed.fusheng||0;e.skillUsed={};e.skillUsed.fusheng=_fs3;e._qinglongUsed=false;e._shenbingActive=false;e._luohanActive=false;e._tiedanActive=false;e._shilongActive=false;e._jiuActive=false;
// 唐僧静心诵经
if(e.charKey==='tang'&&e.hp<e.maxHp){e.hp=Math.min(e.maxHp,e.hp+1);log('静心诵经：'+e.name+'回复1点体力','log-heal');SND.heal();fxHeal('enemy');fxHpChange('enemy')}
SND.draw();
log(e.name+'摸了2张牌','log-enemy');
fxTurn('enemy');
setPhase(e.name+'的回合','enemy-turn');
clearFieldCards();
renderBattle();
mpSendState();
if(e.skipPlay){e.skipPlay=false;log(e.name+'被迷心劫影响，跳过出牌阶段','log-system');setTimeout(function(){mpEnemyEndTurn()},800);return}
// wait for guest actions - state already sent
}

function mpSendState(){
if(!MP.isHost||MP.botMode||!MP.connected)return;
const e=G.enemy,p=G.player;
const state={
myHp:e.hp,myMaxHp:e.maxHp,myName:e.name,
myHand:e.hand.map(function(c){return{id:c.id,key:c.key,name:c.name,type:c.type,suit:c.suit,rank:c.rank,red:c.red,cls:c.cls,desc:c.desc,equipSubtype:c.equipSubtype,range:c.range}}),
myEquips:JSON.parse(JSON.stringify(e.equipment)),
myJudge:e.judge.map(function(c){return{name:c.name,key:c.key}}),
mySkills:e.skills?e.skills.map(function(s){return{key:s.key,name:s.name}}):[],
mySkillsDef:e.skillsDef?e.skillsDef.map(function(s){return{key:s.key,name:s.name,perTurn:s.perTurn}}):[],
myShaPlayed:e.shaPlayed,mySkillUsed:e.skillUsed||{},
myChained:!!e._chained,myJiu:!!e._jiuActive,myAtkBuff:e._atkBuff||0,myDefBuff:e._defBuff||0,
myShilong:!!e._shilongActive,myShenbing:!!e._shenbingActive,myLuohan:!!e._luohanActive,myTiedan:!!e._tiedanActive,
oppChained:!!p._chained,oppJiu:!!p._jiuActive,oppAtkBuff:p._atkBuff||0,oppDefBuff:p._defBuff||0,
oppShilong:!!p._shilongActive,oppShenbing:!!p._shenbingActive,oppLuohan:!!p._luohanActive,oppTiedan:!!p._tiedanActive,
myTurn:G.turn==='enemy',
oppHp:p.hp,oppMaxHp:p.maxHp,oppName:p.name,
oppHandCount:p.hand.length,
oppEquips:JSON.parse(JSON.stringify(p.equipment)),
oppJudge:p.judge.map(function(c){return{name:c.name,key:c.key}}),
oppSkills:p.skills?p.skills.map(function(s){return{key:s.key,name:s.name}}):[],
phase:G.phase,
logs:G.log.slice(-12).map(function(l){
// Convert host-perspective logs to guest perspective
var txt=l.msg||'';
// "你" refers to host(p); guest should see host name as "对手"
txt=txt.replace(/你/g,'{HOST}');
// host name -> "你" for guest
var hostName=p.name;
txt=txt.split(hostName).join('你');
txt=txt.replace(/\{HOST\}/g,'对手');
return{msg:txt,cls:l.cls};
}),
deckCount:G.deck.length,
mpChar:MP.myChar,
};
if(G._mpPendingDodge){
state.prompt={type:'dodge',sourceName:p.name,hasShan:hasCard(e,'shan'),qinggang:G._mpPendingDodge.qinggang,fangtian:G._mpPendingDodge.fangtian};
}
if(G._mpDiscardNeed){
state.discardNeed=G._mpDiscardNeed;
state.phase='discard';
}
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_state',id:MP.myId,state:state,ts:Date.now()});
}

function mpRenderState(state){
// Ignore stale state if player already left MP
if(!G.mpMode&&G.screen!=='mp'&&G.screen!=='mp-wait'&&G.screen!=='battle')return;
if(!G.player||!G.mpMode){G=newGameState();G.battleId=(G.battleId||0)+1}
G.mpMode=true;G.mpIsHost=false;G.mpBot=false;G.level='MP';G.tutorialStep=0;
G.player={
hp:state.myHp,maxHp:state.myMaxHp,name:state.myName,
hand:state.myHand||[],
equipment:state.myEquips||{weapon:null,armor:null,mount:null,defMount:null},
judge:(state.myJudge||[]).map(function(c){return{name:c.name,key:c.key,suit:'?',rank:'?',red:false,cls:'',desc:''}}),
skills:state.mySkills||[],
skillUsed:state.mySkillUsed||{},shaPlayed:state.myShaPlayed||false,
_chained:state.myChained||false,_jiuActive:state.myJiu||false,_atkBuff:state.myAtkBuff||0,_defBuff:state.myDefBuff||0,
_shilongActive:state.myShilong||false,_shenbingActive:state.myShenbing||false,_luohanActive:state.myLuohan||false,_tiedanActive:state.myTiedan||false,
alive:state.myHp>0,charKey:MP.myChar||state.mpChar,isEnemy:false,
skillsDef:state.mySkillsDef?state.mySkillsDef.map(function(s){return{key:s.key,name:s.name,perTurn:s.perTurn}}):null,
};
G.enemy={
hp:state.oppHp,maxHp:state.oppMaxHp,name:state.oppName,
hand:new Array(state.oppHandCount||0).fill({key:'unknown',name:'?',suit:'?',rank:'?',red:false,cls:'',type:'unknown',desc:''}),
equipment:state.oppEquips||{weapon:null,armor:null,mount:null,defMount:null},
judge:(state.oppJudge||[]).map(function(c){return{name:c.name,key:c.key,suit:'?',rank:'?',red:false,cls:'',desc:''}}),
skills:state.oppSkills||[],
alive:state.oppHp>0,isEnemy:true,charKey:MP.oppChar,
_chained:state.oppChained||false,_jiuActive:state.oppJiu||false,_atkBuff:state.oppAtkBuff||0,_defBuff:state.oppDefBuff||0,
_shilongActive:state.oppShilong||false,_shenbingActive:state.oppShenbing||false,_luohanActive:state.oppLuohan||false,_tiedanActive:state.oppTiedan||false,
};
G.turn=state.myTurn?'player':'enemy';
G.phase=state.phase||'play';
G.log=state.logs||[];
G.awaitingResponse=null;
G.deck=new Array(state.deckCount||0).fill({});
G.discard=[];
renderBattle();
renderLog();
if(state.skillInfo){
showResponse(state.skillTitle||'技能信息',state.skillInfo,[{label:'知道了',action:function(){hideResponse()}}]);
}else if(state.prompt&&state.prompt.type==='dodge'){
mpShowGuestDodge(state.prompt);
}else if(state.discardNeed){
G.awaitingResponse={type:'discard',need:state.discardNeed};
renderHand();
}
}

function mpShowGuestDodge(prompt){
hideResponse();
var noDodge=prompt.qinggang||prompt.fangtian;
var hasShan=!noDodge&&G.player.hand.some(function(c){return c.key==='shan'});
var canJuanlian=!noDodge&&(G.player.charKey==='shaseng'||G.player.charKey==='bailong'||G.player.charKey==='puti')&&G.player.hand.some(function(c){return !c.red&&c.key!=='shan'});
var canHuntian=!noDodge&&(G.player.charKey==='nezha'||G.player.charKey==='leigong')&&G.player.hand.some(function(c){return c.red&&c.key!=='shan'});
var btns=[];
if(hasShan){
btns.push({label:'出遁法',action:function(){
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_dodge',id:MP.myId,useShan:true,ts:Date.now()});
hideResponse();
}});
}
if(canJuanlian){
btns.push({label:G.player.charKey==='shaseng'?'卷帘之盾(黑牌当遁法)':'龙威护体(黑牌当遁法)',action:function(){
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_dodge',id:MP.myId,useShan:true,juanlian:true,ts:Date.now()});
hideResponse();
}});
}
if(canHuntian){
btns.push({label:G.player.charKey==='leigong'?'遁世(红牌当遁法)':'混天绫(红牌当遁法)',action:function(){
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_dodge',id:MP.myId,useShan:true,huntian:true,ts:Date.now()});
hideResponse();
}});
}
btns.push({label:'受到伤害',danger:true,action:function(){
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_dodge',id:MP.myId,useShan:false,ts:Date.now()});
hideResponse();
}});
var dodgeDesc=noDodge?(prompt.qinggang?'青釭剑：遁法无效！':'方天画戟：遁法无效！'):'';
showResponse('防御',prompt.sourceName+'对你出了降妖！'+(noDodge?' '+dodgeDesc:'')+' 是否出遁法？',btns);
}

function mpHandleGuestAction(msg){
if(!MP.isHost||MP.botMode)return;
if(G.turn!=='enemy'&&msg.action!=='dodge')return;
if(msg.action==='play_card')mpEnemyPlayCard(msg.cardIdx);
else if(msg.action==='end_turn')mpEnemyEndTurn();
else if(msg.action==='use_skill')mpEnemyUseSkill(msg.skillKey,msg.skillParam);
else if(msg.action==='discard')mpEnemyDiscard(msg.cardIdx);
}

function mpHandleGuestDodge(msg){
if(!MP.isHost||MP.botMode)return;
var dodge=G._mpPendingDodge;
if(!dodge)return;
G._mpPendingDodge=null;
var e=G.enemy,p=G.player;
if(msg.useShan){
if(msg.juanlian&&(e.charKey==='shaseng'||e.charKey==='bailong'||e.charKey==='puti')){
var ji=e.hand.findIndex(function(c){return !c.red&&c.key!=='shan'});
if(ji>=0){
var jc=e.hand.splice(ji,1)[0];G.discard.push(jc);
log(e.name+(e.charKey==='shaseng'?'卷帘之盾':'龙威护体')+'：将'+jc.name+'当遁法','log-enemy');
SND.cardDodge();
if(e.equipment.weapon&&e.equipment.weapon.key==='yinyue'&&e.hand.length>0&&p.alive){var yc=e.hand.splice(0,1)[0];G.discard.push(yc);damage(p,1,e);log('银月枪：'+e.name+'弃1牌造成1伤','log-enemy')}
if(dodge.source.equipment&&dodge.source.equipment.weapon&&dodge.source.equipment.weapon.key==='qinglong'&&!dodge.source._qinglongUsed){dodge.source._qinglongUsed=true;dodge.source.shaPlayed=false;log('青龙偃月刀：'+dodge.source.name+'可再出一张降妖','log-player')}
renderBattle();checkEnd();mpSendState();
return;
}
}
if(msg.huntian&&(e.charKey==='nezha'||e.charKey==='leigong')){

G.discard.push(sc);
log(e.name+'出了遁法','log-enemy');

// yinyue: after dodging, discard 1 card to deal 1 damage
if(e.equipment.weapon&&e.equipment.weapon.key==='yinyue'&&e.hand.length>0&&p.alive){
var yc=e.hand.splice(0,1)[0];G.discard.push(yc);
damage(p,1,e);log('银月枪：'+e.name+'弃1牌造成1伤','log-enemy');
}
if(dodge.source.equipment&&dodge.source.equipment.weapon&&dodge.source.equipment.weapon.key==='qinglong'&&!dodge.source._qinglongUsed){dodge.source._qinglongUsed=true;dodge.source.shaPlayed=false;log('青龙偃月刀：'+dodge.source.name+'可再出一张降妖','log-player')}
renderBattle();checkEnd();mpSendState();
return;
}
}
var dmg=1;

if(hasSk(dodge.source,"manniu"))dmg=2;
if(hasSk(dodge.source,"sanmei"))dmg=2;if(hasSk(dodge.source,"huli"))dmg+=1;
if(dodge.source.skills){

}
}
if(dodge.source._atkBuff)dmg+=dodge.source._atkBuff;

if(dodge.source.charKey==='yanwang'&&dodge.source.hp<=2)dmg+=1;
if(dodge.source.charKey==='niulang'&&dodge.source.hp<=2)dmg+=1;

if(hasSk(dodge.source,"jiutou2"))dmg=1;
if(hasSk(e,"xiniu")&&dmg>0)dmg=Math.max(0,dmg-1);
// hanbing (寒冰剑): instead of damage, discard 2 cards

if(weapon&&weapon.key==='hanbing'&&e.hand.length>=2){

if(G.mpIsHost&&!G.mpBot&&MP.connected&&G.enemy.alive)mpSendState();
return;
}
if(dmg>0){damage(e,dmg,dodge.source);onShaDamage(dodge.source,e,dodge.card)}else{log('伤害被完全抵消','log-system')}
renderBattle();checkEnd();

function mpEnemyPlayCard(idx){
var e=G.enemy,p=G.player;
if(idx<0||idx>=e.hand.length)return;
var card=e.hand[idx];
if(card.type==='basic')mpEnemyPlayBasic(idx);
else if(card.type==='trick')mpEnemyPlayTrick(idx);
else if(card.type==='equip')mpEnemyPlayEquip(idx);
else if(card.type==='delay')mpEnemyPlayDelay(idx);
}

function mpEnemyPlayBasic(idx){
var e=G.enemy,p=G.player;
var card=e.hand[idx];
if(!card)return;
if(card.key==='sha'){
var chk=canPlayBasic(e,card);
if(!chk.ok){mpSendState();return}
e.hand.splice(idx,1);G.discard.push(card);e.shaPlayed=true;
log(e.name+'出了降妖！','log-enemy');
SND.cardPlay();
var fc=showFieldCard(card,'enemy');
resolveSha(e,p,card);
setTimeout(function(){removeFieldCard(fc)},1500);
// if host needs to respond to this sha, state will be sent after response
if(G.awaitingResponse||G._mpHostDodging){renderBattle();return}
renderBattle();checkEnd();
if(G.mpMode&&G.mpIsHost&&!G.mpBot&&MP.connected&&G.player.alive)mpSendState();
}else if(card.key==='tao'){
if(e.hp>=e.maxHp){mpSendState();return}
e.hand.splice(idx,1);G.discard.push(card);
var heal=1;
if(e.skills.some(function(s){return s.key==='foen'})&&!(e.skillUsed.foen>0)){heal=2;e.skillUsed.foen=1}
e.hp=Math.min(e.maxHp,e.hp+heal);
log(e.name+'使用蟠桃回复'+heal+'体力','log-heal');
SND.heal();fxHeal('enemy');
var fc=showFieldCard(card,'enemy');
setTimeout(function(){removeFieldCard(fc)},1500);
renderBattle();mpSendState();
}
}

function mpEnemyPlayTrick(idx){

function mpEnemyPlayTrickContinue(idx,card,e,p){
e.hand.splice(idx,1);
if(card.key!=='lebu'&&card.key!=='shandian')G.discard.push(card);

switch(card.key){
case'wuzhong':var dr=drawFromDeck(2);e.hand.push(...dr);log(e.name+'摸了2牌','log-enemy');break;

case'wanjian':var dodged=false;if(p.equipment.armor&&p.equipment.armor.key==='tengjia'){log('藤甲免疫万箭穿云','log-system');dodged=true}else if(p.equipment.armor&&p.equipment.armor.key==='bagua'){var jc=drawFromDeck(1)[0];G.discard.push(jc);if(jc.red){dodged=true}}if(!dodged&&hasCard(p,'shan')){var si4=findCard(p,'shan');var sc2=p.hand.splice(si4,1)[0];G.discard.push(sc2);log('你出了遁法抵挡万箭穿云','log-player');dodged=true}if(!dodged){damage(p,1,e);log('你受万箭穿云1伤','log-damage')}break;
case'taoyuan':p.hp=Math.min(p.maxHp,p.hp+1);e.hp=Math.min(e.maxHp,e.hp+1);log('结义同行，双方各回1体力','log-heal');break;
case'jiedao':if(p.equipment.weapon){var w2=p.equipment.weapon;G.discard.push(w2);p.equipment.weapon=null;log('你的武器被借刀杀人之计拆除','log-enemy')}else{damage(p,1,e);log('你无武器，受1伤','log-damage')}break;
case'juedou':resolveDuel(e,p);break;
case'wugu':var c1=drawFromDeck(1)[0];var c2=drawFromDeck(1)[0];e.hand.push(c1);p.hand.push(c2);log('仙果普降，双方各得1牌','log-heal');break;
case'lebu':p.judge.push(card);log('你被施放迷心劫','log-enemy');break;
case'shandian':p.judge.push(card);log('你被施放天雷劫','log-enemy');break;
case'huogong':if(p.hand.length>0){var shown=p.hand[Math.floor(Math.random()*p.hand.length)];var si5=e.hand.findIndex(function(c){return c.suit===shown.suit});if(si5>=0){var sc3=e.hand.splice(si5,1)[0];G.discard.push(sc3);var hd=1;if(p.equipment.armor&&p.equipment.armor.key==='tengjia')hd=2;damage(p,hd,e);log('火攻命中！你受'+hd+'伤','log-damage')}else{log(e.name+'火攻失败','log-system')}}else{log('你没有手牌，火攻无效','log-system')}break;
case'tiesuo':if(!p._chained){p._chained=true;log('你被连环','log-system')}else{p._chained=false;log('你解除连环','log-system')}break;
case'wuxie':e.hand.splice(idx,0,card);G.discard.pop();log('护身法需要响应锦囊时使用','log-system');break;
}
renderBattle();checkEnd();
if(G.mpMode&&G.mpIsHost&&!G.mpBot&&MP.connected&&G.player.alive)mpSendState();
}

function mpEnemyEndTurn(){
var e=G.enemy,p=G.player;
// tanshi
if(e.charKey==='bajie'&&!(e.skillUsed.tanshi>0)&&hasCard(e,'tao')&&e.hp<e.maxHp){
e.skillUsed.tanshi=1;
var heal=1;
if(e.skills.some(function(s){return s.key==='tanshi_up'}))heal=2;
e.hp=Math.min(e.maxHp,e.hp+heal);
log(e.name+'贪食：额外回'+heal+'血','log-heal');
SND.heal();fxHeal('enemy');
}
// discard phase
if(e.hand.length>e.hp){
G._mpDiscardNeed=e.hand.length-e.hp;
setPhase(e.name+'弃牌阶段','discard');
renderBattle();mpSendState();
return;
}
mpFinishEnemyTurn();
}

function mpEnemyDiscard(idx){
var e=G.enemy;
if(idx<0||idx>=e.hand.length)return;
var card=e.hand.splice(idx,1)[0];
G.discard.push(card);
log(e.name+'弃置'+card.name,'log-enemy');
if(G._mpDiscardNeed){
G._mpDiscardNeed--;
if(G._mpDiscardNeed<=0){
G._mpDiscardNeed=null;
mpFinishEnemyTurn();
}
}
renderBattle();mpSendState();
}

function mpFinishEnemyTurn(){
var e=G.enemy,p=G.player;
if(p._locked){p.hand.push(...p._locked);p._locked=[];log('人种袋中的牌归还','log-system')}
log(e.name+'结束回合','log-enemy');
G.turn='player';G.phase='play';
playerTurnStart();
}

function mpSendChat(text){
if(!MP.connected||MP.botMode||!text.trim())return;
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_chat',id:MP.myId,name:MP.myName,text:text.trim(),ts:Date.now()});
mpShowChat(MP.myName,text.trim());
}
function mpShowChat(name,text){
const box=document.getElementById('mp-chat-box');
if(!box)return;
const div=document.createElement('div');
div.style.cssText='color:#aaa;margin-bottom:3px;word-break:break-all';
div.innerHTML='<span style="color:var(--gold)">'+name+':</span> '+text.replace(/</g,'&lt;');
box.appendChild(div);
box.scrollTop=box.scrollHeight;
while(box.children.length>15)box.removeChild(box.firstChild);
}
function mpToggleChat(){
const box=document.getElementById('mp-chat-box');
if(!box)return;
if(box.style.display==='none'){
box.style.display='block';
box.innerHTML='';
const input=document.createElement('input');
input.type='text';
input.placeholder='输入消息...';
input.style.cssText='width:100%;background:rgba(255,255,255,0.1);border:1px solid var(--gold);color:var(--text-main);border-radius:4px;padding:4px;margin-bottom:4px;font-size:12px';
input.onkeydown=function(e){if(e.key==='Enter'&&input.value.trim()){mpSendChat(input.value);input.value=''}};
box.appendChild(input);
input.focus();
}else{
box.style.display='none';
}
}
function mpLeaveBattle(){
if(MP.connected&&!MP.botMode&&MP.roomCode){
MP.publish('xiyousha_room_'+MP.roomCode,{type:'mp_leave',id:MP.myId,ts:Date.now()});
}
var cb=document.getElementById('mp-chat-btn');if(cb)cb.style.display='none';
var cbox=document.getElementById('mp-chat-box');if(cbox)cbox.style.display='none';
MP.disconnect();
G.mpMode=false;
G._mpHostDodging=false;
showMP();
}

const el=document.getElementById('help-content');
el.innerHTML=`
<h3 style="color:var(--gold);margin:0 0 6px">📖 游戏背景</h3>
<p style="color:var(--text-dim);margin:0 0 14px">取经路上的八十一难，化为牌桌上的生死博弈。你将扮演西游记中的经典角色，运用独特的武将技能，在降妖除魔的旅程中一路西行。</p>

<h3 style="color:var(--gold);margin:0 0 6px">🎴 基础玩法</h3>
<p style="color:var(--text-dim);margin:0 0 6px"><b style="color:var(--text-main)">回合流程：</b>判定阶段 → 摸牌阶段（摸2张）→ 出牌阶段 → 弃牌阶段</p>
<p style="color:var(--text-dim);margin:0 0 6px"><b style="color:var(--text-main)">胜利条件：</b>将敌方体力降至0即可获胜</p>
<p style="color:var(--text-dim);margin:0 0 14px"><b style="color:var(--text-main)">手牌上限：</b>回合结束时手牌数不能超过当前体力值</p>

<h3 style="color:var(--gold);margin:0 0 6px">🃏 卡牌类型</h3>
<p style="margin:0 0 4px"><span style="color:#e85555">■ 基本牌</span></p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>降妖</b>（杀）：对目标造成1点伤害，每回合限出1张</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>遁法</b>（闪）：抵消一张降妖的伤害</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>蟠桃</b>（桃）：回复1点体力</p>
<p style="color:var(--text-dim);margin:0 0 6px;padding-left:12px">• <b>仙酿</b>（酒）：下一张降妖伤害+1，或濒死时回1血</p>
<p style="margin:0 0 4px"><span style="color:#cc66cc">■ 锦囊牌</span></p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>神通自现</b>（无中生有）：摸2张牌</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>拆桥断路</b>（过河拆桥）：弃掉对方1张装备或手牌</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>护身法</b>（无懈可击）：抵消一张锦囊牌</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>迷心劫</b>（乐不思蜀）：跳过目标出牌阶段</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>斗法</b>（决斗）：双方轮流出杀，先不出者受1伤</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>万妖阵</b>（南蛮入侵）：所有目标需出杀，否则受1伤</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>万箭齐发</b>：所有目标需出闪，否则受1伤</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>桃园结义</b>：所有角色回1血</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>五谷丰登</b>：展示牌堆顶N张牌，每人选1张</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>借刀杀人</b>：令目标对另一目标出杀</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>火攻</b>（新）：弃1张同花色牌，对目标造成1伤</p>
<p style="color:var(--text-dim);margin:0 0 6px;padding-left:12px">• <b>铁索连环</b>（新）：将2个目标连环，一伤俱伤</p>
<p style="margin:0 0 4px"><span style="color:#cc9944">■ 装备牌</span></p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>武器</b>：连环火铳/诸葛连弩（无限出杀）、雌雄双剑、寒冰剑、青釭剑、丈八蛇矛、贯石斧、青龙偃月刀、方天画戟（末牌+1伤）、麒麟弓、银月枪（闪后弃牌造伤）、火灵珠（火属性+1对藤甲）</p>
<p style="color:var(--text-dim);margin:0 0 2px;padding-left:12px">• <b>防具</b>：八卦阵（判定红当闪）、玄铁盾（黑杀无效）、藤甲（普通杀无效，火攻+1）</p>
<p style="color:var(--text-dim);margin:0 0 14px;padding-left:12px">• <b>坐骑</b>：祥云/紫金钵（+1防御）、筋斗云/腾云兽（-1进攻）</p>

<h3 style="color:var(--gold);margin:0 0 6px">⚔️ 武将技能（19名武将）</h3>
<p style="color:var(--text-dim);margin:0 0 6px">每个角色拥有独特的武将技能，合理运用技能是制胜关键：</p>
<p style="margin:0 0 2px;padding-left:12px">🐵 <b style="color:var(--text-main)">孙悟空</b>：火眼金睛（查看手牌）、七十二变（变牌）</p>
<p style="margin:0 0 2px;padding-left:12px">🐷 <b style="color:var(--text-main)">猪八戒</b>：天蓬之力（红牌当杀）、贪食（蟠桃回血+1）</p>
<p style="margin:0 0 2px;padding-left:12px">🧔 <b style="color:var(--text-main)">沙和尚</b>：卷帘之盾（黑牌当闪）、流沙护体（弃牌减伤）</p>
<p style="margin:0 0 2px;padding-left:12px">🧑‍🦲 <b style="color:var(--text-main)">唐僧</b>：静心诵经（回合回血）、紧箍咒（弃敌方牌）</p>
<p style="margin:0 0 2px;padding-left:12px">🐉 <b style="color:var(--text-main)">小白龙</b>：龙威护体（黑牌当闪）、化龙一击（杀+1伤）</p>
<p style="margin:0 0 2px;padding-left:12px">🪷 <b style="color:var(--text-main)">观音菩萨</b>：慈悲为怀（回血或摸牌）、净瓶甘露（弃牌回2血）</p>
<p style="margin:0 0 2px;padding-left:12px">👁️ <b style="color:var(--text-main)">二郎神</b>：天眼通（查看手牌）、哮天犬（弃牌造伤）</p>
<p style="margin:0 0 2px;padding-left:12px">🔥 <b style="color:var(--text-main)">哪吒</b>：风火轮（红牌当杀）、混天绫（红牌当闪）</p>
<p style="margin:0 0 2px;padding-left:12px">🐂 <b style="color:var(--text-main)">牛魔王</b>：狂暴（残血+1伤）、铁胆（免疫1伤/回合）</p>
<p style="margin:0 0 2px;padding-left:12px">⭐ <b style="color:var(--text-main)">太白金星</b>：指引（摸2牌）、仙知（查看手牌）</p>
<p style="margin:0 0 2px;padding-left:12px">🧘 <b style="color:var(--text-main)">菩提祖师</b>：传道（弃1摸2）、无相（黑牌当闪）</p>
<p style="margin:0 0 2px;padding-left:12px">💀 <b style="color:var(--text-main)">阎罗王</b>：生死簿（弃敌方1牌）、索命（残血+1伤）</p>
<p style="margin:0 0 2px;padding-left:12px">⚡ <b style="color:var(--text-main)">雷公</b>：雷霆万钧（弃红牌造伤）、遁世（红牌当闪）</p>
<p style="margin:0 0 2px;padding-left:12px">💡 <b style="color:var(--text-main)">电母</b>：电术（弃黑牌摸2）、冰电（黑牌当杀）</p>

function showChangelog(){
SND.buttonClick();
showScreen('changelog-screen');
const el=document.getElementById('changelog-content');
let html='';
CHANGELOG.forEach(function(entry){
let items='';
entry.items.forEach(function(it){
items+='<li><span class="changelog-tag '+it.tag+'">'+(it.tag==='new'?'新增':it.tag==='fix'?'修复':'优化')+'</span>'+it.text+'</li>';
});
html+='<div class="changelog-entry"><div class="changelog-ver">'+entry.ver+'</div><div class="changelog-date">'+entry.date+'</div><ul class="changelog-list">'+items+'</ul></div>';
});
el.innerHTML=html;
}
